<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三界戰場 傭兵統帥傳奇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <!-- 專業金融圖表與時間引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #02050a; font-family: 'Noto Sans TC', sans-serif; color: white; touch-action: none; }
        canvas.three-canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; }
        
        /* 玻璃擬態面板優化 */
        .glass { background: rgba(10, 15, 25, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .glass-sim { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); }
        
        /* 全新自然捲動版面設計，防止擠壓遮擋 */
        .ui-scroll-container { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; z-index: 10; pointer-events: auto; }
        .ui-content-wrapper { display: flex; flex-direction: column; justify-content: space-between; min-height: 100%; padding: 0.5rem; gap: 0.5rem; padding-bottom: 2rem; }
        @media (min-width: 768px) { .ui-content-wrapper { padding: 1.5rem; gap: 1rem; } }
        
        .tab-btn { font-size: 12px; padding: 6px 12px; border-bottom: 2px solid transparent; transition: all 0.3s; color: #888; font-weight: bold; white-space: nowrap; flex: 1; text-align: center; cursor: pointer; }
        .tab-btn.active { color: #eab308; border-color: #eab308; text-shadow: 0 0 10px rgba(234,179,8,0.5); }

        .ind-btn { font-size: 10px; padding: 4px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); transition: all 0.2s; cursor: pointer; color: #aaa; background: rgba(0,0,0,0.3); }
        .ind-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; font-weight: bold; box-shadow: 0 0 10px rgba(59,130,246,0.5); }
        
        @keyframes thunder { 0% { background: rgba(255, 255, 255, 0); } 10% { background: rgba(255, 255, 255, 0.3); } 20% { background: rgba(255, 255, 255, 0); } 100% { background: rgba(255, 255, 255, 0); } }
        @keyframes goldThunder { 0% { background: rgba(234, 179, 8, 0); } 10% { background: rgba(234, 179, 8, 0.4); } 20% { background: rgba(234, 179, 8, 0); } 100% { background: rgba(234, 179, 8, 0); } }
        @keyframes simThunder { 0% { background: rgba(56, 189, 248, 0); } 10% { background: rgba(56, 189, 248, 0.4); } 20% { background: rgba(56, 189, 248, 0); } 100% { background: rgba(56, 189, 248, 0); } }
        
        .thunder-flash { animation: thunder 0.5s ease-out; }
        .gold-thunder-flash { animation: goldThunder 0.8s ease-out; }
        .sim-thunder-flash { animation: simThunder 0.8s ease-out; }
        
        .result-positive { color: #ef4444; text-shadow: 0 0 8px rgba(239,68,68,0.4); }
        .result-negative { color: #22c55e; text-shadow: 0 0 8px rgba(34,197,94,0.4); }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .timeframe-btn { font-size: 11px; padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; cursor: pointer; }
        .timeframe-btn.active { background: #eab308; color: black; border-color: #eab308; font-weight: 900; }
        
        input[type=number], input[type=text] { background: rgba(0,0,0,0.4); box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); transition: all 0.3s; }
        input[type=number]:focus, input[type=text]:focus { background: rgba(255,255,255,0.1); box-shadow: 0 0 10px rgba(234,179,8,0.3), inset 0 2px 4px rgba(0,0,0,0.5); }

        .btn-disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(100%); pointer-events: none; }
    </style>
</head>
<body>

<div id="thunder-overlay" class="fixed inset-0 pointer-events-none z-50 transition-colors duration-500"></div>

<!-- 全新手機優先 UI 佈局 -->
<div id="main-ui" class="ui-scroll-container scrollbar-hide transition-all duration-500">
    <div class="ui-content-wrapper">
        
        <!-- 頂部：資訊與控制區 -->
        <div class="w-full flex-none flex flex-col md:flex-row gap-2 justify-between items-start">
            <div id="main-dashboard" class="glass rounded-xl p-3 w-full md:w-[26rem] shadow-lg transition-all duration-500">
                <div class="flex justify-between items-center mb-2">
                    <span id="market-status-label" class="text-[10px] md:text-xs text-yellow-400 font-bold uppercase tracking-widest bg-yellow-500/20 px-2 py-1 rounded border border-yellow-500/30">判讀時區中</span>
                    <div class="flex gap-1.5">
                        <button onclick="toggleSimMode()" id="sim-btn" class="hidden bg-sky-600 hover:bg-sky-500 px-2.5 py-1.5 rounded text-[10px] text-white font-bold tracking-widest shadow-[0_0_10px_rgba(2,132,199,0.5)] transition-all cursor-pointer">啟動沙盤</button>
                        <button onclick="openChartPage()" class="bg-white/10 hover:bg-white/20 border border-white/20 px-2.5 py-1.5 rounded text-[10px] text-white font-bold tracking-widest transition-all cursor-pointer">軍師圖表</button>
                        <button onclick="showDailySummary()" class="bg-purple-900/50 hover:bg-purple-800 border border-purple-500/40 px-2.5 py-1.5 rounded text-[10px] text-purple-200 font-bold tracking-widest transition-all cursor-pointer">結算大表</button>
                    </div>
                </div>
                
                <div class="flex justify-between items-end mt-2">
                    <div>
                        <div class="text-[10px] text-gray-400 mb-0.5 tracking-wider">人界存銀 天幣</div>
                        <div id="user-balance" class="text-2xl md:text-3xl font-mono font-black text-white">讀取中</div>
                        <div id="frozen-balance" class="text-[9px] text-gray-500 mt-0.5">凍結 0</div>
                    </div>
                    <div id="real-pnl-container" class="flex flex-col items-end">
                        <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">已實現戰果</span>
                        <div id="today-total-result" class="text-xl md:text-2xl font-black font-mono">加 0</div>
                    </div>
                    <div id="sim-pnl-container" class="hidden flex flex-col items-end">
                        <span class="text-[10px] text-sky-400 font-bold uppercase animate-pulse mb-0.5">沙盤累積戰果</span>
                        <div id="sim-total-result" class="text-xl md:text-2xl font-black font-mono text-sky-400 drop-shadow-[0_0_5px_rgba(56,189,248,0.5)]">加 0</div>
                    </div>
                </div>
                
                <div class="mt-3 pt-3 border-t border-white/10 flex gap-2 items-center">
                    <select id="sector-selector" onchange="switchSector(this.value)" class="bg-black/50 border border-white/20 rounded-lg px-2 py-1.5 text-[10px] md:text-xs font-bold text-gray-200 focus:outline-none w-24 md:w-auto truncate cursor-pointer">
                        <option value="SEMICON">半導體</option>
                        <option value="COMPUTER">電腦週邊</option>
                        <option value="NETWORK">通信</option>
                        <option value="CUSTOM">自選</option>
                    </select>
                    <select id="city-selector" onchange="switchCity(this.value)" class="flex-1 bg-black/50 border border-white/20 rounded-lg px-2 py-1.5 text-[11px] md:text-sm font-bold text-white focus:outline-none truncate cursor-pointer"></select>
                    <button onclick="openCustomManager()" class="bg-white/10 hover:bg-white/20 p-1.5 rounded-lg text-white font-bold text-[10px] cursor-pointer">設定</button>
                </div>
                
                <div class="flex justify-between items-center bg-black/40 p-2.5 rounded-lg mt-3 border border-white/10 shadow-inner">
                    <div class="flex items-baseline gap-2">
                        <span id="market-price" class="text-2xl md:text-3xl font-mono font-black text-white">連線中</span>
                        <span id="price-change" class="text-[10px] md:text-[11px] font-bold text-gray-400">0.00 %</span>
                    </div>
                    <div class="text-right flex flex-col items-end">
                        <span id="base-price-label" class="text-[9px] text-gray-500 uppercase font-bold tracking-widest mb-0.5">昨收</span>
                        <span id="base-price-display" class="text-sm md:text-base font-mono font-bold text-gray-300">---</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 中央戰區 (高度解鎖，保持視窗穿透力) -->
        <div class="flex-1 min-h-[40vh] w-full pointer-events-none"></div>

        <!-- 底部：軍令操作與報表區 -->
        <div class="w-full flex-none flex flex-col md:flex-row gap-2">
            
            <div class="glass rounded-xl flex flex-col w-full md:w-96 flex-none h-[30vh] md:h-[35vh]">
                <div class="flex border-b border-white/10 flex-none">
                    <button onclick="switchTab('units')" id="tab-units" class="tab-btn active">未平倉部隊</button>
                    <button onclick="switchTab('history')" id="tab-history" class="tab-btn">歷史戰紀</button>
                    <button onclick="switchTab('pending')" id="tab-pending" class="tab-btn">待命軍令</button>
                </div>
                <div id="tab-container" class="p-2 flex-1 overflow-y-auto scrollbar-hide">
                    <div id="tab-content-units" class="space-y-2"></div>
                    <div id="tab-content-history" class="space-y-2 hidden"></div>
                    <div id="tab-content-pending" class="space-y-2 hidden"></div>
                </div>
            </div>

            <!-- 下單面板 -->
            <div id="order-panel" class="glass rounded-xl p-3 md:p-4 flex flex-col w-full md:flex-1 justify-center gap-3">
                <div class="flex gap-3">
                    <div class="flex flex-col flex-1">
                        <span class="text-[10px] text-gray-400 font-bold uppercase mb-1 ml-1 tracking-widest">派遣營數</span>
                        <input id="order-qty" type="number" value="1" min="1" class="border border-white/20 rounded-lg px-3 py-2 text-lg md:text-xl font-bold outline-none text-center text-white font-mono w-full">
                    </div>
                    <div class="flex flex-col flex-1">
                        <span class="text-[10px] text-gray-400 font-bold uppercase mb-1 ml-1 tracking-widest">進場委託價</span>
                        <input id="order-price" type="number" step="0.5" placeholder="市價" class="border border-white/20 rounded-lg px-3 py-2 text-lg md:text-xl font-bold outline-none text-center text-white font-mono w-full">
                    </div>
                </div>
                <div class="flex gap-3 mt-1">
                    <button id="btn-long" onclick="issueOrder('LONG')" class="flex-1 bg-gradient-to-b from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 active:scale-95 transition-all rounded-xl py-3 md:py-4 flex flex-col items-center justify-center border-b-2 border-red-900 shadow-lg cursor-pointer">
                        <span class="text-[10px] font-bold text-red-200 tracking-widest mb-0.5">護國多軍 (漲獲利)</span>
                        <span id="btn-long-text" class="text-base md:text-xl font-black uppercase tracking-widest text-white drop-shadow-md">入城</span>
                    </button>
                    <button id="btn-short" onclick="issueOrder('SHORT')" class="flex-1 bg-gradient-to-b from-green-600 to-green-800 hover:from-green-500 hover:to-green-700 active:scale-95 transition-all rounded-xl py-3 md:py-4 flex flex-col items-center justify-center border-b-2 border-green-900 shadow-lg cursor-pointer">
                        <span class="text-[10px] font-bold text-green-200 tracking-widest mb-0.5">掠奪空軍 (跌獲利)</span>
                        <span id="btn-short-text" class="text-base md:text-xl font-black uppercase tracking-widest text-white drop-shadow-md">攻掠</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 獨立的軍師戰略圖表頁面 -->
<div id="chart-page" class="fixed inset-0 z-40 bg-[#02050a] flex flex-col hidden transition-all duration-300 transform translate-y-full">
    <div class="flex justify-between items-center p-3 border-b border-white/10 bg-gray-900/80 backdrop-blur-md">
        <div class="flex items-center gap-2">
            <div class="w-1 h-5 bg-yellow-500 rounded-full"></div>
            <h2 class="text-base md:text-lg font-black text-white tracking-widest">軍師戰略室</h2>
        </div>
        <div class="flex items-center gap-2">
            <span id="chart-realtime-price" class="text-yellow-400 font-mono font-bold text-sm">--</span>
            <button onclick="closeChartPage()" class="bg-white/10 border border-white/20 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-white/20 transition-all cursor-pointer">返回戰場</button>
        </div>
    </div>
    
    <div class="flex-1 p-2 md:p-4 overflow-y-auto w-full flex flex-col gap-2">
        <div class="flex justify-between items-center bg-black/40 p-2 rounded-xl border border-white/10">
            <div class="text-lg font-black tracking-wider text-white px-2" id="chart-city-name">城池名稱</div>
            <div class="flex gap-1 overflow-x-auto scrollbar-hide">
                <button onclick="setTimeframe('1m')" class="timeframe-btn active" id="tf-1m">1分</button>
                <button onclick="setTimeframe('5m')" class="timeframe-btn" id="tf-5m">5分</button>
                <button onclick="setTimeframe('15m')" class="timeframe-btn" id="tf-15m">15分</button>
                <button onclick="setTimeframe('60m')" class="timeframe-btn" id="tf-60m">60分</button>
                <button onclick="setTimeframe('1d')" class="timeframe-btn" id="tf-1d">日</button>
                <button onclick="setTimeframe('1wk')" class="timeframe-btn" id="tf-1wk">週</button>
                <button onclick="setTimeframe('1mo')" class="timeframe-btn" id="tf-1mo">月</button>
            </div>
        </div>
        
        <!-- 主圖：K線蠟燭圖 -->
        <div class="flex-1 min-h-[30vh] md:min-h-[40vh] bg-black/50 border border-white/10 p-2 rounded-xl relative flex flex-col shadow-inner">
            <span class="text-[10px] text-gray-400 font-bold uppercase absolute top-2 left-3 z-10 tracking-widest">價格走勢 (紅漲綠跌)</span>
            <div class="flex-1 relative w-full h-full mt-4">
                <canvas id="mainChartCanvas"></canvas>
            </div>
        </div>

        <!-- 獨立成交量表 -->
        <div class="h-[12vh] min-h-[80px] bg-black/50 border border-white/10 p-2 rounded-xl relative flex flex-col shadow-inner">
            <span class="text-[10px] text-gray-400 font-bold uppercase absolute top-2 left-3 z-10 tracking-widest">成交量矩陣</span>
            <div class="flex-1 relative w-full h-full mt-3">
                <canvas id="volumeChartCanvas"></canvas>
            </div>
        </div>
        
        <!-- 副圖：技術指標切換區 -->
        <div class="h-[25vh] min-h-[150px] bg-black/50 border border-white/10 p-2 rounded-xl relative flex flex-col shadow-inner">
            <div class="flex gap-2 absolute top-2 left-3 z-10">
                <button onclick="setIndicator('MACD')" id="btn-ind-MACD" class="ind-btn active">MACD</button>
                <button onclick="setIndicator('KD')" id="btn-ind-KD" class="ind-btn">KD</button>
                <button onclick="setIndicator('RSI')" id="btn-ind-RSI" class="ind-btn">RSI</button>
                <button onclick="setIndicator('BIAS')" id="btn-ind-BIAS" class="ind-btn">BIAS</button>
            </div>
            <div class="flex-1 relative w-full h-full mt-8">
                <canvas id="indicatorChartCanvas"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- 自選城池設定 Modal -->
<div id="custom-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div class="glass rounded-2xl p-5 w-full max-w-sm shadow-2xl border-yellow-500/20">
        <h2 class="text-xl font-black tracking-widest text-center mb-1 text-yellow-400">統帥自選城池</h2>
        <p class="text-[10px] text-gray-400 font-bold mb-4 text-center tracking-widest">僅限輸入台灣股市代號</p>
        <div class="space-y-3 mb-4 bg-black/40 p-4 rounded-xl border border-white/10">
            <input id="custom-symbol" type="text" placeholder="台股代號 如 2603" class="w-full bg-black/60 border border-white/20 rounded-lg px-3 py-2.5 text-white focus:border-yellow-500 outline-none font-mono text-sm uppercase">
            <input id="custom-name" type="text" placeholder="城池名稱 如 長榮" class="w-full bg-black/60 border border-white/20 rounded-lg px-3 py-2.5 text-white focus:border-yellow-500 outline-none text-sm">
            <button onclick="addCustomStock()" class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded-lg font-bold text-sm mt-2 transition-all shadow-lg cursor-pointer">編列入軍</button>
        </div>
        <div class="border-t border-white/10 pt-3">
            <h3 class="text-[10px] text-gray-400 font-bold uppercase mb-2 px-1 tracking-widest">已編制自選陣列</h3>
            <div id="custom-stock-list" class="space-y-2 max-h-40 overflow-y-auto pr-1 scrollbar-hide"></div>
        </div>
        <button onclick="closeCustomManager()" class="mt-5 w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold text-sm transition-all cursor-pointer">完成配置</button>
    </div>
</div>

<!-- API Key 設定 Modal -->
<div id="api-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div class="glass rounded-2xl p-6 w-full max-w-sm border-white/20 shadow-2xl">
        <h2 class="text-xl font-black text-center mb-2 tracking-widest text-sky-400">天道連線金鑰</h2>
        <p class="text-[11px] text-gray-400 mb-5 text-center leading-relaxed">預設使用全域代理爬蟲。<br>若有專屬金鑰可於此填寫。</p>
        <div class="space-y-4">
            <input id="api-key-input" type="text" placeholder="留空使用預設免費通道" class="w-full bg-black/60 border border-white/20 rounded-lg px-4 py-3 text-white focus:border-sky-500 outline-none font-mono text-sm">
            <div class="flex gap-3 pt-2">
                <button onclick="closeApiSettings()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold text-sm transition-colors cursor-pointer">取消</button>
                <button onclick="saveApiKey()" class="flex-1 bg-sky-600 hover:bg-sky-500 py-3 rounded-xl font-bold text-sm text-white shadow-lg transition-colors cursor-pointer">儲存設定</button>
            </div>
        </div>
    </div>
</div>

<!-- 報表 Modal -->
<div id="report-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div id="modal-window" class="glass rounded-2xl p-6 w-full max-w-md border-purple-500/40 transform scale-95 transition-transform duration-300 shadow-[0_0_30px_rgba(168,85,247,0.15)]">
        <div id="modal-body"></div>
        <button onclick="closeModal()" class="mt-6 w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-black text-sm text-white shadow-lg transition-all active:scale-95 cursor-pointer tracking-widest">關閉報表</button>
    </div>
</div>

<!-- 手動報價 Modal (斷線應急) -->
<div id="price-prompt-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div class="glass rounded-2xl p-6 w-full max-w-sm border-sky-500/40 shadow-2xl">
        <h2 class="text-xl font-black text-center mb-2 tracking-widest text-sky-400">天道斷線 請求支援</h2>
        <p class="text-[11px] text-gray-400 mb-5 text-center leading-relaxed">無法取得 <span id="prompt-city-name" class="text-white font-bold"></span> 的真實報價。<br>請統帥即時提供基準平盤價 以啟動沙盤演練。</p>
        <div class="space-y-4">
            <input id="manual-price-input" type="number" step="0.5" placeholder="請輸入基準股價 如 150.5" class="w-full bg-black/60 border border-white/20 rounded-lg px-4 py-3 text-white focus:border-sky-500 outline-none font-mono text-sm text-center">
            <button onclick="submitManualPrice()" class="w-full bg-sky-600 hover:bg-sky-500 py-3 rounded-xl font-bold text-sm text-white shadow-lg transition-colors cursor-pointer tracking-widest">設定基準並進入沙盤</button>
            <button onclick="closePricePrompt()" class="w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold text-sm text-white mt-2 transition-colors cursor-pointer tracking-widest">取消</button>
        </div>
    </div>
</div>

<!-- 吐司訊息 (Toast) -->
<div id="msg-box" class="fixed top-16 md:bottom-24 md:top-auto left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md px-5 py-2.5 rounded-full text-xs md:text-sm font-bold opacity-0 transition-all duration-300 z-[60] pointer-events-none text-center w-max max-w-[85vw] border border-white/20 text-white tracking-widest shadow-[0_10px_25px_rgba(0,0,0,0.8)] whitespace-nowrap"></div>

<script>
// ==========================================
// 1. 全域工具函式與防呆機制
// ==========================================
window.safeNum = function(val, fallback = 0) {
    const n = Number(val);
    return (isNaN(n) || !isFinite(n)) ? fallback : n;
};

let msgTimeout;
window.showMsg = function(t) { 
    const el = document.getElementById('msg-box'); 
    if(!el) return;
    el.innerText = t; 
    el.classList.remove('opacity-0', 'translate-y-4'); 
    el.classList.add('opacity-100', 'translate-y-0');
    if(msgTimeout) clearTimeout(msgTimeout);
    msgTimeout = setTimeout(()=>{

// 3. 史詩級 3D 戰場渲染 (修正視角與陣型)
// ==========================================
let scene, camera, renderer, battleLine;
let baseRedArmy = [], baseGreenArmy = [];
let playerRedArmy = [], playerGreenArmy = []; 
let particles, snowParticles;
let castleGroup, forestGroup;
const MAX_PHALANX_SIZE = 50; 

function getSeason() {
    const m = new Date().getMonth() + 1;
    if(m >= 3 && m <= 5) return 'SPRING';
    if(m >= 6 && m <= 8) return 'SUMMER';
    if(m >= 9 && m <= 11) return 'AUTUMN';
    return 'WINTER';
}

function getPriceTier(price) {
    if(price < 100) return 1;
    if(price <= 200) return 2;
    if(price <= 500) return 3;
    if(price <= 999) return 4;
    return 5;
}

function createCastle(tier, season) {
    const group = new THREE.Group();
    const isWinter = season === 'WINTER';
    const baseColor = isWinter ? 0x8899aa : 0x556677; 
    const mat = new THREE.MeshStandardMaterial({color: baseColor, roughness: 0.7, metalness: 0.3});
    
    const wallHeight = 16 + tier * 2.5; 
    const wall = new THREE.Mesh(new THREE.BoxGeometry(10, wallHeight, 60), mat);
    wall.position.set(-35, wallHeight/2, 0);
    group.add(wall);
    
    for(let z = -25; z <= 25; z+=10) {
        const battlement = new THREE.Mesh(new THREE.BoxGeometry(10, 4, 5), mat);
        battlement.position.set(-35, wallHeight + 2, z); 
        group.add(battlement);
    }
    
    if (tier >= 3) {
        const towerMat = new THREE.MeshStandardMaterial({color: baseColor, roughness: 0.6, metalness: 0.4});
        for(let z of [-30, 30]) {
            const tower = new THREE.Mesh(new THREE.BoxGeometry(14, wallHeight+8, 14), towerMat);
            tower.position.set(-35, (wallHeight+8)/2, z);
            group.add(tower);
        }
    }
    
    if (tier >= 4) {
        const glowColor = tier === 5 ? 0x00ffff : 0xffaa00; 
        const glowMat = new THREE.MeshStandardMaterial({color: glowColor, emissive: glowColor, emissiveIntensity: 2.5});
        const line = new THREE.Mesh(new THREE.BoxGeometry(11, 0.8, 61), glowMat);
        line.position.set(-35, wallHeight * 0.8, 0);
        group.add(line);
    }
    return group;
}

function createForest(season) {
    const group = new THREE.Group();
    const isWinter = season === 'WINTER';
    const trunkMat = new THREE.MeshStandardMaterial({color: isWinter ? 0x777777 : 0x4a2e15, roughness: 1.0}); 
    
    let leafColor = 0x2e8b57;
    if(season === 'SUMMER') leafColor = 0x115522;
    if(season === 'AUTUMN') leafColor = 0xc96b1e;
    if(season === 'WINTER') leafColor = 0xeeeeee;
    
    const leafMat = new THREE.MeshStandardMaterial({color: leafColor, roughness: isWinter? 0.3:0.9, flatShading: true});
    
    for(let i=0; i<45; i++) {
        const tree = new THREE.Group();
        const scale = 1.0 + Math.random()*0.8;
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 4), trunkMat); trunk.position.y = 2;
        const leaves1 = new THREE.Mesh(new THREE.ConeGeometry(4.5, 8, 7), leafMat); leaves1.position.y = 6;
        const leaves2 = new THREE.Mesh(new THREE.ConeGeometry(3.5, 7, 7), leafMat); leaves2.position.y = 10;
        const leaves3 = new THREE.Mesh(new THREE.ConeGeometry(2.5, 5, 7), leafMat); leaves3.position.y = 14;
        tree.add(trunk, leaves1, leaves2, leaves3);
        tree.scale.set(scale, scale, scale); 
        tree.position.set(30 + Math.random()*25, 0, (Math.random()-0.5)*75);
        group.add(tree);
    }
    return group;
}

function createSoldier(colorHex, isPlayer, tier = 1) {
    const group = new THREE.Group();
    let scale = isPlayer ? 2.0 : 1.3; 
    scale *= (1 + (tier - 1) * 0.1); 
    
    const mat = new THREE.MeshStandardMaterial({
        color: colorHex, emissive: isPlayer ? colorHex : 0x000000,
        emissiveIntensity: isPlayer ? 0.6 : 0, metalness: 0.7, roughness: 0.3
    });
    
    const bodyGeo = tier >= 4 ? new THREE.BoxGeometry(0.8*scale, 2.0*scale, 0.8*scale) : new THREE.CylinderGeometry(0.4*scale, 0.6*scale, 2.0*scale, 6);
    const body = new THREE.Mesh(bodyGeo, mat); 
    body.position.y = 1.0 * scale; 
    group.add(body);
    
    const headGeo = tier >= 4 ? new THREE.BoxGeometry(0.7*scale, 0.7*scale, 0.7*scale) : new THREE.DodecahedronGeometry(0.5*scale);
    const head = new THREE.Mesh(headGeo, mat); 
    head.position.y = 2.5 * scale; 
    group.add(head);

    if (isPlayer) {
        const wpnColor = tier >= 4 ? (colorHex === 0xff3333 || colorHex === 0xff2222 ? 0xff4444 : 0x44ff44) : 0xffdd88;
        const wpn = new THREE.Mesh(new THREE.CylinderGeometry(0.06*scale, 0.06*scale, 4.5*scale, 4), new THREE.MeshStandardMaterial({color: wpnColor, emissive: wpnColor, emissiveIntensity: 2}));
        wpn.position.set(0.7*scale, 1.5*scale, 0.6*scale); wpn.rotation.x = Math.PI/3; group.add(wpn);
    }
    group.userData = { isAttacking: false, isPlayer: isPlayer, active: true };
    return group;
}

function initParticles() {
    const geom = new THREE.BufferGeometry();
    const pos = new Float32Array(200 * 3); const vel = [];
    for (let i=0; i<200; i++) { pos[i*3]=0; pos[i*3+1]=-100; pos[i*3+2]=0; vel.push({x:0,y:0,z:0}); }
    geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    particles = new THREE.Points(geom, new THREE.PointsMaterial({color: 0xffffff, size: 1.2, transparent: true, opacity: 0, blending: THREE.AdditiveBlending}));
    particles.userData = { vel: vel, active: false, life: 0 };
    scene.add(particles);
}

function triggerClashParticles(x, side) {
    if(!particles) return;
    particles.position.x = x; particles.material.opacity = 1; particles.material.color.setHex(side==='LONG' ? 0xff6644 : 0x44ff66);
    particles.userData.active = true; particles.userData.life = 1;
    const pos = particles.geometry.attributes.position.array;
    for (let i=0; i<200; i++) {
        pos[i*3] = (Math.random()-0.5)*4; 
        pos[i*3+1] = 1+Math.random()*6; 
        pos[i*3+2] = (Math.random()-0.5)*50;
        particles.userData.vel[i] = { x:(Math.random()-0.5)*4, y:Math.random()*5, z:(Math.random()-0.5)*3 };
    }
    particles.geometry.attributes.position.needsUpdate = true;
}

function updateParticles() {
    if(!particles || !particles.userData.active) return;
    particles.userData.life -= 0.03; particles.material.opacity = Math.max(0, particles.userData.life);
    if(particles.userData.life <= 0) { particles.userData.active = false; return; }
    const pos = particles.geometry.attributes.position.array;
    for (let i=0; i<200; i++) {
        pos[i*3] += particles.userData.vel[i].x; pos[i*3+1] += particles.userData.vel[i].y; pos[i*3+2] += particles.userData.vel[i].z;
        particles.userData.vel[i].y -= 0.2; if(pos[i*3+1]<0) pos[i*3+1]=0;
    }
    particles.geometry.attributes.position.needsUpdate = true;
}

function rebuildEnvironment() {
    const city = CITIES[gameState.activeCity];
    const tier = getPriceTier(safeNum(city?.basePrice, 100));
    const season = getSeason();
    
    if(castleGroup) scene.remove(castleGroup);
    if(forestGroup) scene.remove(forestGroup);
    if(snowParticles) { scene.remove(snowParticles); snowParticles = null; }
    
    castleGroup = createCastle(tier, season);
    forestGroup = createForest(season);
    scene.add(castleGroup);
    scene.add(forestGroup);
    
    if(season === 'WINTER') {
        const geom = new THREE.BufferGeometry();
        const pos = new Float32Array(300 * 3);
        for (let i=0; i<300; i++) { 
            pos[i*3] = (Math.random()-0.5)*150; 
            pos[i*3+1] = Math.random()*60; 
            pos[i*3+2] = (Math.random()-0.5)*120; 
        }
        geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        snowParticles = new THREE.Points(geom, new THREE.PointsMaterial({color: 0xffffff, size: 0.6, transparent: true, opacity: 0.6}));
        scene.add(snowParticles);
    }
    
    baseRedArmy.forEach(m => scene.remove(m)); baseRedArmy = [];
    baseGreenArmy.forEach(m => scene.remove(m)); baseGreenArmy = [];
    spawnBasePhalanx(tier);
    syncPlayerTroopsFromState(tier);
}

function init3D() {
    scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x02050a, 0.010);
    camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.domElement.className = 'three-canvas';
    document.body.appendChild(renderer.domElement);

    // 提亮全局光線
    scene.add(new THREE.AmbientLight(0xffffff, 3.5));
    const dLight = new THREE.DirectionalLight(0xffffff, 5.0); dLight.position.set(20, 100, 40); scene.add(dLight);
    
    const grid = new THREE.GridHelper(200, 80, 0x223344, 0x0a1122); grid.position.y = 0.01; scene.add(grid);
    battleLine = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 70), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 })); scene.add(battleLine);

    // 調整視角，更貼近戰場中心
    camera.position.set(0, 30, 60); camera.lookAt(0, 5, 0);

    initParticles();
    rebuildEnvironment();

    window.addEventListener('resize', onWindowResize, false);
    animate();
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
}

function spawnBasePhalanx(tier) {
    const cols = Math.floor(MAX_PHALANX_SIZE / 5);
    for(let i=0; i<MAX_PHALANX_SIZE; i++) {
        const r = Math.floor(i / cols), c = i % cols, zPos = (c - cols/2 + 0.5) * 4.5;
        const rm = createSoldier(0xdd3333, false, tier); 
        rm.userData.baseX = -10 - r*3; rm.position.set(rm.userData.baseX, 0, zPos); baseRedArmy.push(rm); scene.add(rm);
        const gm = createSoldier(0x33dd33, false, tier); 
        gm.userData.baseX = 10 + r*3; gm.position.set(gm.userData.baseX, 0, zPos); baseGreenArmy.push(gm); scene.add(gm);
    }
}

function spawnPlayerTroop(side, tier) {
    const m = createSoldier(side==='LONG'?0xff2222:0x22ff22, true, tier); m.userData.baseX = side==='LONG' ? -6 : 6; m.position.set(m.userData.baseX, 0, (Math.random()-0.5)*25); scene.add(m);
    if(side==='LONG') playerRedArmy.push(m); else playerGreenArmy.push(m);
}

function syncPlayerTroopsFromState(tier) {
    playerRedArmy.forEach(m => scene.remove(m)); playerGreenArmy.forEach(m => scene.remove(m));
    playerRedArmy = []; playerGreenArmy = [];
    if(!tier) {
        const city = CITIES[gameState.activeCity];
        tier = getPriceTier(safeNum(city?.basePrice, 100));
    }
    gameState.units.forEach(u => { if(u.city === gameState.activeCity) spawnPlayerTroop(u.side, tier); });
}

function triggerAttackAnim(side, magnitude = 1) {
    const attackCount = Math.max(3, Math.min(20, Math.floor(magnitude * 15)));
    const baseArmy = side === 'LONG' ? baseRedArmy : baseGreenArmy;
    const available = baseArmy.filter(m => m.userData.active && !m.userData.isAttacking);
    available.sort((a, b) => side === 'LONG' ? b.position.x - a.position.x : a.position.x - b.position.x);
    const attackers = available.slice(0, attackCount);
    const dir = side === 'LONG' ? 1 : -1; 
    
    attackers.forEach(m => {
        m.userData.isAttacking = true; const origX = m.position.x;
        new TWEEN.Tween(m.position).to({ x: battleLine.position.x - (dir*1.5), y: 3 }, 150).easing(TWEEN.Easing.Quadratic.Out).onComplete(() => {
            new TWEEN.Tween(m.position).to({ x: m.userData.baseX, y: 0 }, 400).easing(TWEEN.Easing.Quadratic.In).onComplete(() => m.userData.isAttacking = false).start();
        }).start();
    });

    const playerArmy = side === 'LONG' ? playerRedArmy : playerGreenArmy;
    playerArmy.forEach(m => {
        if (m.userData.isAttacking) return; m.userData.isAttacking = true; const origX = m.position.x;
        new TWEEN.Tween(m.position).to({ x: origX + dir*6, y: 2.5 }, 150).easing(TWEEN.Easing.Quadratic.Out).yoyo(true).repeat(1).onComplete(() => m.userData.isAttacking = false).start();
    });

    if(attackers.length > 0) {
        triggerClashParticles(battleLine.position.x, side); battleLine.material.color.setHex(0xffffff);
        setTimeout(() => battleLine.material.color.setHex(side==='LONG'?0xef4444:0x22c55e), 200);
    }
}

function updateVisuals() {
    const city = CITIES[gameState.activeCity]; if(!city) return;
    const activeBasePrice = isSimMode ? safeNum(city.simBasePrice, city.basePrice) : safeNum(city.basePrice, 100);
    const p = safeNum(currentPrice, activeBasePrice);
    const diff = activeBasePrice > 0 ? (p - activeBasePrice) / activeBasePrice : 0;
    
    const redActiveCount = Math.floor(Math.min(MAX_PHALANX_SIZE, Math.max(5, (MAX_PHALANX_SIZE/2) + diff * 500)));
    const greenActiveCount = Math.floor(Math.min(MAX_PHALANX_SIZE, Math.max(5, (MAX_PHALANX_SIZE/2) - diff * 500)));
    baseRedArmy.forEach((m, i) => { m.userData.active = (i < redActiveCount); m.visible = m.userData.active; });
    baseGreenArmy.forEach((m, i) => { m.userData.active = (i < greenActiveCount); m.visible = m.userData.active; });

    const drift = safeNum(diff * 300, 0);
    battleLine.position.x += (drift - battleLine.position.x) * 0.15;
    if(!battleLine.material.color.equals(new THREE.Color(0xffffff))) battleLine.material.color.setHex(diff>=0?0xef4444:0x22c55e);

    const shift = drift * 0.4;
    [...baseRedArmy, ...playerRedArmy].forEach(m => { if(!m.userData.isAttacking) m.position.x += ((m.userData.baseX + shift) - m.position.x) * 0.1; });
    [...baseGreenArmy, ...playerGreenArmy].forEach(m => { if(!m.userData.isAttacking) m.position.x += ((m.userData.baseX + shift) - m.position.x) * 0.1; });
}

function animate() { 
    requestAnimationFrame(animate); 
    TWEEN.update(); 
    updateParticles(); 
    if(snowParticles) {
        const pos = snowParticles.geometry.attributes.position.array;
        for(let i=0; i<300; i++) {
            pos[i*3+1] -= 0.2; pos[i*3] -= 0.1; 
            if(pos[i*3+1] < 0) { pos[i*3+1] = 60; pos[i*3] = (Math.random()-0.5)*150; }
        }
        snowParticles.geometry.attributes.position.needsUpdate = true;
    }
    renderer.render(scene, camera); 
}

function getTaiwanTimeStr() { return new Date().toLocaleDateString('zh-TW', {timeZone: 'Asia/Taipei'}); }

function checkTimeEvents() {
    const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Taipei"}));
    const timeNum = now.getHours() * 100 + now.getMinutes();
    const todayStr = getTaiwanTimeStr();

    let newStatus = "CLOSED";
    if (timeNum >= 855 && timeNum < 900) newStatus = "PRE";
    else if (timeNum >= 900 && timeNum < 1330) newStatus = "OPEN";

    if (currentMarketState !== newStatus) {
        if (newStatus === "PRE" && isSimMode) forceCloseSimMode(true);
        if (newStatus === "OPEN") {
            if (isSimMode) forceCloseSimMode(false); 
            processOvernightDividend(todayStr);
            if (gameState.pendingSimReward > 0) {
                gameState.balance += gameState.pendingSimReward; triggerGoldThunder();
                window.showMsg(`開盤天降甘霖 獎勵 ${Math.floor(gameState.pendingSimReward)} 天幣`);
                gameState.pendingSimReward = 0; saveState();
            }
        }
        currentMarketState = newStatus; updateOrderButtonsUI();
    }

    const label = document.getElementById('market-status-label'); const simBtn = document.getElementById('sim-btn');
    if (isSimMode) {
        label.innerText = "沙盤推演 獨立時空"; label.className = "text-[10px] md:text-xs text-sky-300 font-bold uppercase tracking-widest bg-sky-500/20 px-2 py-1 rounded border border-sky-500/30 animate-pulse";
        simBtn.innerText = "結束推演"; simBtn.className = "bg-red-600 hover:bg-red-500 px-2.5 py-1.5 rounded text-[10px] text-white font-bold transition-all shadow-md"; simBtn.classList.remove('hidden');
    } else {
        if (currentMarketState === "OPEN") {

async function fetchRealMarketData() {
    if(isSimMode) return; // 沙盤中不抓資料
    const cityCode = gameState.activeCity; const city = CITIES[cityCode]; if (!city) return;
    let fetchedPrice = null, fetchedBase = null;
    
    try {
        if (USER_API_KEY) {
            const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${cityCode}&token=${USER_API_KEY}`);
            if (res.ok) { const data = await res.json(); if(data.c) { fetchedPrice = data.c; fetchedBase = data.pc; } }
        }
        if (!fetchedPrice) {
            const ySym = /^\d{4}$/.test(cityCode) ? cityCode + '.TW' : cityCode;
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ySym}?interval=1m&range=1d`;
            try {
                const res = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(url)}`);
                if (res.ok) { const data = await res.json(); fetchedPrice = data.chart.result[0].meta.regularMarketPrice; fetchedBase = data.chart.result[0].meta.previousClose; }
            } catch(e) {
                const res2 = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
                if (res2.ok) { const data2 = await res2.json(); fetchedPrice = data2.chart.result[0].meta.regularMarketPrice; fetchedBase = data2.chart.result[0].meta.previousClose; }
            }
        }
    } catch(e) {}
    
    const p = parseFloat(fetchedPrice);
    if (!isNaN(p) && p > 0) {
        city.realPrice = p; city.basePrice = parseFloat(fetchedBase) || city.realPrice;
        if (!isSimMode) { city.price = city.realPrice; currentPrice = city.price; }
    } else {
        if (!city.basePrice || city.basePrice === 0) {
            if (!document.getElementById('price-prompt-modal').classList.contains('opacity-100') && !isSimMode) { openPricePrompt(cityCode); }
        } else if (!isSimMode && !city.autoSimTriggered) {
            window.showMsg("天道連線失敗 自動導入沙盤"); window.toggleSimMode(true); city.autoSimTriggered = true; 
        }
    }
}

function initKbars(city) {
    let tempC = isSimMode ? safeNum(city.simBasePrice, city.basePrice) : safeNum(city.basePrice, 100);
    const volBase = tempC * 0.01;
    let time = Date.now() - 100 * 60000;
    
    if (!city.chartData) city.chartData = {};
    const tfs = ["1m", "5m", "15m", "30m", "60m", "1d", "1wk", "1mo"];
    
    tfs.forEach(tf => {
        let fakeData = [];
        let curC = tempC;
        for(let i=0; i<100; i++){
            let o = curC;
            curC += (Math.random()-0.5) * volBase;
            if(curC <= 0.1) curC = 0.1;
            let h = Math.max(o, curC) + Math.random() * (volBase*0.5);
            let l = Math.min(o, curC) - Math.random() * (volBase*0.5);
            fakeData.push({ x: time + i*60000, o: o, h: h, l: l, c: curC, v: 100+Math.random()*900 });
        }
        city.chartData[tf] = fakeData;
    });
}

function startMarketPolling() {

    apiPollingInterval = setInterval(fetchRealMarketData, 5000); fetchRealMarketData();

function localTick() {
    checkTimeEvents();
    const city = CITIES[gameState.activeCity];
    
    if (isSimMode && city) {
        const bp = safeNum(city.simBasePrice, city.basePrice); const maxDev = bp * 0.05;
        let newPrice = safeNum(city.price, bp) + (Math.random() - 0.5) * safeNum(city.vol, 2.0) * 2;
        if (isNaN(newPrice) || newPrice <= 0.1) newPrice = bp;
        if (newPrice > bp + maxDev) newPrice = bp + maxDev; if (newPrice < bp - maxDev) newPrice = bp - maxDev;
        city.price = newPrice; currentPrice = city.price;
        
        if(city.chartData && city.chartData[gameState.timeframe] && city.chartData[gameState.timeframe].length > 0) {
            let lastBar = city.chartData[gameState.timeframe][city.chartData[gameState.timeframe].length - 1];
            lastBar.c = newPrice;
            lastBar.h = Math.max(lastBar.h, newPrice);
            lastBar.l = Math.min(lastBar.l, newPrice);
            lastBar.v += Math.random() * 10;
        }
    }

    const jumpMag = Math.abs(currentPrice - lastPriceForAnim);
    if (jumpMag > 0.01) {
        if (currentPrice > lastPriceForAnim) triggerAttackAnim('LONG', jumpMag); else triggerAttackAnim('SHORT', jumpMag);
        lastPriceForAnim = currentPrice;
    }

    if (isSimMode || currentMarketState !== "PRE") checkPendingOrders();
    updateVisuals(); 
    if(!document.getElementById('chart-page').classList.contains('hidden')) renderChartInstance();
    updateUI();
}

window.issueOrder = function(side) {
    if (currentMarketState === "CLOSED" && !isSimMode) { window.showMsg("天道休市期間 僅開放沙盤練兵下單"); triggerThunder(); return; }
    const qty = parseInt(document.getElementById('order-qty').value) || 0;
    const tPrice = parseFloat(document.getElementById('order-price').value) || currentPrice;
    if(qty <= 0 || !gameState.activeCity) return;
    const validCurrentPrice = safeNum(currentPrice, safeNum(CITIES[gameState.activeCity]?.basePrice, 100));
    if(gameState.units.find(u => u.city === gameState.activeCity && u.side !== side)){ window.showMsg("立場衝突 請先結算目前兵力"); triggerThunder(); return; }

    const vol = tPrice * qty * 1000;
    const tax = vol * TAX_RATE, fee = vol * FEE_RATE, total = vol + tax + fee;
    if(gameState.balance < total){ window.showMsg("存銀不足 無法派遣"); triggerThunder(); return; }

    let immediate = false;
    if(isSimMode || currentMarketState !== "PRE") {
        if(side === 'LONG' && tPrice >= validCurrentPrice) immediate = true;
        if(side === 'SHORT' && tPrice <= validCurrentPrice) immediate = true;
    }

    if(immediate){
        gameState.balance -= total; executeOrder({ city: gameState.activeCity, side, qty, tax, fee, isSim: isSimMode }, validCurrentPrice); window.showMsg("市價滿足 立即出征");
    } else {
        gameState.balance -= total; gameState.frozen += total;
        gameState.pending.push({ id: Date.now(), city: gameState.activeCity, side, qty, price: tPrice, totalCost: total, tax, fee, isSim: isSimMode }); window.showMsg("進入埋伏 等候滿足價位");
    }
    saveState(); updateUI();
};

function checkPendingOrders() {
    for(let i=gameState.pending.length-1; i>=0; i--){
        const o = gameState.pending[i]; const m = safeNum(CITIES[o.city]?.price, 0);
        if (m <= 0.1) continue;
        if((o.side === 'LONG' && m <= o.price) || (o.side === 'SHORT' && m >= o.price)){
            gameState.pending.splice(i,1); executeOrder(o, m); window.showMsg(`天道撮合 ${CITIES[o.city].name} 入城`); saveState();
        }
    }
}

function executeOrder(o, fP) {
    if(o.totalCost) gameState.frozen -= o.totalCost;
    const vol = fP * o.qty * 1000; const aTax = vol * TAX_RATE, aFee = vol * FEE_RATE;
    if(!isSimMode) gameState.taxTotal += (aTax + aFee);

    gameState.units.push({
        id: Date.now() + Math.random(), city: o.city, side: o.side, qty: o.qty,
        cost: (vol + aTax + aFee) / (o.qty * 1000), entry: fP, tax: aTax, fee: aFee,
        time: new Date().toLocaleTimeString('zh-TW', { hour12: false }), entryDate: getTaiwanTimeStr(), isSim: o.isSim || isSimMode
    });
    
    if(o.city === gameState.activeCity) {
        const city = CITIES[gameState.activeCity];
        const tier = getPriceTier(safeNum(city?.basePrice, 100));
        spawnPlayerTroop(o.side, tier);
    }
    saveState();
}

window.settle = function(id) {
    const idx = gameState.units.findIndex(u => u.id === id); if (idx === -1) return;
    const u = gameState.units[idx]; const city = CITIES[u.city];
    const validPrice = safeNum(city.price, city.basePrice);
    
    const vol = validPrice * u.qty * 1000;
    const isDayTrade = u.entryDate === getTaiwanTimeStr();
    const tax = vol * (isDayTrade ? 0.0015 : TAX_RATE), fee = vol * FEE_RATE;
    // 多空獲利邏輯確認：做多(漲賺)、做空(跌賺)
    const pnl = u.side === 'LONG' ? (validPrice - u.cost)*u.qty*1000 : (u.cost - validPrice)*u.qty*1000;
    
    gameState.balance += (vol - tax - fee); 
    if(!isSimMode) { gameState.taxTotal += (tax + fee); gameState.realizedPnl += pnl; }
    
    const rep = { ...u, exit: validPrice, eTax: tax, eFee: fee, pnl, isDayTrade };
    gameState.history.unshift(rep); gameState.units.splice(idx,1);
    
    if(u.city === gameState.activeCity) removePlayerTroop(u.side);
    saveState(); window.showWarReport(rep); updateUI();
};

window.cancelOrder = function(id) {
    const idx = gameState.pending.findIndex(o => o.id === id); if (idx === -1) return;
    const o = gameState.pending[idx];
    gameState.balance += safeNum(o.totalCost); gameState.frozen -= safeNum(o.totalCost);

};

// ==========================================
// 6. 專業 Chart.js 金融圖表引擎 (含 K線蠟燭圖)
// ==========================================
let mainChart = null;
let indChart = null;
let volChart = null;

function calcEMA(data, period) {
    if(data.length === 0) return [];
    let k = 2 / (period + 1), ema = [data[0]];
    for(let i=1; i<data.length; i++) ema.push(data[i] * k + ema[i-1] * (1-k));
    return ema;
}
function calcSMA(data, period) {
    let sma = [];
    for(let i=0; i<data.length; i++) {
        if(i < period - 1) { sma.push(data[i]); continue; }
        let sum = 0; for(let j=0; j<period; j++) sum += data[i-j];
        sma.push(sum/period);
    }
    return sma;
}
function calcMACD(data) {
    if(data.length < 26) return { macd: [], signal: [], hist: [] };
    let ema12 = calcEMA(data, 12); let ema26 = calcEMA(data, 26);
    let macd = ema12.map((v, i) => v - ema26[i]);
    let signal = calcEMA(macd, 9);
    let hist = macd.map((v, i) => v - signal[i]);
    return { macd, signal, hist };
}
function calcRSI(data, period) {
    if(data.length < period) return new Array(data.length).fill(50);
    let rsi = []; let gains = 0, losses = 0;
    for(let i=1; i<=period; i++) {
        let diff = data[i] - data[i-1];
        if(diff >= 0) gains += diff; else losses -= diff;
    }
    let avgGain = gains/period, avgLoss = losses/period;
    rsi.push(100 - (100 / (1 + (avgLoss === 0 ? 999 : avgGain/avgLoss))));
    for(let i=period+1; i<data.length; i++) {
        let diff = data[i] - data[i-1];
        avgGain = (avgGain * (period-1) + (diff>=0?diff:0)) / period;
        avgLoss = (avgLoss * (period-1) + (diff<0?-diff:0)) / period;
        let rs = avgLoss === 0 ? 999 : avgGain/avgLoss;
        rsi.push(100 - (100 / (1 + rs)));
    }
    return new Array(period).fill(50).concat(rsi);
}
function calcKD(data, period = 9) {
    if(data.length < period) return { k: new Array(data.length).fill(50), d: new Array(data.length).fill(50) };
    let k = [], d = [], prevK = 50, prevD = 50;
    for(let i=0; i<data.length; i++) {
        let start = Math.max(0, i - period + 1);
        let slice = data.slice(start, i+1);
        let high = Math.max(...slice), low = Math.min(...slice);
        let rsv = (high === low) ? 50 : ((data[i] - low) / (high - low)) * 100;
        let currK = (2/3)*prevK + (1/3)*rsv; let currD = (2/3)*prevD + (1/3)*currK;
        k.push(currK); d.push(currD); prevK = currK; prevD = currD;
    }
    return { k, d };
}
function calcBIAS(data, period) {
    if(data.length < period) return new Array(data.length).fill(0);
    let sma = calcSMA(data, period);
    return data.map((v, i) => sma[i] > 0 ? ((v - sma[i]) / sma[i]) * 100 : 0);
}

window.fetchFullChartData = async function() {
    if(isSimMode) return; // 沙盤中不覆蓋歷史圖表，由模擬引擎推動
    const cityCode = gameState.activeCity; const city = CITIES[cityCode]; if (!city) return;
    
    const map = { "1m":{i:"1m",r:"1d"}, "5m":{i:"5m",r:"5d"}, "15m":{i:"15m",r:"5d"}, "30m":{i:"30m",r:"1mo"}, "60m":{i:"60m",r:"1mo"}, "1d":{i:"1d",r:"6mo"}, "1wk":{i:"1wk",r:"2y"}, "1mo":{i:"1mo",r:"5y"} };
    const prm = map[gameState.timeframe] || map["1d"];
    
    try {
        const ySym = /^\d{4}$/.test(cityCode) ? cityCode + '.TW' : cityCode;
        const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ySym}?interval=${prm.i}&range=${prm.r}`;
        let data = null;
        try {
            const res = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(url)}`);
            if (res.ok) data = await res.json();
        } catch(e) {
            const res2 = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
            if (res2.ok) data = await res2.json();
        }
        
        if (data && data.chart.result) {
            const result = data.chart.result[0];
            const meta = result.meta;
            let fetchedBase = meta.previousClose;
            
            const timestamps = result.timestamp || [];
            const quote = result.indicators.quote[0] || {};
            let ohlcData = [];
            for(let i=0; i<timestamps.length; i++) {
                // 剔除斷層 (null 值)
                if (quote.close[i] !== null && quote.close[i] !== undefined) {
                    let o = safeNum(quote.open[i], fetchedBase);
                    let h = safeNum(quote.high[i], fetchedBase);
                    let l = safeNum(quote.low[i], fetchedBase);
                    let c = safeNum(quote.close[i], fetchedBase);
                    let v = safeNum(quote.volume[i], 0);
                    if (c > 0) {
                        ohlcData.push({ x: timestamps[i] * 1000, o, h, l, c, v });
                    }
                }
            }
            if(ohlcData.length > 0) city.chartData[gameState.timeframe] = ohlcData;
        }
    } catch(e) {}
    
    if(!city.chartData || !city.chartData[gameState.timeframe] || city.chartData[gameState.timeframe].length < 10) {
        if(city.basePrice > 0) initKbars(city);
    }

    if(!document.getElementById('chart-page').classList.contains('hidden')) renderChartInstance();
};

window.renderChartInstance = function() {
    const city = CITIES[gameState.activeCity]; if(!city || !city.chartData[gameState.timeframe]) return;
    const rawData = city.chartData[gameState.timeframe];
    if (rawData.length < 10) return;
    
    // 使用字串標籤，強迫圖表將資料點作為分類(category)排列，徹底消除週末/盤後的空白斷層
    const labels = rawData.map(d => {
        const date = new Date(d.x);
        return gameState.timeframe.includes('m') ? date.toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit'}) : date.toLocaleDateString('zh-TW', {month:'2-digit', day:'2-digit'});
    });
    
    // x 軸塞字串，配合 type: 'category' 消除時間軸留白
    const candleData = rawData.map((d, i) => ({ x: labels[i], o: d.o, h: d.h, l: d.l, c: d.c }));
    const twColors = { up: 'rgba(239, 68, 68, 1)', down: 'rgba(34, 197, 94, 1)', unchanged: 'rgba(156, 163, 175, 1)' };

    const ctxMain = document.getElementById('mainChartCanvas').getContext('2d');
    if(mainChart) mainChart.destroy();
    mainChart = new Chart(ctxMain, {
        type: 'candlestick',
        data: { datasets: [{ label: 'Price', data: candleData, color: twColors, borderColor: twColors }] },
        options: { 
            animation: false, // 關閉動畫，解決跳閃問題
            responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, 
            scales: { x: { type: 'category', display: false, labels: labels }, y: { position: 'right', grid: { color: 'rgba(255,255,255,0.1)' } } } 
        }
    });

    const ctxVol = document.getElementById('volumeChartCanvas').getContext('2d');
    if(volChart) volChart.destroy();
    const volumeColors = rawData.map(d => d.c >= d.o ? 'rgba(239, 68, 68, 0.7)' : 'rgba(34, 197, 94, 0.7)');
    volChart = new Chart(ctxVol, {
        type: 'bar',
        data: { labels: labels, datasets: [{ data: rawData.map(d => d.v), backgroundColor: volumeColors, barPercentage: 0.8 }] },
        options: { 
            animation: false,
            responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, 
            scales: { x: { type: 'category', display: false }, y: { position: 'right', grid: { display: false }, ticks: { display: false } } } 
        }
    });

    const ctxInd = document.getElementById('indicatorChartCanvas').getContext('2d');
    if(indChart) indChart.destroy();
    
    const closePrices = rawData.map(d => d.c);
    let datasets = [];
    const activeInd = gameState.activeIndicator;
    
    if (activeInd === "MACD") {
        const { macd, signal, hist } = calcMACD(closePrices);
        datasets = [
            { type: 'bar', label: 'Hist', data: hist, backgroundColor: hist.map(v => v >= 0 ? 'rgba(239,68,68,0.6)' : 'rgba(34,197,94,0.6)') },
            { type: 'line', label: 'MACD', data: macd, borderColor: '#fff', borderWidth: 1.5, pointRadius: 0, tension: 0.2 },
            { type: 'line', label: 'Signal', data: signal, borderColor: '#facc15', borderWidth: 1.5, pointRadius: 0, tension: 0.2 }
        ];
    } else if (activeInd === "KD") {
        const { k, d } = calcKD(closePrices);
        datasets = [
            { type: 'line', label: 'K', data: k, borderColor: '#38bdf8', borderWidth: 1.5, pointRadius: 0, tension: 0.2 },
            { type: 'line', label: 'D', data: d, borderColor: '#fb923c', borderWidth: 1.5, pointRadius: 0, tension: 0.2 }
        ];
    } else if (activeInd === "RSI") {
        const rsi5 = calcRSI(closePrices, 5);
        const rsi10 = calcRSI(closePrices, 10);
        datasets = [ 
            { type: 'line', label: 'RSI 5', data: rsi5, borderColor: '#c084fc', borderWidth: 1.5, pointRadius: 0, tension: 0.2 },
            { type: 'line', label: 'RSI 10', data: rsi10, borderColor: '#38bdf8', borderWidth: 1.5, pointRadius: 0, tension: 0.2 }
        ];
    } else if (activeInd === "BIAS") {
        const bias5 = calcBIAS(closePrices, 5);
        const bias10 = calcBIAS(closePrices, 10);
        const bias20 = calcBIAS(closePrices, 20);
        datasets = [ 
            { type: 'line', label: 'BIAS 5', data: bias5, borderColor: '#fff', borderWidth: 1.5, pointRadius: 0, tension: 0.2 },
            { type: 'line', label: 'BIAS 10', data: bias10, borderColor: '#facc15', borderWidth: 1.5, pointRadius: 0, tension: 0.2 },
            { type: 'line', label: 'BIAS 20', data: bias20, borderColor: '#ec4899', borderWidth: 1.5, pointRadius: 0, tension: 0.2 }
        ];
    }

    indChart = new Chart(ctxInd, {
        data: { labels: labels, datasets: datasets },
        options: { 
            animation: false,
            responsive: true, maintainAspectRatio: false, 
            plugins: { legend: { display: true, position: 'top', labels: { color: '#ccc', font: { size: 9 } } } }, 
            scales: { x: { type: 'category', display: false }, y: { position: 'right', grid: { color: 'rgba(255,255,255,0.1)' } } } 
        }
    });
};

window.setIndicator = function(ind) {
    gameState.activeIndicator = ind; 
    document.querySelectorAll('.ind-btn').forEach(b => b.classList.remove('active')); 
    document.getElementById(`btn-ind-${ind}`).classList.add('active');

window.setTimeframe = function(tf) {

// 7. 結算與報表
// ==========================================
window.showWarReport = function(d) {
    const color = d.pnl >= 0 ? 'result-positive' : 'result-negative';
    const tag1 = d.isSim ? '<span class="bg-sky-500/20 text-sky-400 px-1.5 py-0.5 rounded text-[10px] ml-1 border border-sky-500/30 tracking-widest">沙盤推演</span>' : '';
    const tag2 = d.isDayTrade ? '<span class="bg-yellow-500/20 text-yellow-400 px-1.5 py-0.5 rounded text-[10px] ml-1 border border-yellow-500/30 tracking-widest">當沖降稅</span>' : '';
    document.getElementById('modal-body').innerHTML = `
        <h2 class="text-xl font-black text-center mb-4 tracking-widest text-white drop-shadow-md">結算紀實 ${tag1}${tag2}</h2>
        <div class="grid grid-cols-2 gap-3 text-xs font-bold bg-black/40 p-5 rounded-2xl border border-white/10 shadow-inner">
            <div class="flex flex-col"><span class="text-[9px] text-gray-500 tracking-widest mb-1">征戰地</span><span class="text-base text-gray-200">${CITIES[d.city]?.name || d.city}</span></div>
            <div class="flex flex-col text-right"><span class="text-[9px] text-gray-500 tracking-widest mb-1">立場</span><span class="text-base ${d.side==='LONG'?'text-red-400':'text-green-400'}">${d.side==='LONG'?'做多':'做空'}</span></div>
            <div class="border-t border-white/10 pt-3 flex flex-col"><span class="text-[9px] text-gray-500 tracking-widest mb-1">入場均價</span><span class="font-mono text-base text-gray-200">${safeNum(d.entry,0).toFixed(2)}</span></div>
            <div class="border-t border-white/10 pt-3 flex flex-col text-right"><span class="text-[9px] text-gray-500 tracking-widest mb-1">結算價位</span><span class="font-mono text-base text-gray-200">${safeNum(d.exit,0).toFixed(2)}</span></div>
            <div class="col-span-2 border-t border-white/10 pt-3 flex flex-col items-center"><span class="text-[9px] text-gray-500 tracking-widest mb-1">離場稅費貢獻</span><span class="font-mono text-base text-gray-400">${Math.floor(safeNum(d.eTax)+safeNum(d.eFee)).toLocaleString()}</span></div>
        </div>
        <div class="mt-5 p-5 bg-gradient-to-b from-white/10 to-transparent rounded-2xl text-center border border-white/5 shadow-inner">
            <div class="text-[10px] text-gray-400 uppercase font-black tracking-widest mb-1">本次戰果</div>
            <div class="text-3xl font-black ${color} drop-shadow-md">${d.pnl>=0?'加':'減'} ${Math.abs(Math.floor(safeNum(d.pnl,0))).toLocaleString()}</div>
        </div>`;
    document.getElementById('report-modal').classList.remove('opacity-0','pointer-events-none');
    document.getElementById('modal-window').classList.replace('scale-95', 'scale-100');
};

window.showDailySummary = function() {
    const wins = gameState.history.filter(h => h.pnl > 0 && !h.isSim).length;
    const reals = gameState.history.filter(h => !h.isSim).length;
    const rate = reals === 0 ? 0 : (wins / reals * 100);
    
    let realUnrealized = 0;
    gameState.units.forEach(u => { 
        if(!u.isSim) {
            const c = CITIES[u.city];
            if(c) {
                const cp = safeNum(c.price, c.basePrice);
                realUnrealized += (u.side==='LONG' ? (cp - u.cost) : (u.cost - cp)) * u.qty * 1000;
            }
        }
    });

    document.getElementById('modal-body').innerHTML = `
        <h2 class="text-xl font-black text-center mb-4 tracking-widest text-purple-300 drop-shadow-[0_0_8px_rgba(216,180,254,0.5)]">實戰結算大表</h2>
        <div class="space-y-4 bg-black/40 p-5 rounded-2xl border border-purple-500/20 text-sm shadow-inner">
            <div class="flex justify-between border-b border-white/10 pb-2"><span class="text-gray-400 font-bold tracking-widest">實戰派遣</span><span class="font-mono text-gray-200">${reals} 次</span></div>
            <div class="flex justify-between border-b border-white/10 pb-2"><span class="text-gray-400 font-bold tracking-widest">平均勝率</span><span class="text-yellow-500 font-mono drop-shadow-md">${rate.toFixed(1)} %</span></div>
            <div class="flex justify-between border-b border-white/10 pb-2"><span class="text-gray-400 font-bold tracking-widest">未實現戰果</span><span class="font-mono font-bold ${realUnrealized>=0?'text-red-400':'text-green-400'}">${Math.floor(realUnrealized).toLocaleString()}</span></div>
            <div class="flex justify-between border-b border-white/10 pb-2"><span class="text-gray-400 font-bold tracking-widest">已實現戰果</span><span class="font-mono font-bold ${gameState.realizedPnl>=0?'text-red-500':'text-green-500'}">${Math.floor(safeNum(gameState.realizedPnl,0)).toLocaleString()}</span></div>
            <div class="flex justify-between pt-1"><span class="text-purple-300 font-bold tracking-widest">累計貢獻稅費</span><span class="text-purple-400 font-mono font-black drop-shadow-md">${Math.floor(safeNum(gameState.taxTotal,0)).toLocaleString()}</span></div>
        </div>`;
    document.getElementById('report-modal').classList.remove('opacity-0','pointer-events-none');
    document.getElementById('modal-window').classList.replace('scale-95', 'scale-100');
};

window.closeModal = function() { 
    document.getElementById('report-modal').classList.add('opacity-0','pointer-events-none'); 
    document.getElementById('modal-window').classList.replace('scale-100', 'scale-95'); 
};

window.openApiSettings = function() { document.getElementById('api-modal').classList.remove('opacity-0', 'pointer-events-none'); document.getElementById('api-key-input').value = USER_API_KEY; };
window.closeApiSettings = function() { document.getElementById('api-modal').classList.add('opacity-0', 'pointer-events-none'); };
window.saveApiKey = function() { 
    USER_API_KEY = String(document.getElementById('api-key-input').value).trim().replace(/[^a-zA-Z0-9_\-]/g, ''); 
    localStorage.setItem('abula_api_key', USER_API_KEY); closeApiSettings(); window.showMsg("設定已儲存"); fetchRealMarketData(); 
};

window.openCustomManager = function() { document.getElementById('custom-modal').classList.remove('opacity-0', 'pointer-events-none'); renderCustomList(); };
window.closeCustomManager = function() { document.getElementById('custom-modal').classList.add('opacity-0', 'pointer-events-none'); if(gameState.activeSector === 'CUSTOM') switchSector('CUSTOM'); };
window.addCustomStock = function() {
    const cleanSym = String(document.getElementById('custom-symbol').value).trim().toUpperCase().replace(/[^A-Z0-9\.]/g, ''); 
    const cleanName = String(document.getElementById('custom-name').value).trim().replace(/[<>]/g, '');
    if (!cleanSym || !cleanName) { window.showMsg("請輸入有效台股代號"); return; }
    if (!CITIES[cleanSym]) CITIES[cleanSym] = { name: cleanName, price: 0, basePrice: 0, realPrice: 0, simBasePrice: 0, vol: 2.0, chartData: {}, autoSimTriggered: false };
    else CITIES[cleanSym].name = cleanName;
    if (!SECTORS["CUSTOM"].cities.includes(cleanSym)) SECTORS["CUSTOM"].cities.push(cleanSym);
    localStorage.setItem('abula_custom_stocks', JSON.stringify(SECTORS["CUSTOM"].cities.map(sym => ({ symbol: sym, name: CITIES[sym].name }))));
    document.getElementById('custom-symbol').value = ''; document.getElementById('custom-name').value = ''; window.showMsg(`已編列 ${cleanName}`); renderCustomList();
};
window.removeCustomStock = function(sym) {
    const idx = SECTORS["CUSTOM"].cities.indexOf(sym);
    if (idx > -1) { SECTORS["CUSTOM"].cities.splice(idx, 1); localStorage.setItem('abula_custom_stocks', JSON.stringify(SECTORS["CUSTOM"].cities.map(s => ({ symbol: s, name: CITIES[s].name })))); window.showMsg(`已移出 ${sym}`); renderCustomList(); }
};
function renderCustomList() {
    const list = document.getElementById('custom-stock-list'); list.innerHTML = '';
    SECTORS["CUSTOM"].cities.forEach(sym => {
        list.innerHTML += `<div class="flex justify-between items-center bg-black/40 p-2.5 rounded-lg border border-white/5"><div class="flex flex-col"><span class="text-xs font-bold text-yellow-500">${sym}</span><span class="text-[10px] text-gray-400 mt-0.5">${CITIES[sym].name}</span></div><button onclick="removeCustomStock('${sym}')" class="text-[10px] bg-red-900/50 hover:bg-red-800 border border-red-500/30 px-3 py-1.5 rounded-md text-red-200 transition-colors cursor-pointer">移除</button></div>`;
    });
}

window.switchTab = function(t) {
    gameState.currentTab = t; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById(`tab-${t}`).classList.add('active');
    ['units','history','pending'].forEach(x => { const el = document.getElementById(`tab-content-${x}`); if(el) el.classList.add('hidden'); });
    const content = document.getElementById(`tab-content-${t}`); if(content) content.classList.remove('hidden'); renderLists();
};

function updateUI() {
    const city = CITIES[gameState.activeCity]; if(!city) return;
    document.getElementById('user-balance').innerText = Math.floor(safeNum(gameState.balance)).toLocaleString();
    document.getElementById('frozen-balance').innerText = `凍結 ${Math.floor(safeNum(gameState.frozen)).toLocaleString()}`;
    
    const activeBasePrice = isSimMode ? safeNum(city.simBasePrice, city.basePrice) : safeNum(city.basePrice, 100);
    document.getElementById('base-price-display').innerText = activeBasePrice.toFixed(2);
    
    document.getElementById('market-price').innerText = safeNum(currentPrice).toFixed(2);
    
    const pct = activeBasePrice > 0 ? ((safeNum(currentPrice, activeBasePrice) - activeBasePrice)/activeBasePrice*100) : 0;
    const elPct = document.getElementById('price-change');
    elPct.innerText = `${Math.abs(safeNum(pct,0)).toFixed(2)} %`;
    elPct.className = `text-[10px] md:text-[11px] font-bold mt-0.5 ${pct >= 0 ? 'text-red-500' : 'text-green-500'}`;

    let realUnrealized = 0, simUnrealized = 0;
    gameState.units.forEach(u => { 
        const c = CITIES[u.city];
        if (c) {
            const cp = safeNum(c.price, c.basePrice);
            const profit = (u.side==='LONG' ? (cp - u.cost) : (u.cost - cp)) * u.qty * 1000;
            if (u.isSim) simUnrealized += profit; else realUnrealized += profit;
        }
    });

    const realTot = safeNum(gameState.realizedPnl) + realUnrealized;
    const elRealTot = document.getElementById('today-total-result');
    if (elRealTot) {
        elRealTot.innerText = `${realTot >= 0 ? '加' : '減'} ${Math.abs(Math.floor(realTot)).toLocaleString()}`;
        elRealTot.className = `text-sm md:text-lg font-black font-mono drop-shadow-md ${realTot >= 0 ? 'text-red-500' : 'text-green-500'}`;
    }

    if (isSimMode) {
        const simNetValue = safeNum(gameState.balance) + safeNum(gameState.frozen);
        const realNetValue = safeNum(realStateSnapshot?.balance) + safeNum(realStateSnapshot?.frozen);
        const simProfit = simNetValue - realNetValue + simUnrealized;
        const elSimTot = document.getElementById('sim-total-result');
        if (elSimTot) {
            elSimTot.innerText = `${simProfit >= 0 ? '加' : '減'} ${Math.abs(Math.floor(simProfit)).toLocaleString()}`;
            elSimTot.className = `text-lg md:text-xl font-black font-mono drop-shadow-[0_0_5px_rgba(56,189,248,0.5)] ${simProfit >= 0 ? 'text-sky-400' : 'text-red-400'}`;
        }
    }
    renderLists();
}

function renderLists() {
    const cont = document.getElementById(`tab-content-${gameState.currentTab}`); if(!cont) return; cont.innerHTML = '';
    
    if(gameState.currentTab === 'units'){
        if(gameState.units.length === 0) {
            cont.innerHTML = '<div class="text-[10px] text-gray-600 text-center py-8 font-bold tracking-widest">目前無駐紮部隊</div>';
        } else {
            gameState.units.forEach(u => {
                const c = CITIES[u.city]; 
                const m = c ? safeNum(c.price, c.basePrice) : safeNum(u.entry, 0);
                const costVal = safeNum(u.cost);
                const principal = costVal * u.qty * 1000;
                
                // 獲利邏輯：做多(m - cost)、做空(cost - m)
                const p = (u.side==='LONG' ? (m-costVal) : (costVal-m))*u.qty*1000;
                const roi = principal > 0 ? (p / principal) * 100 : 0;
                const roiStr = roi >= 0 ? `+${roi.toFixed(2)} %` : `${roi.toFixed(2)} %`;
                const totalValue = principal + p; 
                
                const tag = u.isSim ? '<span class="bg-sky-500/20 border border-sky-500/30 text-sky-400 px-1.5 py-0.5 rounded text-[8px] ml-1 tracking-widest">沙盤推演</span>' : '';
                
                cont.innerHTML += `
                <div class="bg-black/40 rounded-xl p-3 md:p-4 border-r-4 ${p>=0?'border-red-500':'border-green-500'} mb-3 shadow-inner">
                    <div class="flex justify-between items-start border-b border-white/10 pb-2 mb-2">
                        <div>
                            <div class="flex items-center gap-1.5 mb-1">
                                <span class="text-sm text-gray-200 font-bold">${c?.name || u.city}</span>
                                <span class="${u.side==='LONG'?'text-red-400 bg-red-400/10':'text-green-400 bg-green-400/10'} px-1.5 py-0.5 rounded text-[10px] font-bold tracking-widest">${u.side==='LONG'?'做多':'做空'}</span>
                                ${tag}
                            </div>
                            <div class="text-[10px] text-gray-400 tracking-widest">派遣 <span class="text-white font-mono">${safeNum(u.qty).toFixed(1)}</span> 營</div>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <span class="text-[9px] text-gray-500 tracking-widest mb-0.5">未實現戰功</span>
                            <div class="text-sm md:text-base font-black font-mono ${p>=0?'text-red-500':'text-green-500'}">${p>=0?'加':'減'} ${Math.abs(Math.floor(safeNum(p))).toLocaleString()}</div>
                            <div class="text-[10px] font-bold ${p>=0?'text-red-400':'text-green-400'}">${roiStr}</div>
                        </div>
                    </div>
                    <div class="flex justify-between text-[10px] mb-3 px-1">
                        <div class="flex flex-col">
                            <span class="text-gray-500 tracking-widest mb-0.5">均價成本</span>
                            <span class="text-gray-200 font-mono">${costVal.toFixed(2)}</span>
                        </div>
                        <div class="flex flex-col text-center">
                            <span class="text-gray-500 tracking-widest mb-0.5">目前市價</span>
                            <span class="text-gray-200 font-mono">${m.toFixed(2)}</span>
                        </div>
                        <div class="flex flex-col text-right">
                            <span class="text-gray-500 tracking-widest mb-0.5">帳面戰力</span>
                            <span class="text-gray-200 font-mono">${Math.floor(totalValue).toLocaleString()}</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <button onclick="settle(${u.id})" class="text-[10px] bg-white/10 hover:bg-white/20 border border-white/20 px-4 py-2 rounded-lg transition-colors font-bold text-gray-300 tracking-widest cursor-pointer">結算撤軍</button>
                    </div>
                </div>`;
            });
        }
    } else if(gameState.currentTab === 'history'){
        if(gameState.history.length === 0) cont.innerHTML = '<div class="text-[10px] text-gray-600 text-center py-8 font-bold tracking-widest">尚無作戰紀錄</div>';
        gameState.history.slice(0, 15).forEach(h => {
            const tag = h.isSim ? '<span class="text-sky-400 font-bold">沙盤</span>' : '<span class="text-gray-400 font-bold">實戰</span>';
            cont.innerHTML += `<div class="bg-black/30 rounded-lg p-3 border-r-2 border-gray-600 text-right text-[10px] mb-2 opacity-80 shadow-inner">
                <span class="text-gray-500 font-mono tracking-tighter mr-2">${h.time}</span>
                <span class="text-gray-300 mr-2">${CITIES[h.city]?.name || h.city}</span>
                ${tag} <span class="font-mono font-bold text-[11px] ${h.pnl>=0?'text-red-400':'text-green-400'} ml-2">${Math.floor(safeNum(h.pnl)).toLocaleString()}</span>
            </div>`;
        });
    } else if(gameState.currentTab === 'pending'){
        if(gameState.pending.length === 0) cont.innerHTML = '<div class="text-[10px] text-gray-600 text-center py-8 font-bold tracking-widest">無待命軍令</div>';
        gameState.pending.forEach(o => {
            const tag = o.isSim ? '<span class="bg-sky-500/20 border border-sky-500/30 text-sky-400 px-1.5 py-0.5 rounded text-[8px] ml-2">沙盤推演</span>' : '';
            cont.innerHTML += `<div class="bg-black/40 rounded-xl p-3 border-r-4 border-gray-500 text-right mb-2 flex justify-between items-center shadow-inner">
                <button onclick="cancelOrder(${o.id})" class="text-[10px] bg-red-900/30 hover:bg-red-800/50 border border-red-500/30 text-red-300 px-3 py-1.5 rounded-lg transition-colors font-bold cursor-pointer">撤回</button>
                <div class="text-[11px] text-gray-300 font-bold">${CITIES[o.city]?.name || o.city} <span class="text-gray-500 ml-1 text-[9px] tracking-widest">待命價</span> <span class="font-mono text-sm">${safeNum(o.price).toFixed(2)}</span> ${tag}</div>
            </div>`;
        });
    }
}

window.onload = () => { loadState(); init3D(); window.switchSector("SEMICON"); startMarketPolling(); setInterval(localTick, 1000); updateOrderButtonsUI(); };
</script>
