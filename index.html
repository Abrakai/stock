<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三界戰場 傭兵統帥傳奇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <!-- 專業金融圖表與時間引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #02050a; font-family: 'Noto Sans TC', sans-serif; color: white; touch-action: none; }
        canvas.three-canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; }
        
        .glass { background: rgba(10, 15, 25, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .glass-sim { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); }
        
        .ui-scroll-container { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; z-index: 10; pointer-events: auto; }
        .ui-content-wrapper { display: flex; flex-direction: column; justify-content: space-between; min-height: 100%; padding: 0.5rem; gap: 0.5rem; padding-bottom: 2rem; }
        @media (min-width: 768px) { .ui-content-wrapper { padding: 1.5rem; gap: 1rem; } }
        
        .tab-btn { font-size: 12px; padding: 6px 12px; border-bottom: 2px solid transparent; transition: all 0.3s; color: #888; font-weight: bold; white-space: nowrap; flex: 1; text-align: center; cursor: pointer; }
        .tab-btn.active { color: #eab308; border-color: #eab308; text-shadow: 0 0 10px rgba(234,179,8,0.5); }

        .ind-btn { font-size: 10px; padding: 4px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); transition: all 0.2s; cursor: pointer; color: #aaa; background: rgba(0,0,0,0.3); }
        .ind-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; font-weight: bold; box-shadow: 0 0 10px rgba(59,130,246,0.5); }
        
        .timeframe-btn { font-size: 11px; padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; cursor: pointer; }
        .timeframe-btn.active { background: #eab308; color: black; border-color: #eab308; font-weight: 900; }
        
        input[type=number], input[type=text] { background: rgba(0,0,0,0.4); box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); transition: all 0.3s; color: white; border: 1px solid rgba(255,255,255,0.1); }
        input[type=number]:focus, input[type=text]:focus { background: rgba(255,255,255,0.1); box-shadow: 0 0 10px rgba(234,179,8,0.3), inset 0 2px 4px rgba(0,0,0,0.5); border-color: #eab308; outline: none; }

        .btn-disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(100%); pointer-events: none; }
        
        @keyframes thunder { 0% { background: rgba(255, 255, 255, 0); } 10% { background: rgba(255, 255, 255, 0.3); } 20% { background: rgba(255, 255, 255, 0); } 100% { background: rgba(255, 255, 255, 0); } }
        @keyframes goldThunder { 0% { background: rgba(234, 179, 8, 0); } 10% { background: rgba(234, 179, 8, 0.4); } 20% { background: rgba(234, 179, 8, 0); } 100% { background: rgba(234, 179, 8, 0); } }
        @keyframes simThunder { 0% { background: rgba(56, 189, 248, 0); } 10% { background: rgba(56, 189, 248, 0.4); } 20% { background: rgba(56, 189, 248, 0); } 100% { background: rgba(56, 189, 248, 0); } }
        
        .thunder-flash { animation: thunder 0.5s ease-out; }
        .gold-thunder-flash { animation: goldThunder 0.8s ease-out; }
        .sim-thunder-flash { animation: simThunder 0.8s ease-out; }
        
        .result-positive { color: #ef4444; text-shadow: 0 0 8px rgba(239,68,68,0.4); }
        .result-negative { color: #22c55e; text-shadow: 0 0 8px rgba(34,197,94,0.4); }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

<div id="thunder-overlay" class="fixed inset-0 pointer-events-none z-50 transition-colors duration-500"></div>

<!-- 全新手機優先 UI 佈局 (捲動防遮擋) -->
<div id="main-ui" class="ui-scroll-container scrollbar-hide transition-all duration-500">
    <div class="ui-content-wrapper">
        
        <!-- 頂部：資訊與控制區 -->
        <div class="w-full flex-none flex flex-col md:flex-row gap-2 justify-between items-start">
            <div id="main-dashboard" class="glass rounded-xl p-3 w-full md:w-[26rem] shadow-lg transition-all duration-500">
                <div class="flex justify-between items-center mb-2">
                    <span id="market-status-label" class="text-[10px] md:text-xs text-yellow-400 font-bold uppercase tracking-widest bg-yellow-500/20 px-2 py-1 rounded border border-yellow-500/30">判讀時區中</span>
                    <div class="flex gap-1.5">
                        <button onclick="window.toggleSimMode()" id="sim-btn" class="hidden bg-sky-600 hover:bg-sky-500 px-2.5 py-1.5 rounded text-[10px] text-white font-bold tracking-widest shadow-[0_0_10px_rgba(2,132,199,0.5)] transition-all cursor-pointer">啟動沙盤</button>
                        <button onclick="window.openChartPage()" class="bg-white/10 hover:bg-white/20 border border-white/20 px-2.5 py-1.5 rounded text-[10px] text-white font-bold tracking-widest transition-all cursor-pointer">軍師圖表</button>
                        <button onclick="window.showDailySummary()" class="bg-purple-900/50 hover:bg-purple-800 border border-purple-500/40 px-2.5 py-1.5 rounded text-[10px] text-purple-200 font-bold tracking-widest transition-all cursor-pointer">結算大表</button>
                    </div>
                </div>
                
                <div class="flex justify-between items-end mt-2">
                    <div>
                        <div class="text-[10px] text-gray-400 mb-0.5 tracking-wider">人界存銀 天幣</div>
                        <div id="user-balance" class="text-2xl md:text-3xl font-mono font-black text-white">讀取中</div>
                        <div id="frozen-balance" class="text-[9px] text-gray-500 mt-0.5">凍結 0</div>
                    </div>
                    <div id="real-pnl-container" class="flex flex-col items-end">
                        <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">已實現戰果</span>
                        <div id="today-total-result" class="text-xl md:text-2xl font-black font-mono">加 0</div>
                    </div>
                    <div id="sim-pnl-container" class="hidden flex flex-col items-end">
                        <span class="text-[10px] text-sky-400 font-bold uppercase animate-pulse mb-0.5">沙盤累積戰果</span>
                        <div id="sim-total-result" class="text-xl md:text-2xl font-black font-mono text-sky-400 drop-shadow-[0_0_5px_rgba(56,189,248,0.5)]">加 0</div>
                    </div>
                </div>
                
                <div class="mt-3 pt-3 border-t border-white/10 flex gap-2 items-center">
                    <select id="sector-selector" onchange="window.switchSector(this.value)" class="bg-black/50 border border-white/20 rounded-lg px-2 py-1.5 text-[10px] md:text-xs font-bold text-gray-200 focus:outline-none w-24 md:w-auto truncate cursor-pointer">
                        <option value="SEMICON">半導體</option>
                        <option value="COMPUTER">電腦週邊</option>
                        <option value="NETWORK">通信</option>
                        <option value="CUSTOM">自選</option>
                    </select>
                    <select id="city-selector" onchange="window.switchCity(this.value)" class="flex-1 bg-black/50 border border-white/20 rounded-lg px-2 py-1.5 text-[11px] md:text-sm font-bold text-white focus:outline-none truncate cursor-pointer"></select>
                    <button onclick="window.openCustomManager()" class="bg-white/10 hover:bg-white/20 p-1.5 rounded-lg text-white font-bold text-[10px] cursor-pointer">設定</button>
                </div>
                
                <div class="flex justify-between items-center bg-black/40 p-2.5 rounded-lg mt-3 border border-white/10 shadow-inner">
                    <div class="flex items-baseline gap-2">
                        <span id="market-price" class="text-2xl md:text-3xl font-mono font-black text-white">連線中</span>
                        <span id="price-change" class="text-[10px] md:text-[11px] font-bold text-gray-400">0.00 %</span>
                    </div>
                    <div class="text-right flex flex-col items-end">
                        <span id="base-price-label" class="text-[9px] text-gray-500 uppercase font-bold tracking-widest mb-0.5">昨收</span>
                        <span id="base-price-display" class="text-sm md:text-base font-mono font-bold text-gray-300">---</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 中央戰區 (高度解鎖，保持視窗穿透力) -->
        <div class="flex-1 min-h-[40vh] w-full pointer-events-none"></div>

        <!-- 底部：軍令操作與報表區 -->
        <div class="w-full flex-none flex flex-col md:flex-row gap-2">
            
            <div class="glass rounded-xl flex flex-col w-full md:w-96 flex-none h-[35vh] md:h-[40vh]">
                <div class="flex border-b border-white/10 flex-none">
                    <button onclick="window.switchTab('units')" id="tab-units" class="tab-btn active">戰力整編</button>
                    <button onclick="window.switchTab('history')" id="tab-history" class="tab-btn">歷史戰紀</button>
                    <button onclick="window.switchTab('pending')" id="tab-pending" class="tab-btn">待命軍令</button>
                </div>
                <div id="tab-container" class="p-2 flex-1 overflow-y-auto scrollbar-hide">
                    <div id="tab-content-units" class="space-y-2"></div>
                    <div id="tab-content-history" class="space-y-2 hidden"></div>
                    <div id="tab-content-pending" class="space-y-2 hidden"></div>
                </div>
            </div>

            <!-- 下單面板 -->
            <div id="order-panel" class="glass rounded-xl p-3 md:p-4 flex flex-col w-full md:flex-1 justify-center gap-3">
                <div class="flex gap-3">
                    <div class="flex flex-col flex-1">
                        <span class="text-[10px] text-gray-400 font-bold uppercase mb-1 ml-1 tracking-widest">派遣營數</span>
                        <input id="order-qty" type="number" value="1" min="1" class="border border-white/20 rounded-lg px-3 py-2 text-lg md:text-xl font-bold outline-none text-center text-white font-mono w-full">
                    </div>
                    <div class="flex flex-col flex-1">
                        <span class="text-[10px] text-gray-400 font-bold uppercase mb-1 ml-1 tracking-widest">委託進場價</span>
                        <input id="order-price" type="number" step="0.5" placeholder="市價" class="border border-white/20 rounded-lg px-3 py-2 text-lg md:text-xl font-bold outline-none text-center text-white font-mono w-full">
                    </div>
                </div>
                <div class="flex gap-3 mt-1">
                    <button id="btn-long" onclick="window.issueOrder('LONG')" class="flex-1 bg-gradient-to-b from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 active:scale-95 transition-all rounded-xl py-3 md:py-4 flex flex-col items-center justify-center border-b-2 border-red-900 shadow-lg cursor-pointer">
                        <span class="text-[10px] font-bold text-red-200 tracking-widest mb-0.5">護國多軍 (漲獲利)</span>
                        <span id="btn-long-text" class="text-base md:text-xl font-black uppercase tracking-widest text-white drop-shadow-md">入城</span>
                    </button>
                    <button id="btn-short" onclick="window.issueOrder('SHORT')" class="flex-1 bg-gradient-to-b from-green-600 to-green-800 hover:from-green-500 hover:to-green-700 active:scale-95 transition-all rounded-xl py-3 md:py-4 flex flex-col items-center justify-center border-b-2 border-green-900 shadow-lg cursor-pointer">
                        <span class="text-[10px] font-bold text-green-200 tracking-widest mb-0.5">掠奪空軍 (跌獲利)</span>
                        <span id="btn-short-text" class="text-base md:text-xl font-black uppercase tracking-widest text-white drop-shadow-md">攻掠</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 獨立的軍師戰略圖表頁面 -->
<div id="chart-page" class="fixed inset-0 z-40 bg-[#02050a] flex flex-col hidden transition-all duration-300 transform translate-y-full">
    <div class="flex justify-between items-center p-3 border-b border-white/10 bg-gray-900/80 backdrop-blur-md">
        <div class="flex items-center gap-2">
            <div class="w-1 h-5 bg-yellow-500 rounded-full"></div>
            <h2 class="text-base md:text-lg font-black text-white tracking-widest">軍師戰略室</h2>
        </div>
        <div class="flex items-center gap-2">
            <span id="chart-realtime-price" class="text-yellow-400 font-mono font-bold text-sm">--</span>
            <button onclick="window.closeChartPage()" class="bg-white/10 border border-white/20 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-white/20 transition-all cursor-pointer">返回戰場</button>
        </div>
    </div>
    
    <div class="flex-1 p-2 md:p-4 overflow-y-auto w-full flex flex-col gap-2">
        <div class="flex justify-between items-center bg-black/40 p-2 rounded-xl border border-white/10">
            <div class="text-lg font-black tracking-wider text-white px-2" id="chart-city-name">城池名稱</div>
            <div class="flex gap-1 overflow-x-auto scrollbar-hide">
                <button onclick="window.setTimeframe('1m')" class="timeframe-btn" id="tf-1m">1分</button>
                <button onclick="window.setTimeframe('5m')" class="timeframe-btn" id="tf-5m">5分</button>
                <button onclick="window.setTimeframe('15m')" class="timeframe-btn" id="tf-15m">15分</button>
                <button onclick="window.setTimeframe('60m')" class="timeframe-btn" id="tf-60m">60分</button>
                <button onclick="window.setTimeframe('1d')" class="timeframe-btn active" id="tf-1d">日</button>
                <button onclick="window.setTimeframe('1wk')" class="timeframe-btn" id="tf-1wk">週</button>
                <button onclick="window.setTimeframe('1mo')" class="timeframe-btn" id="tf-1mo">月</button>
            </div>
        </div>
        
        <!-- 主圖：K線蠟燭圖 -->
        <div class="flex-1 min-h-[30vh] md:min-h-[40vh] bg-black/50 border border-white/10 p-2 rounded-xl relative flex flex-col shadow-inner">
            <span class="text-[10px] text-gray-400 font-bold uppercase absolute top-2 left-3 z-10 tracking-widest">價格走勢 (紅漲綠跌)</span>
            <div class="flex-1 relative w-full h-full mt-4">
                <canvas id="mainChartCanvas"></canvas>
            </div>
        </div>

        <!-- 獨立成交量表 -->
        <div class="h-[12vh] min-h-[80px] bg-black/50 border border-white/10 p-2 rounded-xl relative flex flex-col shadow-inner">
            <span class="text-[10px] text-gray-400 font-bold uppercase absolute top-2 left-3 z-10 tracking-widest">成交量矩陣</span>
            <div class="flex-1 relative w-full h-full mt-3">
                <canvas id="volumeChartCanvas"></canvas>
            </div>
        </div>
        
        <!-- 副圖：技術指標切換區 -->
        <div class="h-[25vh] min-h-[150px] bg-black/50 border border-white/10 p-2 rounded-xl relative flex flex-col shadow-inner">
            <div class="flex gap-2 absolute top-2 left-3 z-10">
                <button onclick="window.setIndicator('MACD')" id="btn-ind-MACD" class="ind-btn active">MACD</button>
                <button onclick="window.setIndicator('KD')" id="btn-ind-KD" class="ind-btn">KD</button>
                <button onclick="window.setIndicator('RSI')" id="btn-ind-RSI" class="ind-btn">RSI</button>
                <button onclick="window.setIndicator('BIAS')" id="btn-ind-BIAS" class="ind-btn">BIAS</button>
            </div>
            <div class="flex-1 relative w-full h-full mt-8">
                <canvas id="indicatorChartCanvas"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- 自選城池設定 Modal -->
<div id="custom-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div class="glass rounded-2xl p-5 w-full max-w-sm shadow-2xl border-yellow-500/20">
        <h2 class="text-xl font-black tracking-widest text-center mb-1 text-yellow-400">統帥自選城池</h2>
        <p class="text-[10px] text-gray-400 font-bold mb-4 text-center tracking-widest">僅限輸入台灣股市代號</p>
        <div class="space-y-3 mb-4 bg-black/40 p-4 rounded-xl border border-white/10 mt-4">
            <input id="custom-symbol" type="text" placeholder="台股代號 如 2603" class="w-full bg-black/60 border border-white/20 rounded-lg px-3 py-2.5 text-white focus:border-yellow-500 outline-none font-mono text-sm uppercase">
            <input id="custom-name" type="text" placeholder="城池名稱 如 長榮" class="w-full bg-black/60 border border-white/20 rounded-lg px-3 py-2.5 text-white focus:border-yellow-500 outline-none text-sm">
            <button onclick="window.addCustomStock()" class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded-lg font-bold text-sm mt-2 transition-all shadow-lg cursor-pointer">編列入軍</button>
        </div>
        <div class="border-t border-white/10 pt-3">
            <h3 class="text-[10px] text-gray-400 font-bold uppercase mb-2 px-1 tracking-widest">已編制自選陣列</h3>
            <div id="custom-stock-list" class="space-y-2 max-h-40 overflow-y-auto pr-1 scrollbar-hide"></div>
        </div>
        <button onclick="window.closeCustomManager()" class="mt-5 w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold text-sm transition-all cursor-pointer">完成配置</button>
    </div>
</div>

<!-- API Key 設定 Modal -->
<div id="api-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div class="glass rounded-2xl p-6 w-full max-w-sm border-white/20 shadow-2xl">
        <h2 class="text-xl font-black text-center mb-2 tracking-widest text-sky-400">天道連線金鑰</h2>
        <p class="text-[11px] text-gray-400 mb-5 text-center leading-relaxed">預設使用全域代理爬蟲。<br>若有專屬金鑰可於此填寫。</p>
        <div class="space-y-4">
            <input id="api-key-input" type="text" placeholder="留空使用預設免費通道" class="w-full bg-black/60 border border-white/20 rounded-lg px-4 py-3 text-white focus:border-sky-500 outline-none font-mono text-sm">
            <div class="flex gap-3 pt-2">
                <button onclick="window.closeApiSettings()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold text-sm transition-colors cursor-pointer">取消</button>
                <button onclick="window.saveApiKey()" class="flex-1 bg-sky-600 hover:bg-sky-500 py-3 rounded-xl font-bold text-sm text-white shadow-lg transition-colors cursor-pointer">儲存設定</button>
            </div>
        </div>
    </div>
</div>

<!-- 報表 Modal -->
<div id="report-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div id="modal-window" class="glass rounded-2xl p-6 w-full max-w-md border-purple-500/40 transform scale-95 transition-transform duration-300 shadow-[0_0_30px_rgba(168,85,247,0.15)]">
        <div id="modal-body"></div>
        <button onclick="window.closeModal()" class="mt-6 w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-black text-sm text-white shadow-lg transition-all active:scale-95 cursor-pointer tracking-widest">關閉報表</button>
    </div>
</div>

<!-- 手動報價 Modal (斷線應急) -->
<div id="price-prompt-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div class="glass rounded-2xl p-6 w-full max-w-sm border-sky-500/40 shadow-2xl">
        <h2 class="text-xl font-black text-center mb-2 tracking-widest text-sky-400">天道斷線 請求支援</h2>
        <p class="text-[11px] text-gray-400 mb-5 text-center leading-relaxed">無法取得 <span id="prompt-city-name" class="text-white font-bold"></span> 的真實報價。<br>請統帥即時提供基準平盤價 以啟動沙盤演練。</p>
        <div class="space-y-4">
            <input id="manual-price-input" type="number" step="0.5" placeholder="請輸入基準股價 如 150.5" class="w-full bg-black/60 border border-white/20 rounded-lg px-4 py-3 text-white focus:border-sky-500 outline-none font-mono text-sm text-center">
            <button onclick="window.submitManualPrice()" class="w-full bg-sky-600 hover:bg-sky-500 py-3 rounded-xl font-bold text-sm text-white shadow-lg transition-colors cursor-pointer tracking-widest">設定基準並進入沙盤</button>
            <button onclick="window.closePricePrompt()" class="w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold text-sm text-white mt-2 transition-colors cursor-pointer tracking-widest">取消</button>
        </div>
    </div>
</div>

<!-- 吐司訊息 (Toast) -->
<div id="msg-box" class="fixed top-16 md:bottom-24 md:top-auto left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md px-5 py-2.5 rounded-full text-xs md:text-sm font-bold opacity-0 transition-all duration-300 z-[60] pointer-events-none text-center w-max max-w-[85vw] border border-white/20 text-white tracking-widest shadow-[0_10px_25px_rgba(0,0,0,0.8)] whitespace-nowrap"></div>

<script>
// ==========================================
// 1. 全域變數、資料定義與數值防護 (強制提升避免 ReferenceError)
// ==========================================
window.safeNum = function(val, fallback = 0) {
    const n = Number(val);
    return (isNaN(n) || !isFinite(n)) ? fallback : n;
};

let msgTimeout;
window.showMsg = function(t) { 
    const el = document.getElementById('msg-box'); 
    if(!el) return;
    el.innerText = t;

// 嚴謹會計準則：軍費另計
function calcProfit(side, entryPrice, currentMarketPrice, qty) {
    const diff = side === 'LONG' ? (currentMarketPrice - entryPrice) : (entryPrice - currentMarketPrice);
    const grossProfit = diff * qty * 1000;
    const fees = (currentMarketPrice * qty * 1000) * (FEE_RATE + TAX_RATE);
    return grossProfit - fees;
}

function getSeason() {
    const m = new Date().getMonth() + 1;
    if(m >= 3 && m <= 5) return 'SPRING';
    if(m >= 6 && m <= 8) return 'SUMMER';
    if(m >= 9 && m <= 11) return 'AUTUMN';
    return 'WINTER';
}

function getPriceTier(price) {
    if(price < 100) return 1;
    if(price <= 200) return 2;
    if(price <= 500) return 3;
    if(price <= 999) return 4;
    return 5;
}

function createCastle(tier, season) {
    const group = new THREE.Group();
    const isWinter = season === 'WINTER';
    const baseColor = isWinter ? 0x8899aa : 0x556677; 
    const mat = new THREE.MeshStandardMaterial({color: baseColor, roughness: 0.7, metalness: 0.3});
    
    const wallHeight = 16 + tier * 2.5; 
    const wall = new THREE.Mesh(new THREE.BoxGeometry(10, wallHeight, 60), mat);
    wall.position.set(-35, wallHeight/2, 0);
    group.add(wall);
    
    for(let z = -25; z <= 25; z+=10) {
        const battlement = new THREE.Mesh(new THREE.BoxGeometry(10, 4, 5), mat);
        battlement.position.set(-35, wallHeight + 2, z); 
        group.add(battlement);
    }
    
    if (tier >= 3) {
        const towerMat = new THREE.MeshStandardMaterial({color: baseColor, roughness: 0.6, metalness: 0.4});
        for(let z of [-30, 30]) {
            const tower = new THREE.Mesh(new THREE.BoxGeometry(14, wallHeight+8, 14), towerMat);
            tower.position.set(-35, (wallHeight+8)/2, z);
            group.add(tower);
        }
    }
    
    if (tier >= 4) {
        const glowColor = tier === 5 ? 0x00ffff : 0xffaa00; 
        const glowMat = new THREE.MeshStandardMaterial({color: glowColor, emissive: glowColor, emissiveIntensity: tier === 5 ? 3 : 1.5});
        const line = new THREE.Mesh(new THREE.BoxGeometry(11, 0.8, 61), glowMat);
        line.position.set(-35, wallHeight * 0.8, 0);
        group.add(line);
        
        for(let z of [-15, 0, 15]) {
            const turret = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2, 5, 8), new THREE.MeshStandardMaterial({color: 0x334455, metalness: 0.8}));
            turret.position.set(-32, wallHeight + 2.5, z);
            const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 6, 8), glowMat);
            cannon.rotation.x = Math.PI/2;

function createForest(season) {
    const group = new THREE.Group();
    let leafColor = season === 'SUMMER' ? 0x115522 : 
                    season === 'AUTUMN' ? 0xc96b1e : 
                    season === 'WINTER' ? 0xeeeeee : 0x2e8b57;
    const mat = new THREE.MeshStandardMaterial({color: leafColor, flatShading: true, roughness: 0.9});
    
    for(let i=0; i<45; i++) {
        const tree = new THREE.Group();
        const scale = 1.0 + Math.random()*0.8;
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 4), new THREE.MeshStandardMaterial({color: 0x4a2e15})); 
        trunk.position.y = 2;
        const leaves1 = new THREE.Mesh(new THREE.ConeGeometry(4.5, 8, 7), mat); leaves1.position.y = 6;
        const leaves2 = new THREE.Mesh(new THREE.ConeGeometry(3.5, 7, 7), mat); leaves2.position.y = 10;
        const leaves3 = new THREE.Mesh(new THREE.ConeGeometry(2.5, 5, 7), mat); leaves3.position.y = 14;
        tree.add(trunk, leaves1, leaves2, leaves3);
        tree.scale.set(scale, scale, scale); 
        tree.position.set(30 + Math.random()*25, 0, (Math.random()-0.5)*75);
        group.add(tree);
    }
    return group;
}

function createSnowman() {
    const group = new THREE.Group();
    const snowMat = new THREE.MeshStandardMaterial({color: 0xffffff});
    const body = new THREE.Mesh(new THREE.DodecahedronGeometry(1.5, 1), snowMat); body.position.y = 1.5;
    const head = new THREE.Mesh(new THREE.DodecahedronGeometry(1.0, 1), snowMat); head.position.y = 3.5;
    const scarf = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.4), new THREE.MeshStandardMaterial({color: 0xcc2222})); scarf.position.y = 2.8;
    group.add(body, head, scarf); 
    return group;
}

function createSoldier(colorHex, isPlayer, tier = 1, side = 'LONG') {
    const group = new THREE.Group();
    let sc = (isPlayer ? 2.4 : 1.5) * (1 + (tier - 1) * 0.12);
    const mat = new THREE.MeshStandardMaterial({color: colorHex, emissive: isPlayer ? colorHex : 0x000000, emissiveIntensity: 0.6, metalness: tier >= 4 ? 0.8 : 0.4, roughness: 0.3});
    
    // 高階兵種變更為方塊重機甲；低階為常規圓柱步兵
    const bodyGeo = tier >= 4 ? new THREE.BoxGeometry(0.8*sc, 2.2*sc, 0.8*sc) : new THREE.CylinderGeometry(0.4*sc, 0.6*sc, 2.2*sc, 6);
    const body = new THREE.Mesh(bodyGeo, mat); body.position.y = sc; group.add(body);
    const head = new THREE.Mesh(new THREE.DodecahedronGeometry(0.5*sc), mat); head.position.y = 2.7 * sc; group.add(head);
    
    // 士兵朝向優化：紅向右 (+X)，綠向左 (-X)
    group.rotation.y = side === 'LONG' ? -Math.PI/2 : Math.PI/2;

    // 武器配備進化 (第四第五階擁有發光雷射長矛)
    if (isPlayer || tier >= 4) {
        const wColor = tier >= 4 ? (colorHex === 0xdd3333 || colorHex === 0xff3333 ? 0xff4444 : 0x44ff44) : 0xffdd88;
        const wpn = new THREE.Mesh(new THREE.CylinderGeometry(0.06*sc, 0.06*sc, 5.5*sc, 4), new THREE.MeshStandardMaterial({color: wColor, emissive: wColor, emissiveIntensity: 2}));
        wpn.position.set(0, 1.5 * sc, 1.5 * sc); wpn.rotation.x = Math.PI / 3; group.add(wpn);
    }
    group.userData = { isAttacking: false, baseX: 0, active: true };
    return group;
}

function initParticles() {
    const geom = new THREE.BufferGeometry();
    const pos = new Float32Array(200 * 3); const vel = [];
    for (let i=0; i<200; i++) { pos[i*3]=0; pos[i*3+1]=-100; pos[i*3+2]=0; vel.push({x:0,y:0,z:0}); }
    geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    particles = new THREE.Points(geom, new THREE.PointsMaterial({color: 0xffcc00, size: 0.8, transparent: true, opacity: 0, blending: THREE.AdditiveBlending}));
    particles.userData = { vel: vel, active: false, life: 0 };
    scene.add(particles);
}

function triggerClashParticles(x, side) {
    if(!particles) return;
    particles.position.x = x; particles.material.opacity = 1; particles.material.color.setHex(side==='LONG' ? 0xff4444 : 0x44ff44);
    particles.userData.active = true; particles.userData.life = 1;
    const pos = particles.geometry.attributes.position.array;
    for (let i=0; i<200; i++) {
        pos[i*3]=0; pos[i*3+1]=1+Math.random()*4; pos[i*3+2]=(Math.random()-0.5)*40;
        particles.userData.vel[i] = { x:(Math.random()-0.5)*3, y:Math.random()*4, z:(Math.random()-0.5)*2 };
    }
    particles.geometry.attributes.position.needsUpdate = true;
}

function updateParticles() {
    if(!particles || !particles.userData.active) return;
    particles.userData.life -= 0.03; particles.material.opacity = Math.max(0, particles.userData.life);
    if(particles.userData.life <= 0) { particles.userData.active = false; return; }
    const pos = particles.geometry.attributes.position.array;
    for (let i=0; i<200; i++) {
        pos[i*3] += particles.userData.vel[i].x; pos[i*3+1] += particles.userData.vel[i].y; pos[i*3+2] += particles.userData.vel[i].z;
        particles.userData.vel[i].y -= 0.15; if(pos[i*3+1]<0) pos[i*3+1]=0;
    }
    particles.geometry.attributes.position.needsUpdate = true;
}

function triggerFireworks() {

            const x = (Math.random() - 0.5) * 80;

function rebuildEnvironment() {
    const city = CITIES[gameState.activeCity];
    const tier = getPriceTier(safeNum(city?.basePrice, 100));
    const season = getSeason();
    
    if(castleGroup) scene.remove(castleGroup); 
    if(forestGroup) scene.remove(forestGroup); 
    if(decorationsGroup) scene.remove(decorationsGroup); 
    if(snowParticles) { scene.remove(snowParticles); snowParticles = null; }
    
    castleGroup = createCastle(tier, season); 
    forestGroup = createForest(season); 
    decorationsGroup = new THREE.Group();
    scene.add(castleGroup, forestGroup);
    
    if(season === 'WINTER') {
        const geom = new THREE.BufferGeometry(); 
        const pos = new Float32Array(300 * 3);
        for (let i = 0; i < 300; i++) { 
            pos[i*3] = (Math.random() - 0.5) * 150; pos[i*3+1] = Math.random() * 60; pos[i*3+2] = (Math.random() - 0.5) * 120; 
        }
        geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        snowParticles = new THREE.Points(geom, new THREE.PointsMaterial({color: 0xffffff, size: 0.6, transparent: true, opacity: 0.6}));
        scene.add(snowParticles);
        
        const snm = createSnowman(); snm.position.set(22, 0, 15); decorationsGroup.add(snm);
        for(let i = 0; i < 8; i++) {
            const patch = new THREE.Mesh(new THREE.CylinderGeometry(4, 5, 0.1), new THREE.MeshBasicMaterial({color: 0xdddddd}));
            patch.position.set((Math.random() - 0.5) * 100, 0.05, (Math.random() - 0.5) * 100); decorationsGroup.add(patch);
        }
    }
    
    if(season === 'AUTUMN') {
        for(let i = 0; i < 40; i++) {
            const lf = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.6), new THREE.MeshBasicMaterial({color: 0xc96b1e}));
            lf.position.set(20 + Math.random() * 45, 0.05, (Math.random() - 0.5) * 95); lf.rotation.y = Math.random() * Math.PI;
            decorationsGroup.add(lf);
        }
    }
    
    scene.add(decorationsGroup);
    
    [...baseRedArmy, ...baseGreenArmy].forEach(m => scene.remove(m)); 
    baseRedArmy = []; baseGreenArmy = [];
    
    const cols = 10;
    for(let i = 0; i < MAX_PHALANX_SIZE; i++) {
        const r = Math.floor(i / cols);
        const c = i % cols;
        const zPos = (c - 4.5) * 4.5;
        
        const rm = createSoldier(0xdd3333, false, tier, 'LONG'); 
        rm.userData.baseX = -15 - r * 3; rm.position.set(rm.userData.baseX, 0, zPos); 
        baseRedArmy.push(rm); scene.add(rm);
        
        const gm = createSoldier(0x33dd33, false, tier, 'SHORT'); 
        gm.userData.baseX = 15 + r * 3; gm.position.set(gm.userData.baseX, 0, zPos); 
        baseGreenArmy.push(gm); scene.add(gm);
    }
    syncPlayerTroopsFromState(tier);
}

function init3D() {
    scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x02050a, 0.010);
    camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); 
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.domElement.className = 'three-canvas'; 
    document.body.appendChild(renderer.domElement);
    
    scene.add(new THREE.AmbientLight(0xffffff, 4.0));
    const dLight = new THREE.DirectionalLight(0xffffff, 5.5); dLight.position.set(20, 100, 40); scene.add(dLight);
    
    const grid = new THREE.GridHelper(200, 80, 0x223344, 0x0a1122); grid.position.y = 0.01; scene.add(grid);
    battleLine = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 75), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 })); scene.add(battleLine);
    
    camera.position.set(0, 45, 80); camera.lookAt(0, 5, 0);
    
    initParticles();
    rebuildEnvironment();
    
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    animate();
}

function animate() {
    requestAnimationFrame(animate); TWEEN.update();
    if(snowParticles) {
        const p = snowParticles.geometry.attributes.position.array;
        for(let i = 0; i < 300; i++) { p[i*3+1] -= 0.15; if(p[i*3+1] < 0) p[i*3+1] = 60; }
        snowParticles.geometry.attributes.position.needsUpdate = true;
    }
    for(let i = fireworks.length - 1; i >= 0; i--) {
        const fw = fireworks[i]; fw.userData.life -= 0.015; fw.material.opacity = fw.userData.life;
        const p = fw.geometry.attributes.position.array;
        for(let j = 0; j < 100; j++) { p[j*3] += fw.userData.vels[j].x; p[j*3+1] += fw.userData.vels[j].y; p[j*3+2] += fw.userData.vels[j].z; }
        fw.geometry.attributes.position.needsUpdate = true;
        if(fw.userData.life <= 0) { scene.remove(fw); fireworks.splice(i, 1); }
    }
    updateVisuals(); renderer.render(scene, camera);
}

function syncPlayerTroopsFromState(tier) {
    [...playerRedArmy, ...playerGreenArmy].forEach(m => scene.remove(m)); playerRedArmy = []; playerGreenArmy = [];
    if(!tier) tier = getPriceTier(safeNum(CITIES[gameState.activeCity]?.basePrice, 100));
    
    gameState.units.forEach(u => {
        if(u.city === gameState.activeCity) {
            const m = createSoldier(u.side === 'LONG' ? 0xff3333 : 0x33ff33, true, tier, u.side);
            m.userData.baseX = u.side === 'LONG' ? -8 : 8; 
            m.position.set(m.userData.baseX, 0, (Math.random() - 0.5) * 30);
            scene.add(m); 
            if (u.side === 'LONG') playerRedArmy.push(m); else playerGreenArmy.push(m);
        }
    });
}

function updateVisuals() {
    const city = CITIES[gameState.activeCity]; if(!city) return;
    const base = isSimMode ? city.simBasePrice : city.basePrice;
    const diff = base > 0 ? (currentPrice - base) / base : 0;
    const drift = safeNum(diff * 350, 0);
    
    battleLine.position.x += (drift - battleLine.position.x) * 0.15;
    const shift = drift * 0.4;
    
    [...baseRedArmy, ...playerRedArmy].forEach(m => { if(!m.userData.isAttacking) m.position.x += ((m.userData.baseX + shift) - m.position.x) * 0.1; });
    [...baseGreenArmy, ...playerGreenArmy].forEach(m => { if(!m.userData.isAttacking) m.position.x += ((m.userData.baseX + shift) - m.position.x) * 0.1; });
}

function triggerAttackAnim(side) {
    const attackers = side === 'LONG' ? [...playerRedArmy, ...baseRedArmy] : [...playerGreenArmy, ...baseGreenArmy];
    const dir = side === 'LONG' ? 1 : -1;
    attackers.slice(0, 20).forEach(m => {
        if(m.userData.isAttacking) return; m.userData.isAttacking = true;
        new TWEEN.Tween(m.position).to({ x: battleLine.position.x - (dir * 1.5), y: 3 }, 150).easing(TWEEN.Easing.Quadratic.Out).onComplete(() => {
            new TWEEN.Tween(m.position).to({ x: m.userData.baseX, y: 0 }, 400).easing(TWEEN.Easing.Quadratic.In).onComplete(() => m.userData.isAttacking = false).start();
        }).start();
    });
}

// ==========================================
// 4. 專業 Chart.js 金融圖表引擎 (含多線技術指標)
// ==========================================
function calcEMA(data, period) { if(data.length === 0) return []; let k = 2 / (period + 1); let ema = [data[0]]; for(let i = 1; i < data.length; i++) { ema.push(data[i] * k + ema[i - 1] * (1 - k)); } return ema; }
function calcSMA(data, period) { let sma = []; for(let i = 0; i < data.length; i++) { if(i < period - 1) { sma.push(data[i]); continue; } let sum = 0; for(let j = 0; j < period; j++) sum += data[i - j]; sma.push(sum / period); } return sma; }
function calcMACD(data) { if(data.length < 26) return {macd: [], signal: [], hist: []}; let ema12 = calcEMA(data, 12); let ema26 = calcEMA(data, 26); let macd = ema12.map((v, i) => v - ema26[i]); let signal = calcEMA(macd, 9); let hist = macd.map((v, i) => v - signal[i]); return {macd, signal, hist}; }
function calcKD(data, period = 9) { if(data.length < period) return {k: [], d: []}; let k = [], dv = [], pk = 50, pd = 50; for(let i = 0; i < data.length; i++) { let st = Math.max(0, i - period + 1); let sl = data.slice(st, i + 1); let hi = Math.max(...sl); let lo = Math.min(...sl); let rsv = (hi === lo) ? 50 : ((data[i] - lo) / (hi - lo)) * 100; let ck = (2 / 3) * pk + (1 / 3) * rsv; let cd = (2 / 3) * pd + (1 / 3) * ck; k.push(ck); dv.push(cd); pk = ck; pd = cd; } return {k, dv}; }
function calcRSI(data, period) { if(data.length < period) return new Array(data.length).fill(50); let rsi = [], g = 0, l = 0; for(let i = 1; i <= period; i++) { let df = data[i] - data[i - 1]; if(df >= 0) g += df; else l -= df; } let ag = g / period; let al = l / period; rsi.push(100 - (100 / (1 + (al === 0 ? 999 : ag / al)))); for(let i = period + 1; i < data.length; i++) { let df = data[i] - data[i - 1]; ag = (ag * (period - 1) + (df >= 0 ? df : 0)) / period; al = (al * (period - 1) + (df < 0 ? -df : 0)) / period; rsi.push(100 - (100 / (1 + (al === 0 ? 999 : ag / al)))); } return new Array(period).fill(50).concat(rsi); }
function calcBIAS(data, period) { if(data.length < period) return new Array(data.length).fill(0); let s = calcSMA(data, period); return data.map((v, i) => s[i] > 0 ? ((v - s[i]) / s[i]) * 100 : 0); }

window.fetchFullChartData = async function() {
    const cityCode = gameState.activeCity; const city = CITIES[cityCode]; if(!city) return;
    if(isSimMode) return; // 沙盤推演模式由內部引擎跳動，不重新覆蓋歷史資料
    
    const map = { "1m": {i: "1m", r: "1d"}, "5m": {i: "5m", r: "1d"}, "1d": {i: "1d", r: "6mo"}, "1wk": {i: "1wk", r: "2y"} };
    const prm = map[gameState.timeframe] || map["1d"];
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${cityCode}.TW?interval=${prm.i}&range=${prm.r}`;
    
    try {
        const res = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        
        // 鏈式安全防護：確定回傳資料具備完整的圖表陣列
        if (data?.chart?.result?.[0]) {
            const result = data.chart.result[0];
            const quote = result.indicators.quote[0];
            const ts = result.timestamp || [];
            let ohlc = [];
            
            for(let i = 0; i < ts.length; i++) {
                // 剔除所有 null 的收盤資料，徹底消除 K 線斷層空白
                if(quote.close[i] !== null && quote.close[i] !== undefined) {
                    ohlc.push({ x: ts[i] * 1000, o: quote.open[i], h: quote.high[i], l: quote.low[i], c: quote.close[i], v: quote.volume[i] });
                }
            }
            city.chartData[gameState.timeframe] = ohlc;
            if(!document.getElementById('chart-page').classList.contains('hidden')) renderChartInstance();
        }
    } catch(e) { console.warn("Chart Fetch Error", e); }
};

window.renderChartInstance = function() {
    const city = CITIES[gameState.activeCity]; if(!city || !city.chartData[gameState.timeframe]) return;
    const raw = city.chartData[gameState.timeframe];
    if (raw.length < 10) return;
    
    // 提取時間標籤，並將 K 線圖改為分類軸 (category) 以消除盤後空洞
    const labels = raw.map(d => new Date(d.x).toLocaleTimeString('zh-TW', {hour: '2-digit', minute: '2-digit'}));
    const candleData = raw.map((d, i) => ({ x: labels[i], o: d.o, h: d.h, l: d.l, c: d.c }));
    const closePrices = raw.map(d => d.c);
    
    const upCol = '#ef4444'; // 台股專屬紅漲
    const dnCol = '#22c55e'; // 台股專屬綠跌

    const ctxM = document.getElementById('mainChartCanvas').getContext('2d');
    if(mainChart) mainChart.destroy();
    mainChart = new Chart(ctxM, {
        type: 'candlestick',
        data: { datasets: [{ data: candleData, color: { up: upCol, down: dnCol, unchanged: '#999' }, borderColor: { up: upCol, down: dnCol, unchanged: '#999' } }] },
        options: { animation: false, responsive: true, maintainAspectRatio: false, scales: { x: { type: 'category', display: false }, y: { position: 'right', ticks: { color: '#ccc' } } }, plugins: { legend: { display: false } } }
    });
    
    const ctxV = document.getElementById('volumeChartCanvas').getContext('2d');
    if(volChart) volChart.destroy();
    volChart = new Chart(ctxV, {
        type: 'bar',
        data: { labels, datasets: [{ data: raw.map(d => d.v), backgroundColor: raw.map(d => d.c >= d.o ? upCol : dnCol) }] },
        options: { animation: false, responsive: true, maintainAspectRatio: false, scales: { x: { display: false }, y: { display: false } }, plugins: { legend: { display: false } } }
    });

    const ctxI = document.getElementById('indicatorChartCanvas').getContext('2d');
    if(indChart) indChart.destroy();
    let datasets = [];
    const ind = gameState.activeIndicator;
    
    if(ind === "MACD") {
        const {m, s, h} = calcMACD(closePrices);
        datasets = [
            { type: 'bar', label: 'Hist', data: h, backgroundColor: h.map(v => v >= 0 ? upCol : dnCol) },
            { type: 'line', label: 'MACD', data: m, borderColor: '#fff', borderWidth: 1.5, pointRadius: 0 },
            { type: 'line', label: 'Signal', data: s, borderColor: '#facc15', borderWidth: 1.5, pointRadius: 0 }
        ];
    } else if(ind === "KD") {
        const {k, dv} = calcKD(closePrices);
        datasets = [
            { type: 'line', label: 'K', data: k, borderColor: '#38bdf8', borderWidth: 1.5, pointRadius: 0 },
            { type: 'line', label: 'D', data: dv, borderColor: '#fb923c', borderWidth: 1.5, pointRadius: 0 }
        ];
    } else if(ind === "RSI") {
        const rsi5 = calcRSI(closePrices, 5); const rsi10 = calcRSI(closePrices, 10);
        datasets = [
            { type: 'line', label: 'RSI 5', data: rsi5, borderColor: '#c084fc', borderWidth: 1.5, pointRadius: 0 },
            { type: 'line', label: 'RSI 10', data: rsi10, borderColor: '#38bdf8', borderWidth: 1.5, pointRadius: 0 }
        ];
    } else if(ind === "BIAS") {
        const b5 = calcBIAS(closePrices, 5); const b10 = calcBIAS(closePrices, 10); const b20 = calcBIAS(closePrices, 20);
        datasets = [
            { type: 'line', label: 'BIAS 5', data: b5, borderColor: '#fff', borderWidth: 1.5, pointRadius: 0 },
            { type: 'line', label: 'BIAS 10', data: b10, borderColor: '#facc15', borderWidth: 1.5, pointRadius: 0 },
            { type: 'line', label: 'BIAS 20', data: b20, borderColor: '#ec4899', borderWidth: 1.5, pointRadius: 0 }
        ];
    }
    
    indChart = new Chart(ctxI, { data: { labels, datasets }, options: { animation: false, responsive: true, maintainAspectRatio: false, scales: { x: { display: false }, y: { position: 'right', ticks: { color: '#888', font: { size: 8 } } } }, plugins: { legend: { display: true, position: 'top', labels: { color: '#888', font: { size: 8 } } } } } });
};

// ==========================================
// 5. 即時輪詢與資料整合
// ==========================================
function startMarketPolling() {
    setInterval(async () => {
        if(isSimMode) return;
        const city = CITIES[gameState.activeCity];
        const url = `https://query1.finance.yahoo.com/v8/finance/chart/${gameState.activeCity}.TW?interval=1m&range=1d`;
        try {
            const res = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(url)}`);
            const data = await res.json();
            if (data?.chart?.result?.[0]) {
                const meta = data.chart.result[0].meta;
                currentPrice = meta.regularMarketPrice;
                city.price = currentPrice;
                city.basePrice = meta.previousClose;
                
                if(Math.abs(currentPrice - lastPriceForAnim) > 0.01) {
                    triggerAttackAnim(currentPrice > lastPriceForAnim ? 'LONG' : 'SHORT');
                    lastPriceForAnim = currentPrice;
                }
                
                // 漲跌停煙火慶典 (超過 9.8%)
                if(Math.abs((currentPrice - city.basePrice) / city.basePrice) >= 0.098) {
                    triggerFireworks();
                }
                updateUI();
            }
        } catch(e) {}
    }, 5000);
}

// 模擬引擎 (供斷線或啟動沙盤時產生平滑假資料用)
function localTick() {
    const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Taipei"}));
    const day = now.getDay();
    const timeNum = now.getHours() * 100 + now.getMinutes();
    let newStatus = "CLOSED";
    
    // 嚴格休市判斷：確保週末六日絕對鎖定為休市
    if (day >= 1 && day <= 5) {
        if (timeNum >= 855 && timeNum < 900) newStatus = "PRE";
        else if (timeNum >= 900 && timeNum < 1330) newStatus = "OPEN";
    }

    if (currentMarketState !== newStatus) {
        if (newStatus === "OPEN" && isSimMode) window.forceCloseSimMode(false);
        currentMarketState = newStatus;
        const btnL = document.getElementById('btn-long'); const btnS = document.getElementById('btn-short');
        if (currentMarketState === "CLOSED" && !isSimMode) {
            btnL.classList.add('btn-disabled'); btnS.classList.add('btn-disabled');
            document.getElementById('btn-long-text').innerText = "休市禁令"; document.getElementById('btn-short-text').innerText = "休市禁令";
        } else {
            btnL.classList.remove('btn-disabled'); btnS.classList.remove('btn-disabled');
            document.getElementById('btn-long-text').innerText = "入城"; document.getElementById('btn-short-text').innerText = "攻掠";
        }
    }

    if(!isSimMode) return;
    
    const city = CITIES[gameState.activeCity]; if(!city) return;
    const bp = safeNum(city.simBasePrice, city.basePrice); const maxDev = bp * 0.05; 
    let newPrice = safeNum(city.price, bp) + (Math.random() - 0.5) * safeNum(city.vol, 2.0) * 2;
    if (newPrice > bp + maxDev) newPrice = bp + maxDev; if (newPrice < bp - maxDev) newPrice = bp - maxDev;
    city.price = newPrice; currentPrice = city.price;
    
    if(Math.abs(currentPrice - lastPriceForAnim) > 0.01) { 
        triggerAttackAnim(currentPrice > lastPriceForAnim ? 'LONG' : 'SHORT'); 
        lastPriceForAnim = currentPrice; 
    }
    updateUI();
}

function initKbars(city) {
    let tempC = isSimMode ? safeNum(city.simBasePrice, city.basePrice) : safeNum(city.basePrice, 100);
    let time = Date.now() - 100 * 60000;
    const fakeData = [];
    for(let i = 0; i < 100; i++) {
        let o = tempC; tempC += (Math.random() - 0.5) * (tempC * 0.01);
        fakeData.push({ x: time + i * 60000, o: o, h: Math.max(o, tempC) + Math.random(), l: Math.min(o, tempC) - Math.random(), c: tempC, v: 100 + Math.random() * 900 });
    }
    city.chartData["1d"] = fakeData; city.chartData["1m"] = fakeData;
}

// ==========================================
// 6. UI 更新與玩家指令 (加權整編會計引擎)
// ==========================================
function updateUI() {
    document.getElementById('user-balance').innerText = Math.floor(gameState.balance).toLocaleString();
    document.getElementById('today-total-result').innerText = `加 ${Math.floor(gameState.realizedPnl).toLocaleString()}`;
    document.getElementById('market-price').innerText = safeNum(currentPrice).toFixed(2);
    document.getElementById('base-price-display').innerText = safeNum(CITIES[gameState.activeCity]?.basePrice).toFixed(2);
    renderUnits();
}

function renderUnits() {
    const cont = document.getElementById('tab-content-units'); if(!cont) return;
    cont.innerHTML = '';
    const grouped = {};
    
    // 會計整編引擎
    gameState.units.forEach(u => {
        if(!grouped[u.city]) grouped[u.city] = { totalQty: 0, weightedCost: 0, items: [] };
        grouped[u.city].totalQty += u.qty;
        grouped[u.city].weightedCost += u.cost * u.qty;
        grouped[u.city].items.push(u);
    });

    for(let cityCode in grouped) {
        const g = grouped[cityCode]; const avgCost = g.weightedCost / g.totalQty;
        const totalProfit = g.items.reduce((sum, u) => sum + calcProfit(u.side, u.cost, currentPrice, u.qty), 0);
        
        cont.innerHTML += `
        <div class="bg-black/60 p-3 rounded-xl border-l-4 border-yellow-500 mb-2 shadow-lg">
            <div class="flex justify-between items-center mb-1">
                <strong>${CITIES[cityCode].name} 整編戰力</strong>
                <span class="text-[10px] bg-white/10 px-2 rounded">${g.totalQty.toFixed(1)} 營</span>
            </div>
            <div class="flex justify-between text-[11px] text-gray-400 mb-1">
                <span>權重均價</span>
                <span class="text-white">${avgCost.toFixed(2)}</span>
            </div>
            <div class="flex justify-between text-sm font-black">
                <span>淨利戰功</span>
                <span class="${totalProfit >= 0 ? 'text-red-400' : 'text-green-400'}">${Math.floor(totalProfit).toLocaleString()}</span>
            </div>
        </div>`;

        g.items.forEach(u => {
            const profit = calcProfit(u.side, u.cost, currentPrice, u.qty);
            cont.innerHTML += `
            <div class="bg-black/40 p-2 rounded-lg border-r-4 ${profit >= 0 ? 'border-red-500' : 'border-green-500'} mb-2 ml-4">
                <div class="flex justify-between text-xs">
                    <span>派遣 ${u.side === 'LONG' ? '做多' : '做空'}</span>
                    <span class="${profit >= 0 ? 'text-red-400' : 'text-green-400'}">${Math.floor(profit).toLocaleString()}</span>
                </div>
                <div class="flex justify-between items-center mt-1">
                    <span class="text-[9px] text-gray-500">進場單價 ${u.cost.toFixed(2)}</span>
                    <button onclick="window.settle(${u.id})" class="text-[10px] bg-white/10 px-3 py-1 rounded hover:bg-white/20 transition-colors cursor-pointer">撤軍結算</button>
                </div>
            </div>`;
        });
    }
}

window.switchCity = function(code) { 
    gameState.activeCity = code; 
    currentPrice = safeNum(CITIES[code].price, CITIES[code].basePrice);
    document.getElementById('chart-city-name').innerText = CITIES[code].name;
    window.showMsg(`軍令轉移 至 ${CITIES[code].name}`);
    rebuildEnvironment(); window.fetchFullChartData(); updateUI(); 
};

window.switchSector = function(code) {
    gameState.activeSector = code; const sel = document.getElementById('city-selector'); sel.innerHTML = '';
    SECTORS[code].cities.forEach(c => sel.appendChild(new Option(CITIES[c].name, c)));
    window.switchCity(SECTORS[code].cities[0]);
};

window.issueOrder = function(side) {
    if (currentMarketState === "CLOSED" && !isSimMode) { window.showMsg("天道休市期間 僅開放沙盤練兵下單"); window.triggerThunder(); return; }

    const qty = parseInt(document.getElementById('order-qty').value) || 1;
    const vol = currentPrice * qty * 1000;
    if(gameState.balance < vol) { window.showMsg("天道存銀不足"); window.triggerThunder(); return; }
    
    gameState.balance -= vol;
    // 會計準則：紀錄原始成本 (不含費用)
    gameState.units.push({ id: Date.now(), city: gameState.activeCity, side: side, qty: qty, cost: currentPrice, isSim: isSimMode });
    
    syncPlayerTroopsFromState(); updateUI(); saveState();
};

window.settle = function(id) {
    const idx = gameState.units.findIndex(u => u.id === id); const u = gameState.units[idx];
    const profit = calcProfit(u.side, u.cost, currentPrice, u.qty);
    gameState.balance += (u.cost * u.qty * 1000) + profit;
    if(!isSimMode) gameState.realizedPnl += profit;
    gameState.units.splice(idx, 1); syncPlayerTroopsFromState(); updateUI(); saveState();
};

window.toggleSimMode = function(isAuto = false) {
    if(!isAuto && currentMarketState === "OPEN") { window.showMsg("開盤期間嚴禁手動沙盤"); return; }
    if(isSimMode) {
        window.forceCloseSimMode(false);
    } else {
        realStateSnapshot = JSON.parse(JSON.stringify(gameState)); isSimMode = true;
        Object.keys(CITIES).forEach(c => { if(!isAuto) CITIES[c].simBasePrice = safeNum(CITIES[c].price, CITIES[c].basePrice); initKbars(CITIES[c]); });
        document.getElementById('real-pnl-container').classList.add('hidden'); document.getElementById('sim-pnl-container').classList.remove('hidden');
        document.getElementById('base-price-label').innerText = '沙盤基準';
        ['main-dashboard','tab-container','order-panel'].forEach(id => { document.getElementById(id).classList.replace('glass', 'glass-sim'); });
        window.triggerSimThunder(); window.showMsg(isAuto ? "連線異常 啟動沙盤" : "啟動沙盤"); updateUI();
    }
};

window.forceCloseSimMode = function(auto) {
    if(!isSimMode) return;
    const simProfit = gameState.balance - realStateSnapshot.balance;
    gameState = JSON.parse(JSON.stringify(realStateSnapshot)); isSimMode = false;
    
    if (simProfit > 0) {
        gameState.pendingSimReward += simProfit * 0.001; // 千分之一獎勵
        window.triggerGoldThunder(); window.showMsg(`推演獲利 ${Math.floor(simProfit * 0.001)} 甘霖預備中`);
    } else { window.triggerThunder(); window.showMsg(auto ? "試撮啟動 沙盤結束" : "結束沙盤"); }
    
    document.getElementById('sim-pnl-container').classList.add('hidden'); document.getElementById('real-pnl-container').classList.remove('hidden');
    document.getElementById('base-price-label').innerText = '昨收';
    ['main-dashboard','tab-container','order-panel'].forEach(id => { document.getElementById(id).classList.replace('glass-sim', 'glass'); });
    updateUI(); window.fetchFullChartData();
};

// UI 導航與圖表切換
window.openChartPage = function() { document.getElementById('chart-page').classList.remove('hidden'); setTimeout(() => document.getElementById('chart-page').classList.remove('translate-y-full'), 10); window.fetchFullChartData(); };
window.closeChartPage = function() { document.getElementById('chart-page').classList.add('translate-y-full'); setTimeout(() => document.getElementById('chart-page').classList.add('hidden'), 300); };
window.setTimeframe = function(tf) { gameState.timeframe = tf; document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.toggle('active', b.id === 'tf-' + tf)); window.fetchFullChartData(); };
window.setIndicator = function(ind) { gameState.activeIndicator = ind; document.querySelectorAll('.ind-btn').forEach(b => b.classList.toggle('active', b.id === 'btn-ind-' + ind)); renderChartInstance(); };
window.switchTab = function(t) { ['units', 'history', 'pending'].forEach(x => { document.getElementById('tab-content-' + x).classList.toggle('hidden', x !== t); }); document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === 'tab-' + t)); };
window.showDailySummary = function() { document.getElementById('report-modal').classList.remove('opacity-0','pointer-events-none'); document.getElementById('modal-window').classList.replace('scale-95', 'scale-100'); };
window.closeModal = function() { document.getElementById('report-modal').classList.add('opacity-0','pointer-events-none'); document.getElementById('modal-window').classList.replace('scale-100', 'scale-95'); };

window.onload = function() { 
    loadState(); 
    init3D(); 
    const sec = document.getElementById('sector-selector');
    for(let k in SECTORS) { sec.appendChild(new Option(SECTORS[k].name, k)); }
    window.switchSector("SEMICON"); 
    localTick(); 
    startMarketPolling(); 
    setInterval(localTick, 1000);
};
</script>
