<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三界戰場 傭兵統帥傳奇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #02050a; font-family: 'Noto Sans TC', sans-serif; color: white; touch-action: none; }
        canvas { display: block; }
        .glass { background: rgba(10, 15, 25, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .glass-sim { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(25px); border: 1px solid rgba(56, 189, 248, 0.4); box-shadow: 0 0 25px rgba(56, 189, 248, 0.15); }
        .ui-overlay { pointer-events: none; }
        .ui-overlay > * { pointer-events: auto; }
        .tab-btn { font-size: 11px; padding: 8px 12px; border-bottom: 2px solid transparent; transition: all 0.3s; color: #888; font-weight: bold; white-space: nowrap; }
        .tab-btn.active { color: #eab308; border-color: #eab308; text-shadow: 0 0 10px rgba(234,179,8,0.5); }
        @keyframes thunder { 0% { background: rgba(255, 255, 255, 0); } 10% { background: rgba(255, 255, 255, 0.3); } 20% { background: rgba(255, 255, 255, 0); } 100% { background: rgba(255, 255, 255, 0); } }
        @keyframes goldThunder { 0% { background: rgba(234, 179, 8, 0); } 10% { background: rgba(234, 179, 8, 0.4); } 20% { background: rgba(234, 179, 8, 0); } 100% { background: rgba(234, 179, 8, 0); } }
        @keyframes simThunder { 0% { background: rgba(56, 189, 248, 0); } 10% { background: rgba(56, 189, 248, 0.4); } 20% { background: rgba(56, 189, 248, 0); } 100% { background: rgba(56, 189, 248, 0); } }
        .thunder-flash { animation: thunder 0.5s ease-out; }
        .gold-thunder-flash { animation: goldThunder 0.8s ease-out; }
        .sim-thunder-flash { animation: simThunder 0.8s ease-out; }
        .result-positive { color: #ef4444; text-shadow: 0 0 8px rgba(239,68,68,0.4); }
        .result-negative { color: #22c55e; text-shadow: 0 0 8px rgba(34,197,94,0.4); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .timeframe-btn { font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; }
        .timeframe-btn.active { background: #eab308; color: black; border-color: #eab308; font-weight: 900; box-shadow: 0 0 10px rgba(234,179,8,0.5); }
        
        /* 讓輸入框更有質感 */
        input[type=number] {
            background: rgba(0,0,0,0.3);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }
        input[type=number]:focus {
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 15px rgba(234,179,8,0.3), inset 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div id="thunder-overlay" class="fixed inset-0 pointer-events-none z-50 transition-colors duration-500"></div>

<!-- Main UI Overlay -->
<div id="main-ui" class="fixed inset-0 ui-overlay flex flex-col justify-between p-2 md:p-6 z-10 transition-all duration-500">
    <!-- Top Bar -->
    <div class="flex flex-col md:flex-row justify-between items-start gap-2 md:gap-4 h-[40vh] md:h-auto overflow-hidden">
        
        <!-- Left Panel -->
        <div class="space-y-2 md:space-y-4 w-full md:w-[26rem] flex-shrink-0 overflow-y-auto scrollbar-hide pb-2">
            <div id="main-dashboard" class="glass rounded-2xl p-4 md:p-5 w-full transition-all duration-500">
                <div class="flex justify-between items-center mb-2">
                    <span id="market-status-label" class="text-[10px] md:text-xs text-yellow-400 font-bold uppercase tracking-widest bg-yellow-500/20 px-3 py-1.5 rounded-md border border-yellow-500/30">判讀時區中</span>
                    <div class="flex gap-2">
                        <button onclick="toggleSimMode()" id="sim-btn" class="hidden bg-sky-600 hover:bg-sky-500 px-3 py-1.5 rounded-md text-[10px] text-white font-bold tracking-widest shadow-[0_0_15px_rgba(2,132,199,0.5)] transition-all">啟動沙盤練兵</button>
                        <button onclick="openChartPage()" class="bg-white/10 hover:bg-white/20 border border-white/20 px-3 py-1.5 rounded-md text-[10px] text-white font-bold tracking-widest transition-all">軍師圖表</button>
                    </div>
                </div>
                <div class="flex justify-between items-end mt-4">
                    <div>
                        <div class="text-[10px] text-gray-400 mb-1 tracking-wider">人界存銀 天幣</div>
                        <div id="user-balance" class="text-3xl md:text-4xl font-mono font-black text-white drop-shadow-md">讀取中</div>
                        <div id="frozen-balance" class="text-[10px] text-gray-500 mt-1.5">天道凍結 待命軍費 零</div>
                    </div>
                    <!-- 雙軌統計切換區 -->
                    <div id="real-pnl-container" class="flex flex-col items-end">
                        <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-1">今日總戰果</span>
                        <div id="today-total-result" class="text-lg md:text-xl font-black font-mono">加 零</div>
                    </div>
                    <div id="sim-pnl-container" class="hidden flex flex-col items-end">
                        <span class="text-[10px] text-sky-400 font-bold uppercase tracking-wider mb-1">沙盤累積戰果</span>
                        <div id="sim-total-result" class="text-lg md:text-xl font-black font-mono text-sky-400 drop-shadow-[0_0_8px_rgba(56,189,248,0.5)]">加 零</div>
                    </div>
                </div>
                
                <div class="mt-4 pt-4 border-t border-white/10 space-y-3">
                    <div class="flex gap-2 items-center">
                        <select id="sector-selector" onchange="switchSector(this.value)" class="flex-1 bg-black/40 border border-white/20 rounded-lg px-2 py-2.5 text-[11px] md:text-xs font-bold text-gray-200 focus:outline-none focus:border-yellow-500 truncate transition-colors">
                            <option value="SEMICON">半導體 領域</option>
                            <option value="COMPUTER">電腦週邊 領域</option>
                            <option value="NETWORK">通信網路 領域</option>
                            <option value="CUSTOM">統帥自選 領域</option>
                        </select>
                        <select id="city-selector" onchange="switchCity(this.value)" class="flex-1 bg-black/40 border border-white/20 rounded-lg px-2 py-2.5 text-[11px] md:text-xs font-bold text-white focus:outline-none focus:border-yellow-500 cursor-pointer truncate transition-colors"></select>
                        <button onclick="openCustomManager()" class="bg-white/10 hover:bg-white/20 border border-white/20 p-2.5 rounded-lg text-white font-bold text-[11px] transition-all">管理</button>
                    </div>
                    
                    <div class="flex justify-between items-end bg-black/20 p-3 rounded-xl border border-white/5">
                        <div class="flex flex-col">
                            <span id="market-price" class="text-2xl md:text-3xl font-mono font-black text-white tracking-tighter drop-shadow-md">連線中</span>
                            <span id="price-change" class="text-[11px] md:text-xs font-bold text-gray-400 mt-1">零點零零 百分比</span>
                        </div>
                        <div class="text-right flex flex-col items-end justify-center">
                            <div class="text-[9px] md:text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">昨日平盤價</div>
                            <div id="base-price-display" class="text-sm md:text-base font-mono font-bold text-gray-300 bg-white/5 px-2 py-1 rounded">---</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass rounded-2xl p-4 w-full border-purple-500/30 flex justify-between items-center hidden md:flex">
                <div>
                    <div class="text-[10px] text-purple-400 font-bold uppercase tracking-widest mb-1">天道國庫 總資產</div>
                    <div id="treasury-balance-display" class="text-xl font-mono font-black text-yellow-400 drop-shadow-[0_0_10px_rgba(250,204,21,0.3)]">讀取中</div>
                </div>
                <div class="flex gap-2">
                    <button onclick="openApiSettings()" class="bg-white/5 hover:bg-white/10 border border-white/10 text-[10px] font-bold px-3 py-2 rounded-lg transition-colors">連線金鑰</button>
                    <button onclick="showDailySummary()" class="bg-purple-900/40 hover:bg-purple-800 text-[10px] font-bold px-3 py-2 rounded-lg border border-purple-500/40 shadow-[0_0_10px_rgba(168,85,247,0.2)] transition-all">結算大表</button>
                </div>
            </div>
        </div>

        <!-- Right Panel: Sidebar Tabs -->
        <div class="w-full md:w-80 lg:w-[28rem] flex flex-col h-full md:max-h-[75vh] flex-shrink-0 drop-shadow-2xl">
            <div class="glass rounded-t-2xl flex border-b border-white/10 overflow-x-auto scrollbar-hide">
                <button onclick="switchTab('units')" id="tab-units" class="tab-btn flex-1 active py-3">未平倉部隊</button>
                <button onclick="switchTab('history')" id="tab-history" class="tab-btn flex-1 py-3">今日戰史</button>
                <button onclick="switchTab('pending')" id="tab-pending" class="tab-btn flex-1 py-3">待命軍令</button>
            </div>
            <div id="tab-container" class="glass rounded-b-2xl p-4 flex-1 overflow-y-auto scrollbar-hide min-h-[180px] transition-colors duration-500">
                <div id="tab-content-units" class="space-y-3"></div>
                <div id="tab-content-history" class="space-y-3 hidden"></div>
                <div id="tab-content-pending" class="space-y-3 hidden"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Bar: Orders -->
    <div class="w-full max-w-5xl mx-auto mt-2 md:mt-auto">
        <div id="order-panel" class="glass rounded-3xl p-4 md:p-6 flex flex-wrap md:flex-nowrap items-center gap-3 md:gap-8 transition-colors duration-500 relative overflow-hidden">
            <!-- 裝飾光暈 -->
            <div class="absolute top-0 left-1/4 w-32 h-full bg-white/5 -skew-x-12 transform -translate-x-full pointer-events-none"></div>
            
            <div class="flex flex-col w-[48%] md:w-auto">
                <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1.5">派遣數量 營</span>
                <input id="order-qty" type="number" value="1" min="1" class="border border-white/20 rounded-xl px-3 md:px-5 py-3 w-full md:w-28 text-lg md:text-2xl font-bold focus:border-yellow-500 outline-none text-center text-white font-mono">
            </div>
            <div class="flex flex-col w-[48%] md:w-auto">
                <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1.5">委託進場價位</span>
                <input id="order-price" type="number" step="0.5" placeholder="市價" class="border border-white/20 rounded-xl px-3 md:px-5 py-3 w-full md:w-36 text-lg md:text-2xl font-bold focus:border-yellow-500 outline-none text-center text-white font-mono">
            </div>
            
            <div class="hidden md:block h-16 w-px bg-gradient-to-b from-transparent via-white/20 to-transparent mx-2"></div>
            
            <div class="flex gap-3 md:gap-6 flex-1 w-full mt-2 md:mt-0">
                <button id="btn-long" onclick="issueOrder('LONG')" class="flex-1 bg-gradient-to-b from-red-500 to-red-700 hover:from-red-400 hover:to-red-600 active:scale-95 transition-all rounded-2xl py-3 md:py-5 flex flex-col items-center justify-center border border-red-400/30 shadow-[0_5px_20px_rgba(220,38,38,0.4)]">
                    <span class="text-[11px] md:text-xs font-bold text-red-100 tracking-widest mb-1">護國多軍</span>
                    <span class="text-base md:text-xl font-black uppercase tracking-widest text-white drop-shadow-md">派遣入城</span>
                </button>
                <button id="btn-short" onclick="issueOrder('SHORT')" class="flex-1 bg-gradient-to-b from-green-600 to-green-800 hover:from-green-500 hover:to-green-700 active:scale-95 transition-all rounded-2xl py-3 md:py-5 flex flex-col items-center justify-center border border-green-400/30 shadow-[0_5px_20px_rgba(22,163,74,0.4)]">
                    <span class="text-[11px] md:text-xs font-bold text-green-100 tracking-widest mb-1">掠奪空軍</span>
                    <span class="text-base md:text-xl font-black uppercase tracking-widest text-white drop-shadow-md">派遣攻掠</span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Separated Chart Page -->
<div id="chart-page" class="fixed inset-0 z-40 bg-[#02050a] flex flex-col hidden transition-all duration-300 transform translate-y-full">
    <div class="flex justify-between items-center p-5 border-b border-white/10 bg-gray-900/80 backdrop-blur-md shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-1 h-6 bg-yellow-500 rounded-full"></div>
            <h2 class="text-xl font-black text-white tracking-widest">軍師戰略室 <span class="text-yellow-500">圖表分析</span></h2>
        </div>
        <button onclick="closeChartPage()" class="bg-white/10 border border-white/20 px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-white/20 transition-all shadow-md">返回實戰戰場</button>
    </div>
    <div class="flex-1 p-4 md:p-6 overflow-y-auto">
        <div class="glass rounded-3xl p-6 md:p-8 shadow-2xl flex flex-col gap-8 max-w-6xl mx-auto h-full border-blue-500/20 relative overflow-hidden">
            <!-- 裝飾背景 -->
            <div class="absolute top-0 right-0 w-64 h-64 bg-blue-500/5 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 relative z-10">
                <div class="text-3xl md:text-4xl font-black tracking-wider drop-shadow-md" id="chart-city-name">城池名稱</div>
                <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-3 md:pb-0 scrollbar-hide">
                    <button onclick="setTimeframe('1m')" class="timeframe-btn active flex-shrink-0" id="tf-1m">一分</button>
                    <button onclick="setTimeframe('5m')" class="timeframe-btn flex-shrink-0" id="tf-5m">五分</button>
                    <button onclick="setTimeframe('15m')" class="timeframe-btn flex-shrink-0" id="tf-15m">十五分</button>
                    <button onclick="setTimeframe('30m')" class="timeframe-btn flex-shrink-0" id="tf-30m">三十分</button>
                    <button onclick="setTimeframe('1H')" class="timeframe-btn flex-shrink-0" id="tf-1H">一時</button>
                    <button onclick="setTimeframe('1D')" class="timeframe-btn flex-shrink-0" id="tf-1D">日</button>
                    <button onclick="setTimeframe('1W')" class="timeframe-btn flex-shrink-0" id="tf-1W">週</button>
                </div>
            </div>
            
            <div class="flex-1 min-h-[250px] flex items-end gap-[3px] px-2 border-b-2 border-white/10 overflow-hidden relative z-10 bg-black/20 rounded-xl p-4">
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-10 text-5xl font-black tracking-widest text-white">量能波段趨勢</div>
                <div id="volume-bars" class="flex items-end gap-[4px] w-full h-full relative z-10"></div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative z-10">
                <div class="bg-black/40 border border-white/5 p-6 rounded-2xl shadow-inner">
                    <span class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-3 block">凱迪指標 (KD)</span>
                    <div class="flex items-baseline gap-8">
                        <span id="kd-k" class="text-3xl font-mono font-black text-sky-400 drop-shadow-[0_0_8px_rgba(56,189,248,0.4)]">K --</span>
                        <span id="kd-d" class="text-3xl font-mono font-black text-orange-400 drop-shadow-[0_0_8px_rgba(251,146,60,0.4)]">D --</span>
                    </div>
                </div>
                <div class="bg-black/40 border border-white/5 p-6 rounded-2xl shadow-inner">
                    <span class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-3 block">動能指標 (MACD)</span>
                    <div id="macd-val" class="text-4xl font-mono font-black text-white drop-shadow-md">---</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- API Settings Modal -->
<div id="api-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="glass rounded-3xl p-6 md:p-8 max-w-md w-full mx-4 shadow-2xl border-white/20">
        <h2 class="text-xl md:text-2xl font-black text-center mb-4 tracking-widest">天道報價連線設定</h2>
        <p class="text-xs text-gray-400 mb-6 leading-relaxed">預設採用全域代理爬蟲抓取真實台股。若有進階報價金鑰可於此輸入以獲取更穩定連線。</p>
        <div class="space-y-4">
            <input id="api-key-input" type="text" placeholder="留空則使用預設公開連線" class="w-full bg-black/50 border border-white/20 rounded-xl px-4 py-3 text-white focus:border-yellow-500 outline-none font-mono text-sm">
            <div class="flex gap-4 pt-2">
                <button onclick="closeApiSettings()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3.5 rounded-xl font-bold text-sm transition-all shadow-md">取消返回</button>
                <button onclick="saveApiKey()" class="flex-1 bg-yellow-500 hover:bg-yellow-400 py-3.5 rounded-xl font-bold text-sm text-black transition-all shadow-[0_0_15px_rgba(234,179,8,0.4)]">儲存設定</button>
            </div>
        </div>
    </div>
</div>

<!-- Custom Stock Manager Modal -->
<div id="custom-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="glass rounded-3xl p-6 md:p-8 max-w-md w-full mx-4 shadow-2xl border-yellow-500/20">
        <div class="flex items-center justify-center gap-2 mb-2">
            <span class="text-2xl">⚙️</span>
            <h2 class="text-xl md:text-2xl font-black tracking-widest">統帥自選城池管理</h2>
        </div>
        <p class="text-xs text-yellow-500/80 font-bold mb-6 text-center tracking-widest">僅限輸入台灣股市代號</p>
        
        <div class="space-y-3 mb-6 bg-black/30 p-4 rounded-2xl border border-white/5">
            <input id="custom-symbol" type="text" placeholder="台股代號 如 貳陸零參" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-yellow-500 outline-none font-mono text-sm uppercase transition-colors">
            <input id="custom-name" type="text" placeholder="城池名稱 如 長榮" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-yellow-500 outline-none text-sm transition-colors">
            <button onclick="addCustomStock()" class="w-full bg-blue-600 hover:bg-blue-500 py-3.5 rounded-xl font-bold text-sm transition-all shadow-[0_0_15px_rgba(37,99,235,0.4)] mt-2">編列入軍</button>
        </div>
        
        <div class="border-t border-white/10 pt-5">
            <h3 class="text-[11px] text-gray-400 font-bold uppercase tracking-widest mb-3 px-1">已編制自選陣列</h3>
            <div id="custom-stock-list" class="space-y-2 max-h-48 overflow-y-auto pr-2 scrollbar-hide"></div>
        </div>
        <button onclick="closeCustomManager()" class="mt-6 w-full bg-gray-700 hover:bg-gray-600 py-3.5 rounded-xl font-bold text-sm transition-all shadow-md">完成配置</button>
    </div>
</div>

<!-- Report Modal -->
<div id="report-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="modal-window" class="glass rounded-3xl p-6 md:p-8 max-w-2xl w-full mx-4 shadow-2xl border-yellow-500/30 transform scale-95 transition-transform duration-300">
        <div id="modal-body"></div>
        <button onclick="closeModal()" class="mt-8 w-full bg-yellow-500 hover:bg-yellow-400 py-4 rounded-2xl font-black text-xl shadow-[0_0_20px_rgba(234,179,8,0.4)] transition-all active:scale-95 text-black">關閉軍情報表</button>
    </div>
</div>

<!-- Toast Message -->
<div id="msg-box" class="fixed top-24 md:bottom-32 md:top-auto left-1/2 -translate-x-1/2 glass px-6 py-3.5 rounded-full text-sm font-bold opacity-0 transition-all duration-300 z-[60] pointer-events-none text-center w-max max-w-[90vw] shadow-[0_10px_25px_rgba(0,0,0,0.5)] border-white/20 text-white tracking-wider"></div>

<script>
// --- 強制數值轉換防呆函式 (解決 NaN 崩潰問題) ---
function safeNum(val, fallback = 0) {
    const n = Number(val);
    return (isNaN(n) || !isFinite(n)) ? fallback : n;
}

// --- 核心變數與領域資料 ---
let USER_API_KEY = localStorage.getItem('abula_api_key') || '';
let apiPollingInterval = null;

// 台股產業分類
const SECTORS = {
    "SEMICON": { name: "半導體 領域", cities: ["2330", "2454", "2303"] },
    "COMPUTER": { name: "電腦週邊 領域", cities: ["2317", "2382", "3231"] },
    "NETWORK": { name: "通信網路 領域", cities: ["2412", "3045", "4904"] },
    "CUSTOM": { name: "統帥自選 領域", cities: [] }
};

// 預載城池基礎資料
const CITIES = {
    "2330": { name: "台積電", price: 825.0, basePrice: 825.0, realPrice: 825.0, vol: 3.5, bars: {} },
    "2454": { name: "聯發科", price: 1150.0, basePrice: 1150.0, realPrice: 1150.0, vol: 12.0, bars: {} },

// --- 史詩級 3D 戰場渲染與粒子系統 ---
let scene, camera, renderer, battleLine;

// 建立具象化城池 (左側)
function createCastle() {
    const castleGroup = new THREE.Group();
    const stoneMat = new THREE.MeshStandardMaterial({color: 0x3a404d, roughness: 0.9, metalness: 0.1});
    const highlightMat = new THREE.MeshStandardMaterial({color: 0x556677, emissive: 0x112233, emissiveIntensity: 0.5});
    
    // 主城牆
    const mainWall = new THREE.Mesh(new THREE.BoxGeometry(12, 18, 70), stoneMat);
    mainWall.position.set(-45, 9, 0);
    castleGroup.add(mainWall);
    
    // 城垛 (上方凹凸)
    for(let z = -33; z <= 33; z += 6) {
        const battlement = new THREE.Mesh(new THREE.BoxGeometry(12, 4, 3), highlightMat);
        battlement.position.set(-45, 19, z);
        castleGroup.add(battlement);
    }
    
    // 防禦塔
    for(let z of [-35, 0, 35]) {
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(5, 6, 26, 8), stoneMat);
        tower.position.set(-42, 13, z);
        const towerTop = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 3, 8), highlightMat);
        towerTop.position.set(-42, 27.5, z);
        castleGroup.add(tower);
        castleGroup.add(towerTop);
    }
    return castleGroup;
}

// 建立立體森林 (右側)
function createForest() {
    const forestGroup = new THREE.Group();
    const trunkMat = new THREE.MeshStandardMaterial({color: 0x2d1a11, roughness: 1.0});
    const leafMat = new THREE.MeshStandardMaterial({color: 0x0f3818, roughness: 0.9, flatShading: true});
    
    for(let i=0; i<45; i++) {
        const tree = new THREE.Group();
        const height = 1 + Math.random()*0.5;
        
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 1.2, 5*height, 5), trunkMat);
        trunk.position.y = 2.5 * height;
        
        const leaves1 = new THREE.Mesh(new THREE.ConeGeometry(4*height, 8*height, 5), leafMat);
        leaves1.position.y = 6 * height;
        
        const leaves2 = new THREE.Mesh(new THREE.ConeGeometry(3*height, 6*height, 5), leafMat);
        leaves2.position.y = 9 * height;
        
        tree.add(trunk, leaves1, leaves2);
        
        // 散佈在右側
        const x = 40 + Math.random() * 25;
        const z = (Math.random() - 0.5) * 80;
        tree.position.set(x, 0, z);
        
        // 隨機旋轉增加自然感
        tree.rotation.y = Math.random() * Math.PI;
        forestGroup.add(tree);
    }
    return forestGroup;
}

// 建立立體戰棋武將 (取代舊方塊)
function createSoldier(colorHex, isPlayer, side) {
    const group = new THREE.Group();
    const scale = isPlayer ? 1.6 : 0.8; 

    const mat = new THREE.MeshStandardMaterial({
        color: colorHex,
        emissive: isPlayer ? colorHex : 0x000000,
        emissiveIntensity: isPlayer ? 0.8 : 0,
        metalness: isPlayer ? 0.8 : 0.1,
        roughness: 0.3,
        flatShading: true
    });

    // 軀幹 (倒錐體)
    const bodyGeo = new THREE.CylinderGeometry(0.8*scale, 0.3*scale, 1.8*scale, 4);
    const body = new THREE.Mesh(bodyGeo, mat);
    body.rotation.y = Math.PI/4;
    body.position.y = 1.0 * scale;
    group.add(body);

    // 頭部 (菱形體)
    const headGeo = new THREE.OctahedronGeometry(0.5*scale);
    const head = new THREE.Mesh(headGeo, mat);
    head.position.y = 2.3 * scale;
    group.add(head);

    // 統帥專屬發光武器
    if (isPlayer) {
        const wpnGeo = new THREE.BoxGeometry(0.1*scale, 3.5*scale, 0.2*scale);
        const wpnMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1.0 });
        const wpn = new THREE.Mesh(wpnGeo, wpnMat);
        const dir = side === 'LONG' ? 1 : -1;
        wpn.position.set(dir * 0.8 * scale, 1.5 * scale, 0.6 * scale);
        wpn.rotation.x = Math.PI / 3;
        group.add(wpn);
        
        // 腳下光環
        const ringGeo = new THREE.RingGeometry(1.2*scale, 1.4*scale, 16);
        const ringMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.1;
        group.add(ring);
    }

    // 動畫參數
    group.userData = { 
        isAttacking: false, 
        randomOffset: Math.random() * Math.PI * 2,
        isPlayer: isPlayer
    };
    return group;
}

// 建立粒子火花系統
function initParticles() {
    const particleCount = 150;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const velocities = [];
    
    for (let i = 0; i < particleCount; i++) {
        positions[i*3] = 0; positions[i*3+1] = -100; positions[i*3+2] = 0; // 初始藏起來
        velocities.push({x:0, y:0, z:0});
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    
    const material = new THREE.PointsMaterial({ 
        color: 0xffdd55, size: 0.6, transparent: true, opacity: 0, blending: THREE.AdditiveBlending 
    });
    
    particles = new THREE.Points(geometry, material);
    particles.userData = { velocities: velocities, active: false, life: 0 };
    scene.add(particles);
}

// 引爆粒子特效
function triggerClashParticles(xPos, side) {
    particles.position.x = xPos;
    particles.material.opacity = 1;
    particles.material.color.setHex(side === 'LONG' ? 0xff4444 : 0x44ff44);
    particles.userData.active = true;
    particles.userData.life = 1.0;
    
    const positions = particles.geometry.attributes.position.array;
    for (let i = 0; i < 150; i++) {
        positions[i*3] = 0;
        positions[i*3+1] = 1 + Math.random()*2; // 高度
        positions[i*3+2] = (Math.random() - 0.5) * 40; // 沿著 Z 軸(戰線)分佈
        
        particles.userData.velocities[i] = {
            x: (Math.random() - 0.5) * 1.5,
            y: Math.random() * 1.5,
            z: (Math.random() - 0.5) * 1.0
        };
    }
    particles.geometry.attributes.position.needsUpdate = true;
}

// 更新粒子狀態 (需放入 animate 迴圈)
function updateParticles() {
    if (!particles || !particles.userData.active) return;
    
    particles.userData.life -= 0.03;
    particles.material.opacity = Math.max(0, particles.userData.life);
    
    if (particles.userData.life <= 0) {
        particles.userData.active = false;
        return;
    }
    
    const positions = particles.geometry.attributes.position.array;
    for (let i = 0; i < 150; i++) {
        positions[i*3] += particles.userData.velocities[i].x;
        positions[i*3+1] += particles.userData.velocities[i].y;
        positions[i*3+2] += particles.userData.velocities[i].z;
        particles.userData.velocities[i].y -= 0.08; // 地心引力
        
        if (positions[i*3+1] < 0) positions[i*3+1] = 0; // 地板反彈阻擋
    }
    particles.geometry.attributes.position.needsUpdate = true;
}

function init3D() {
    scene = new THREE.Scene();
    // 增加霧氣讓邊界融合更自然
    scene.fog = new THREE.FogExp2(0x02050a, 0.012);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 效能優化
    renderer.domElement.style.position = 'absolute';
    renderer.domElement.style.top = '0';
    renderer.domElement.style.left = '0';
    renderer.domElement.style.zIndex = '0';
    document.body.appendChild(renderer.domElement);

    // 大幅提升光線強度，解決太暗問題
    scene.add(new THREE.AmbientLight(0xffffff, 1.5)); // 提升基礎亮度
    const dLight = new THREE.DirectionalLight(0xffffff, 3.5);
    dLight.position.set(10, 60, 20); 
    scene.add(dLight);
    
    // 具有科技感的地板網格
    const grid = new THREE.GridHelper(400, 150, 0x113355, 0x0a1122);
    grid.position.y = 0.01;
    scene.add(grid);
    
    // 底部暗色反射板
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshBasicMaterial({color: 0x010205}));
    plane.rotation.x = -Math.PI/2;
    scene.add(plane);

    // 戰線 (發光體)
    battleLine = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 70), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }));
    scene.add(battleLine);

    // 調整視角，更具臨場感與深度

function onWindowResize() {

// 產生暗色的「市場趨勢力道」大軍
function spawnBaseMarketTroops() {
    for(let i=0; i<25; i++){
        const r = createSoldier(0x661111, false, 'LONG');
        r.position.set(-20 - Math.random()*15, 0, (Math.random()-0.5)*50);
        baseRedArmy.push(r); scene.add(r);
        
        const g = createSoldier(0x115511, false, 'SHORT');
        g.position.set(20 + Math.random()*15, 0, (Math.random()-0.5)*50);
        baseGreenArmy.push(g); scene.add(g);
    }
}

function spawnPlayerTroop(side) {
    const m = createSoldier(side === 'LONG' ? 0xff2222 : 0x22ff22, true, side);
    m.position.set(side === 'LONG' ? -12 : 12, 0, (Math.random()-0.5)*30);
    scene.add(m);
    
    if (side === 'LONG') playerRedArmy.push(m);
    else playerGreenArmy.push(m);
}

function removePlayerTroop(side) {
    const army = side === 'LONG' ? playerRedArmy : playerGreenArmy;
    if (army.length > 0) {
        const m = army.pop();
        scene.remove(m);
    }
}

function syncPlayerTroopsFromState() {
    playerRedArmy.forEach(m => scene.remove(m));
    playerGreenArmy.forEach(m => scene.remove(m));
    playerRedArmy = []; playerGreenArmy = [];
    
    gameState.units.forEach(u => {
        if(u.city === gameState.activeCity) spawnPlayerTroop(u.side);
    });
}

// --- 動態躍擊動畫引擎 ---
function triggerAttackAnim(side) {
    const attackers = side === 'LONG' ? [...playerRedArmy, ...baseRedArmy] : [...playerGreenArmy, ...baseGreenArmy];
    const dir = side === 'LONG' ? 1 : -1; 
    
    attackers.forEach(m => {
        if (m.userData.isAttacking) return;
        m.userData.isAttacking = true;
        const origX = m.position.x;
        
        // 向前跳躍砍擊
        new TWEEN.Tween(m.position)
            .to({ y: 3, x: origX + dir * 5 }, 150)
            .easing(TWEEN.Easing.Quadratic.Out)
            .onComplete(() => {
                // 退回原位
                new TWEEN.Tween(m.position)
                    .to({ y: m.userData.baseY || 0, x: origX }, 250)
                    .easing(TWEEN.Easing.Quadratic.In)
                    .onComplete(() => { m.userData.isAttacking = false; })
                    .start();
            })
            .start();
            
        // 武器揮砍旋轉 (若有)
        if(m.userData.isPlayer && m.children[2]) {
            new TWEEN.Tween(m.children[2].rotation)
                .to({ x: Math.PI/2 }, 150)
                .yoyo(true).repeat(1).start();
        }
    });

    // 戰線閃爍與粒子特效
    triggerClashParticles(battleLine.position.x, side);
    battleLine.material.color.setHex(0xffffff);
    setTimeout(() => {
        battleLine.material.color.setHex(side === 'LONG' ? 0xef4444 : 0x22c55e);
    }, 200);
}

function updateVisuals() {
    const city = CITIES[gameState.activeCity];
    if(!city) return;
    
    const p = safeNum(city.price, city.basePrice);
    const bP = safeNum(city.basePrice, 100);
    
    const diff = bP > 0 ? (p - bP) / bP : 0;
    const drift = safeNum(diff * 450, 0);
    
    battleLine.position.x += (drift - battleLine.position.x) * 0.1;
    if (!battleLine.material.color.equals(new THREE.Color(0xffffff))) { 
        battleLine.material.color.setHex(diff >= 0 ? 0xef4444 : 0x22c55e);
    }

    // 基準位置計算
    baseRedArmy.forEach(m => {
        if (!m.userData.isAttacking) {
            const tx = Math.min(drift - 3, -6 + (diff >= 0 ? Math.abs(diff)*100 : 0));
            m.position.x += (safeNum(tx, -6) - m.position.x) * 0.1;
        }
    });
    baseGreenArmy.forEach(m => {
        if (!m.userData.isAttacking) {
            const tx = Math.max(drift + 3, 6 - (diff < 0 ? Math.abs(diff)*100 : 0));
            m.position.x += (safeNum(tx, 6) - m.position.x) * 0.1;
        }
    });
    
    playerRedArmy.forEach(m => {
        if (!m.userData.isAttacking) {
            const tx = Math.min(drift - 8, -4 + (diff >= 0 ? Math.abs(diff)*120 : 0));
            m.position.x += (safeNum(tx, -4) - m.position.x) * 0.15;
        }
    });
    playerGreenArmy.forEach(m => {
        if (!m.userData.isAttacking) {
            const tx = Math.max(drift + 8, 4 - (diff < 0 ? Math.abs(diff)*120 : 0));
            m.position.x += (safeNum(tx, 4) - m.position.x) * 0.15;
        }
    });
}

// 動畫渲染主迴圈
function animate() { 
    requestAnimationFrame(animate); 
    TWEEN.update(); 
    
    const time = Date.now() * 0.002;
    
    // 待命呼吸浮動動畫
    const allTroops = [...baseRedArmy, ...baseGreenArmy, ...playerRedArmy, ...playerGreenArmy];
    allTroops.forEach(m => {
        if (!m.userData.isAttacking) {
            // 平滑的上下浮動
            m.position.y = Math.sin(time + m.userData.randomOffset) * 0.3 + (m.userData.isPlayer ? 0.3 : 0);
        }
    });
    
    updateParticles();
    renderer.render(scene, camera); 
}

// --- 時間閘門與雙軌引擎 ---

function getTaiwanTimeStr() {
    return new Date().toLocaleDateString('zh-TW', {timeZone: 'Asia/Taipei'});
}

function checkTimeEvents() {
    const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Taipei"}));
    const hh = now.getHours();
    const mm = now.getMinutes();
    const timeNum = hh * 100 + mm;
    const todayStr = getTaiwanTimeStr();

    let newStatus = "CLOSED";
    if (timeNum >= 855 && timeNum < 900) newStatus = "PRE";
    else if (timeNum >= 900 && timeNum < 1330) newStatus = "OPEN";

    if (currentMarketState !== newStatus) {
        if (newStatus === "PRE" && isSimMode) forceCloseSimMode(true);
        
        if (newStatus === "OPEN") {
            if (isSimMode) forceCloseSimMode(false); 
            processOvernightDividend(todayStr);
            
            if (gameState.pendingSimReward > 0) {
                gameState.balance += gameState.pendingSimReward;
                triggerGoldThunder();
                showMsg(`開盤天降甘霖！發放沙盤推演獎勵 ${Math.floor(gameState.pendingSimReward)} 天幣！`);
                gameState.pendingSimReward = 0;
                saveState();
            }
        }
        currentMarketState = newStatus;
    }

    const label = document.getElementById('market-status-label');
    const simBtn = document.getElementById('sim-btn');
    
    if (isSimMode) {
        label.innerText = "沙盤推演 無損練兵中";
        label.className = "text-[10px] md:text-xs text-sky-300 font-bold uppercase tracking-widest bg-sky-500/20 px-3 py-1.5 rounded-md border border-sky-500/30 animate-pulse";
        simBtn.innerText = "結束推演 迎接開盤";
        simBtn.className = "bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded-md text-[10px] text-white font-bold tracking-widest shadow-[0_0_15px_rgba(220,38,38,0.5)] transition-all";
        simBtn.classList.remove('hidden');
    } else {
        if (currentMarketState === "OPEN") {
            label.innerText = "真實天道 運轉中";
            label.className = "text-[10px] md:text-xs text-yellow-400 font-bold uppercase tracking-widest bg-yellow-500/20 px-3 py-1.5 rounded-md border border-yellow-500/30";
            simBtn.classList.add('hidden');
        } else if (currentMarketState === "PRE") {
            label.innerText = "盤前試撮 準備開戰";
            label.className = "text-[10px] md:text-xs text-orange-400 font-bold uppercase tracking-widest bg-orange-500/20 px-3 py-1.5 rounded-md border border-orange-500/30";
            simBtn.classList.add('hidden');
        } else {
            label.innerText = "天道休市 盤後時段";
            label.className = "text-[10px] md:text-xs text-gray-400 font-bold uppercase tracking-widest bg-white/10 px-3 py-1.5 rounded-md border border-white/20";
            simBtn.innerText = "啟動沙盤推演";
            simBtn.className = "bg-sky-600 hover:bg-sky-500 px-3 py-1.5 rounded-md text-[10px] text-white font-bold tracking-widest shadow-[0_0_15px_rgba(2,132,199,0.5)] transition-all animate-pulse";
            simBtn.classList.remove('hidden');
        }
    }
}

function processOvernightDividend(todayStr) {
    if (gameState.lastDividendDay === todayStr) return; 
    
    let totalDividend = 0;
    gameState.units.forEach(u => {
        if (u.entryDate && u.entryDate !== todayStr && !u.isSim) {
            const city = CITIES[u.city];
            if (city) {
                const value = safeNum(city.price, city.basePrice) * u.qty * 1000;
                totalDividend += (value * 0.005);
            }
        }
    });

    if (totalDividend > 0) {
        if (gameState.treasury >= totalDividend) {
            gameState.treasury -= totalDividend;
            gameState.balance += totalDividend;
            triggerGoldThunder();
            showMsg(`持久戰甘霖發放 榮獲 ${Math.floor(totalDividend).toLocaleString()} 天幣獎勵`);
        } else {
            showMsg("天道國庫空虛 暫停撥發跨日甘霖");
        }
    }
    
    gameState.lastDividendDay = todayStr;
    saveState();
}

function toggleSimMode() {
    if (currentMarketState === "OPEN" || currentMarketState === "PRE") {
        showMsg("真實天道運行中 禁止沙盤推演");
        triggerThunder();
        return;
    }
    if (isSimMode) {
        forceCloseSimMode(false);
    } else {
        realStateSnapshot = JSON.parse(JSON.stringify(gameState));
        isSimMode = true;
        
        document.getElementById('real-pnl-container').classList.add('hidden');
        document.getElementById('sim-pnl-container').classList.remove('hidden');

function forceCloseSimMode(isAuto) {
    if (!isSimMode || !realStateSnapshot) return;
    
    const simNetValue = safeNum(gameState.balance) + safeNum(gameState.frozen);
    const realNetValue = safeNum(realStateSnapshot.balance) + safeNum(realStateSnapshot.frozen);
    const simProfit = simNetValue - realNetValue;

    gameState = JSON.parse(JSON.stringify(realStateSnapshot));
    realStateSnapshot = null;
    isSimMode = false;

    let msg = "沙盤結束 本金無傷還原";
    if (simProfit > 0) {
        const reward = simProfit * 0.005; 
        gameState.pendingSimReward = safeNum(gameState.pendingSimReward) + reward;
        msg = `沙盤獲利！獲得獎勵 ${Math.floor(reward)} 天幣，將於明日開盤發放`;
        triggerGoldThunder();
    } else {
        triggerThunder();
        if (isAuto) msg = "盤前試撮啟動 強制結束沙盤練兵";
    }

    Object.keys(CITIES).forEach(c => {
        CITIES[c].price = safeNum(CITIES[c].realPrice, CITIES[c].basePrice);
    });
    currentPrice = CITIES[gameState.activeCity].price;
    syncPlayerTroopsFromState();

    document.getElementById('sim-pnl-container').classList.add('hidden');
    document.getElementById('real-pnl-container').classList.remove('hidden');

    const db = document.getElementById('main-dashboard');
    const tabC = document.getElementById('tab-container');
    const ord = document.getElementById('order-panel');
    db.classList.replace('glass-sim', 'glass');
    tabC.classList.replace('glass-sim', 'glass');
    ord.classList.replace('glass-sim', 'glass');
    
    showMsg(msg);
    saveState();
    updateUI();
}

async function fetchRealMarketData() {
    const cityCode = gameState.activeCity;
    const city = CITIES[cityCode];
    if (!city) return;

    let fetchedPrice = null;
    let fetchedBase = null;

    try {
        if (USER_API_KEY) {
            const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${cityCode}&token=${USER_API_KEY}`);
            if (res.ok) {
                const data = await res.json();
                if(data.c) { fetchedPrice = data.c; fetchedBase = data.pc; }
            }
        }
        
        if (!fetchedPrice) {
            const ySym = /^\d{4}$/.test(cityCode) ? cityCode + '.TW' : cityCode;
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ySym}`;
            const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(url)}`;
            
            try {
                const res = await fetch(proxyUrl);
                if (res.ok) {
                    const data = await res.json();
                    const meta = data.chart.result[0].meta;
                    fetchedPrice = meta.regularMarketPrice;
                    fetchedBase = meta.previousClose || city.basePrice;
                }
            } catch(e2) {
                const backupUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                const res2 = await fetch(backupUrl);
                if (res2.ok) {
                    const data2 = await res2.json();
                    const meta2 = data2.chart.result[0].meta;
                    fetchedPrice = meta2.regularMarketPrice;
                    fetchedBase = meta2.previousClose || city.basePrice;
                }
            }
        }

        const p = parseFloat(fetchedPrice);
        if (!isNaN(p) && p > 0) {
            city.realPrice = p;
            city.basePrice = parseFloat(fetchedBase) || city.realPrice;
            
            if (!isSimMode) {
                city.price = city.realPrice;
                currentPrice = city.price;
            }
            
            if(!city.bars[gameState.timeframe]) initKbars(city);
            const bars = city.bars[gameState.timeframe];
            bars.push({ p: p, v: 100 + Math.random()*900 });
            if(bars.length > 100) bars.shift();
        }
    } catch(e) { console.warn("報價抓取中斷，使用本地暫存價", e); }
}

function initKbars(city) {
    city.bars = { "1m": [], "5m": [], "15m": [], "30m": [], "1H": [], "1D": [], "1W": [] };
    let tempPrice = safeNum(city.basePrice, 100);
    const volBase = safeNum(city.basePrice, 100) * 0.01;
    
    for(let i=0; i<100; i++){
        tempPrice += (Math.random()-0.5) * volBase;
        if(tempPrice <= 0.1) tempPrice = 0.1;
        const bar = { p: tempPrice, v: 100 + Math.random()*900 };
        Object.keys(city.bars).forEach(tf => city.bars[tf].push(bar));
    }
}

function startMarketPolling() {
    if (apiPollingInterval) clearInterval(apiPollingInterval);
    apiPollingInterval = setInterval(fetchRealMarketData, 5000);
    fetchRealMarketData();
}

function triggerHeavenlyRain(unit) {
    const gen = GENERALS[Math.floor(Math.random() * GENERALS.length)];
    const bonus = 0.5;
    const oldQty = safeNum(unit.qty, 1);
    unit.qty = oldQty + bonus;
    unit.cost = (safeNum(unit.cost, 1) * oldQty) / unit.qty; 
    
    const o = document.getElementById('thunder-overlay');
    o.classList.remove('thunder-flash','gold-thunder-flash','sim-thunder-flash');
    void o.offsetWidth;
    o.classList.add('gold-thunder-flash');
    setTimeout(()=>o.classList.remove('gold-thunder-flash'), 800);
    
    showMsg(`天降甘霖 大將 ${gen} 參戰 賜予 零點五 營兵力`);
    saveState();
    updateUI();
}

function localTick() {
    checkTimeEvents();
    
    const city = CITIES[gameState.activeCity];
    if (isSimMode && city) {
        const bp = safeNum(city.basePrice, 100);
        const cp = safeNum(city.price, bp);
        const v = safeNum(city.vol, 2.0);
        
        const maxDev = bp * 0.06;
        const drift = (Math.random() - 0.5) * v * 2;
        let newPrice = cp + drift;
        
        if (isNaN(newPrice) || newPrice <= 0.1) newPrice = bp;
        if (newPrice > bp + maxDev) newPrice = bp + maxDev;
        if (newPrice < bp - maxDev) newPrice = bp - maxDev;
        
        city.price = newPrice;
        currentPrice = city.price;
    }

    // 觸發躍擊動畫判定
    if (Math.abs(currentPrice - lastPriceForAnim) > 0.01) {
        if (currentPrice > lastPriceForAnim) triggerAttackAnim('LONG');
        else triggerAttackAnim('SHORT');
        lastPriceForAnim = currentPrice;
    }

    if (currentMarketState !== "PRE") {
        checkPendingOrders();
    }
    
    gameState.units.forEach(u => {
        u.holdTicks = (u.holdTicks || 0) + 1;
        if (u.holdTicks % 60 === 0) triggerHeavenlyRain(u);
    });

    updateVisuals();
    if(document.getElementById('chart-page').classList.contains('hidden') === false) updateCharts();
    updateUI();
}

function issueOrder(side) {
    // 嚴防呆：休市期間且未進入沙盤，絕對阻擋下單！
    if (currentMarketState === "CLOSED" && !isSimMode) {
        showMsg("天道休市期間 僅開放沙盤練兵下單");
        triggerThunder();
        return;
    }

    const qtyStr = String(document.getElementById('order-qty').value).trim();
    const priceStr = String(document.getElementById('order-price').value).trim();
    const qty = parseInt(qtyStr) || 0;
    const tPrice = parseFloat(priceStr) || currentPrice;
    
    if(qty <= 0 || !gameState.activeCity) return;
    
    const validCurrentPrice = safeNum(currentPrice, CITIES[gameState.activeCity].basePrice);

    const pos = gameState.units.find(u => u.city === gameState.activeCity);
    if(pos && pos.side !== side){ showMsg("立場衝突 請先結算目前兵力"); triggerThunder(); return; }

    const vol = tPrice * qty * 1000;
    const tax = vol * TAX_RATE, fee = vol * FEE_RATE, total = vol + tax + fee;
    if(gameState.balance < total){ showMsg("存銀不足 無法派遣"); triggerThunder(); return; }

    let immediate = false;
    if(currentMarketState !== "PRE") {
        if(side === 'LONG' && tPrice >= validCurrentPrice) immediate = true;
        if(side === 'SHORT' && tPrice <= validCurrentPrice) immediate = true;
    }

    if(immediate){
        gameState.balance -= total;
        executeOrder({ city: gameState.activeCity, side, qty, tax, fee, isSim: isSimMode }, validCurrentPrice);
        showMsg("市價滿足 立即出征");
    } else {
        gameState.balance -= total; gameState.frozen += total;
        gameState.pending.push({ 
            id: Date.now(), city: gameState.activeCity, side, qty, 
            price: tPrice, totalCost: total, tax, fee, isSim: isSimMode 
        });
        showMsg("進入埋伏 等候滿足價位");
    }
    saveState();
    updateUI();
}

function checkPendingOrders() {
    for(let i=gameState.pending.length-1; i>=0; i--){
        const o = gameState.pending[i];
        const m = safeNum(CITIES[o.city]?.price, 0);
        if (m <= 0.1) continue;
        
        let canFill = false;
        if(o.side === 'LONG' && m <= o.price) canFill = true;
        if(o.side === 'SHORT' && m >= o.price) canFill = true;

        if(canFill){
            gameState.pending.splice(i,1); executeOrder(o, m);
            showMsg(`天道撮合 ${CITIES[o.city].name} 入城`);
            saveState();
        }
    }
}

function executeOrder(o, fP) {
    if(o.totalCost) gameState.frozen -= o.totalCost;
    const vol = fP * o.qty * 1000;
    const aTax = vol * TAX_RATE, aFee = vol * FEE_RATE;
    
    if(!isSimMode) gameState.treasury += (aTax + aFee);

    gameState.units.push({
        id: Date.now() + Math.random(), city: o.city, side: o.side, qty: o.qty,
        cost: (vol + aTax + aFee) / (o.qty * 1000),
        entry: fP, tax: aTax, fee: aFee,
        time: new Date().toLocaleTimeString('zh-TW', { hour12: false }),
        entryDate: getTaiwanTimeStr(),
        isSim: o.isSim || isSimMode
    });
    
    if(o.city === gameState.activeCity) spawnPlayerTroop(o.side);
    
    saveState();
}

function settle(id) {
    const idx = gameState.units.findIndex(u => u.id === id);
    if (idx === -1) return;
    const u = gameState.units[idx];
    const city = CITIES[u.city];
    const validPrice = safeNum(city.price, city.basePrice);
    
    const vol = validPrice * u.qty * 1000;
    const isDayTrade = u.entryDate === getTaiwanTimeStr();
    const actualTaxRate = isDayTrade ? 0.0015 : TAX_RATE;
    const tax = vol * actualTaxRate;
    const fee = vol * FEE_RATE;
    
    const pnl = u.side === 'LONG' ? (validPrice - u.cost)*u.qty*1000 : (u.cost - validPrice)*u.qty*1000;
    
    gameState.balance += (vol - tax - fee); 
    
    if(!isSimMode) {
        gameState.treasury += (tax + fee); 
        gameState.realizedPnl += pnl;
    }
    
    const rep = { ...u, exit: validPrice, eTax: tax, eFee: fee, pnl, isDayTrade };
    gameState.history.unshift(rep); 
    gameState.units.splice(idx,1);
    
    if(u.city === gameState.activeCity) removePlayerTroop(u.side);
    
    saveState();
    showWarReport(rep); 
    updateUI();
}

function cancelOrder(id) {
    const idx = gameState.pending.findIndex(o => o.id === id);
    if (idx === -1) return;
    const o = gameState.pending[idx];
    gameState.balance += safeNum(o.totalCost);
    gameState.frozen -= safeNum(o.totalCost);
    gameState.pending.splice(idx, 1);
    showMsg("撤回軍令 資金歸庫");
    saveState();
    updateUI();
}

function updateCharts() {
    const city = CITIES[gameState.activeCity];
    if(!city || !city.bars) return;
    const bars = city.bars[gameState.timeframe] || [];
    if(bars.length < 9) return;

    const recentPrices = bars.slice(-9).map(b => safeNum(b.p, city.basePrice));
    const low = Math.min(...recentPrices), high = Math.max(...recentPrices);
    const validCurrent = safeNum(currentPrice, city.basePrice);
    
    const rsv = high === low ? 50 : ((validCurrent - low)/(high - low))*100;
    const k = 50 * (2/3) + safeNum(rsv, 50) * (1/3), d = 50 * (2/3) + safeNum(k, 50) * (1/3);
    document.getElementById('kd-k').innerText = `K ${k.toFixed(1)}`;
    document.getElementById('kd-d').innerText = `D ${d.toFixed(1)}`;
    
    const macd = (validCurrent * 0.03); 
    const macdEl = document.getElementById('macd-val');
    macdEl.innerText = safeNum(macd, 0).toFixed(2);
    macdEl.className = `text-4xl font-mono font-black drop-shadow-md ${macd >= 0 ? 'text-red-400' : 'text-green-400'}`;

    const vC = document.getElementById('volume-bars'); vC.innerHTML = '';
    const maxV = Math.max(...bars.map(b => safeNum(b.v, 1)), 1);
    const displayCount = window.innerWidth < 768 ? 40 : 80;
    bars.slice(-displayCount).forEach(b => {
        const vB = document.createElement('div'); 
        vB.className = `flex-1 rounded-t min-w-[2px] transition-all duration-300 ${macd >= 0 ? 'bg-red-500/60' : 'bg-green-500/60'}`;
        vB.style.height = `${Math.max((safeNum(b.v,0)/maxV)*100, 5)}%`; 
        vC.appendChild(vB);
    });
}

    const list = document.getElementById('custom-stock-list'); list.innerHTML = '';
    SECTORS["CUSTOM"].cities.forEach(sym => {
        list.innerHTML += `<div class="flex justify-between items-center bg-black/40 p-3 rounded-xl border border-white/5"><div class="flex flex-col"><span class="text-sm font-bold text-yellow-500">${sym}</span><span class="text-[10px] text-gray-400 mt-0.5">${CITIES[sym].name}</span></div><button onclick="removeCustomStock('${sym}')" class="text-[10px] bg-red-900/50 hover:bg-red-800 border border-red-500/30 px-3 py-1.5 rounded-lg text-red-200 transition-colors">移除</button></div>`;
    });
}

function switchTab(t) {
    gameState.currentTab = t;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${t}`).classList.add('active');
    ['units','history','pending'].forEach(x => { const el = document.getElementById(`tab-content-${x}`); if(el) el.classList.add('hidden'); });
    const content = document.getElementById(`tab-content-${t}`); if(content) content.classList.remove('hidden');
    renderLists();
}

function updateUI() {
    const city = CITIES[gameState.activeCity];
    if(!city) return;
    
    document.getElementById('user-balance').innerText = Math.floor(safeNum(gameState.balance)).toLocaleString();
    document.getElementById('frozen-balance').innerText = `天道凍結 待命軍費 ${Math.floor(safeNum(gameState.frozen)).toLocaleString()}`;
    
    const tb = document.getElementById('treasury-balance-display');
    if(tb) tb.innerText = Math.floor(safeNum(gameState.treasury)).toLocaleString();
    
    // 若非模擬，則顯示即時價位
    if (!isSimMode) document.getElementById('market-price').innerText = safeNum(currentPrice).toFixed(2);
    
    const validBase = safeNum(city.basePrice, 100);
    document.getElementById('base-price-display').innerText = validBase.toFixed(2);
    
    const pct = ((safeNum(currentPrice, validBase) - validBase)/validBase*100);
    const elPct = document.getElementById('price-change');
    elPct.innerText = `${pct >= 0 ? '正' : '負'} ${Math.abs(safeNum(pct,0)).toFixed(2)} 百分比`;
    elPct.className = `text-[11px] md:text-xs font-bold mt-1 ${pct >= 0 ? 'text-red-500' : 'text-green-500'}`;

    let realUnrealized = 0;
    let simUnrealized = 0;
    
    gameState.units.forEach(u => { 
        const c = CITIES[u.city];
        if (c) {
            const cp = safeNum(c.price, c.basePrice);
            const profit = (u.side==='LONG' ? (cp - u.cost) : (u.cost - cp)) * u.qty * 1000;
            if (u.isSim) simUnrealized += profit;
            else realUnrealized += profit;
        }
    });

    const realTot = safeNum(gameState.realizedPnl) + realUnrealized;
    const elRealTot = document.getElementById('today-total-result');
    if (elRealTot) {
        elRealTot.innerText = `${realTot >= 0 ? '加' : '減'} ${Math.abs(Math.floor(realTot)).toLocaleString()}`;
        elRealTot.className = `text-lg md:text-xl font-black font-mono drop-shadow-md ${realTot >= 0 ? 'text-red-500' : 'text-green-500'}`;
    }

    if (isSimMode) {
        const simNetValue = safeNum(gameState.balance) + safeNum(gameState.frozen);
        const realNetValue = safeNum(realStateSnapshot?.balance) + safeNum(realStateSnapshot?.frozen);
        const simProfit = simNetValue - realNetValue + simUnrealized;
        
        const elSimTot = document.getElementById('sim-total-result');
        if (elSimTot) {
            elSimTot.innerText = `${simProfit >= 0 ? '加' : '減'} ${Math.abs(Math.floor(simProfit)).toLocaleString()}`;
        }
    }

    renderLists();
}

function renderLists() {
    const cont = document.getElementById(`tab-content-${gameState.currentTab}`);
    if(!cont) return; 
    cont.innerHTML = '';
    
    if(gameState.currentTab === 'units'){
        if(gameState.units.length === 0) cont.innerHTML = '<div class="text-[10px] text-gray-600 text-center py-8 font-bold tracking-widest">目前無駐紮部隊</div>';
        gameState.units.forEach(u => {
            const c = CITIES[u.city];
            const m = c ? safeNum(c.price, c.basePrice) : safeNum(u.entry, 0);
            const p = (u.side==='LONG' ? (m-u.cost) : (u.cost-m))*u.qty*1000;
            const tag = u.isSim ? '<span class="bg-sky-500/20 border border-sky-500/30 text-sky-400 px-1.5 py-0.5 rounded text-[8px] ml-1">沙盤推演</span>' : '';
            cont.innerHTML += `<div class="bg-black/40 rounded-xl p-3 border-r-4 ${p>=0?'border-red-500':'border-green-500'} text-right mb-2 shadow-inner">
                <button onclick="settle(${u.id})" class="float-left text-[9px] bg-white/10 hover:bg-white/20 border border-white/20 px-3 py-1.5 rounded-lg transition-colors font-bold text-gray-300">結算撤軍</button>
                <div class="text-[11px] text-gray-400 font-bold mb-1">${c?.name || u.city} <span class="${u.side==='LONG'?'text-red-400':'text-green-400'}">${u.side==='LONG'?'多':'空'}</span> ${safeNum(u.qty).toFixed(1)} 營 ${tag}</div>
                <div class="text-sm font-black font-mono ${p>=0?'text-red-500':'text-green-500'}">戰功 ${Math.floor(safeNum(p)).toLocaleString()}</div>
            </div>`;
        });
    } else if(gameState.currentTab === 'history'){
        if(gameState.history.length === 0) cont.innerHTML = '<div class="text-[10px] text-gray-600 text-center py-8 font-bold tracking-widest">尚無作戰紀錄</div>';
        gameState.history.slice(0, 15).forEach(h => {
            const tag = h.isSim ? '<span class="text-sky-400 font-bold">沙盤戰果</span>' : '<span class="text-gray-400 font-bold">實戰戰果</span>';
            cont.innerHTML += `<div class="bg-black/30 rounded-lg p-2.5 border-r-2 border-gray-600 text-right text-[10px] mb-2 opacity-80">
                <span class="text-gray-500 font-mono tracking-tighter mr-2">${h.time}</span>
                <span class="text-gray-300 mr-2">${CITIES[h.city]?.name || h.city}</span>
                ${tag} <span class="font-mono font-bold ${h.pnl>=0?'text-red-400':'text-green-400'} ml-1">${Math.floor(safeNum(h.pnl)).toLocaleString()}</span>
            </div>`;
        });
    } else if(gameState.currentTab === 'pending'){
        if(gameState.pending.length === 0) cont.innerHTML = '<div class="text-[10px] text-gray-600 text-center py-8 font-bold tracking-widest">無待命軍令</div>';
        gameState.pending.forEach(o => {
            const tag = o.isSim ? '<span class="bg-sky-500/20 border border-sky-500/30 text-sky-400 px-1.5 py-0.5 rounded text-[8px] ml-1">沙盤推演</span>' : '';
            cont.innerHTML += `<div class="bg-black/40 rounded-xl p-3 border-r-4 border-gray-500 text-right mb-2 flex justify-between items-center shadow-inner">
                <button onclick="cancelOrder(${o.id})" class="text-[10px] bg-red-900/30 hover:bg-red-800/50 border border-red-500/30 text-red-300 px-3 py-1.5 rounded-lg transition-colors font-bold">撤回</button>
                <div class="text-[11px] text-gray-300 font-bold">${CITIES[o.city]?.name || o.city} <span class="text-gray-500 ml-1 text-[9px]">待命價</span> <span class="font-mono">${safeNum(o.price).toFixed(2)}</span> ${tag}</div>
            </div>`;
        });
    }
}

function triggerThunder() { const o = document.getElementById('thunder-overlay'); o.classList.remove('thunder-flash','gold-thunder-flash','sim-thunder-flash'); void o.offsetWidth; o.classList.add('thunder-flash'); setTimeout(()=>o.classList.remove('thunder-flash'), 500); }
function triggerGoldThunder() { const o = document.getElementById('thunder-overlay'); o.classList.remove('thunder-flash','gold-thunder-flash','sim-thunder-flash'); void o.offsetWidth; o.classList.add('gold-thunder-flash'); setTimeout(()=>o.classList.remove('gold-thunder-flash'), 800); }
function triggerSimThunder() { const o = document.getElementById('thunder-overlay'); o.classList.remove('thunder-flash','gold-thunder-flash','sim-thunder-flash'); void o.offsetWidth; o.classList.add('sim-thunder-flash'); setTimeout(()=>o.classList.remove('sim-thunder-flash'), 800); }

// 優化 Toast 訊息提示
let msgTimeout;
function showMsg(t) { 
    const el = document.getElementById('msg-box'); 
    el.innerText = t; 
    el.classList.remove('opacity-0', 'translate-y-4');
    el.classList.add('opacity-100', 'translate-y-0');
    
    if(msgTimeout) clearTimeout(msgTimeout);
    msgTimeout = setTimeout(()=>{
        el.classList.remove('opacity-100', 'translate-y-0');
        el.classList.add('opacity-0', 'translate-y-4');
    }, 3500); 
}

function animate() { requestAnimationFrame(animate); TWEEN.update(); renderer.render(scene, camera); }

window.onload = () => { 
    loadState();
    init3D(); 
    switchSector("SEMICON"); 
    startMarketPolling(); 
    setInterval(localTick, 1000);
};
</script>
