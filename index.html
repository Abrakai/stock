<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三界戰場：傭兵統帥傳奇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #020202; font-family: 'Noto Sans TC', sans-serif; color: white; touch-action: none; }
        canvas { display: block; }
        .glass { background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .ui-overlay { pointer-events: none; }
        .ui-overlay > * { pointer-events: auto; }
        .tab-btn { font-size: 11px; padding: 8px 12px; border-bottom: 2px solid transparent; transition: all 0.3s; color: #888; font-weight: bold; white-space: nowrap; }
        .tab-btn.active { color: #eab308; border-color: #eab308; }
        @keyframes thunder {
            0% { background: rgba(255, 255, 255, 0); }
            10% { background: rgba(255, 255, 255, 0.3); }
            20% { background: rgba(255, 255, 255, 0); }
            100% { background: rgba(255, 255, 255, 0); }
        }
        @keyframes goldThunder {
            0% { background: rgba(234, 179, 8, 0); }
            10% { background: rgba(234, 179, 8, 0.4); }
            20% { background: rgba(234, 179, 8, 0); }
            100% { background: rgba(234, 179, 8, 0); }
        }
        .thunder-flash { animation: thunder 0.5s ease-out; }
        .gold-thunder-flash { animation: goldThunder 0.8s ease-out; }
        .result-positive { color: #ef4444; }
        .result-negative { color: #22c55e; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .timeframe-btn { font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; }
        .timeframe-btn.active { background: #eab308; color: black; border-color: #eab308; font-weight: 900; }
    </style>
</head>
<body>

<div id="thunder-overlay" class="fixed inset-0 pointer-events-none z-50"></div>

<!-- Main UI Overlay -->
<div id="main-ui" class="fixed inset-0 ui-overlay flex flex-col justify-between p-2 md:p-6 z-10">
    <!-- Top Bar -->
    <div class="flex flex-col md:flex-row justify-between items-start gap-2 md:gap-4 h-[40vh] md:h-auto overflow-hidden">
        
        <!-- Left Panel: Balance & Global Info -->
        <div class="space-y-2 md:space-y-4 w-full md:w-96 flex-shrink-0 overflow-y-auto scrollbar-hide pb-2">
            <div class="glass rounded-2xl p-4 md:p-5 w-full shadow-2xl border-yellow-500/20">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-[10px] md:text-xs text-gray-400 font-bold uppercase tracking-widest">人界存銀 天幣</span>
                    <div class="flex gap-2">
                        <button onclick="openApiSettings()" class="bg-white/10 hover:bg-white/20 px-2 py-1 rounded text-[9px] text-gray-300">連線設定</button>
                        <button onclick="openChartPage()" class="bg-blue-600 hover:bg-blue-500 px-2 py-1 rounded text-[9px] text-white font-bold tracking-widest">軍師圖表</button>
                    </div>
                </div>
                <div class="flex justify-between items-end">
                    <div>
                        <div id="user-balance" class="text-2xl md:text-3xl font-mono font-black text-yellow-500">5,000,000</div>
                        <div id="frozen-balance" class="text-[9px] text-gray-500 mt-1">天道凍結中 待命軍費 零</div>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-[9px] text-gray-500 font-bold uppercase">今日總戰果</span>
                        <div id="today-total-result" class="text-base md:text-lg font-black font-mono">加 零</div>
                    </div>
                </div>
                
                <div class="mt-3 md:mt-4 pt-3 border-t border-white/10 space-y-2">
                    <div class="flex gap-2 items-center">
                        <select id="sector-selector" onchange="switchSector(this.value)" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-2 py-2 text-[10px] md:text-xs font-bold text-gray-300 focus:outline-none truncate">
                            <option value="SEMICON">半導體 產業領域</option>
                            <option value="DIGITAL">數位生活 產業領域</option>
                            <option value="ENERGY">能源交通 產業領域</option>
                            <option value="CUSTOM">統帥自選 專屬領域</option>
                        </select>
                        <select id="city-selector" onchange="switchCity(this.value)" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-2 py-2 text-[10px] md:text-xs font-bold text-white focus:outline-none cursor-pointer truncate">
                            <!-- Options populated by JS -->
                        </select>
                        <button onclick="openCustomManager()" class="bg-white/10 p-2 rounded-lg text-white font-bold text-[10px]">管理</button>
                    </div>
                    
                    <div class="flex justify-between items-end">
                        <div class="flex flex-col">
                            <span id="market-price" class="text-xl md:text-2xl font-mono font-bold text-white tracking-tighter">連線中</span>
                            <span id="price-change" class="text-[10px] md:text-xs font-bold text-gray-400">零點零零 百分比</span>
                        </div>
                        <div class="text-right">
                            <div class="text-[8px] md:text-[9px] text-gray-500 uppercase font-bold">昨日平盤價</div>
                            <div id="base-price-display" class="text-xs md:text-sm font-mono font-bold text-gray-300">---</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass rounded-2xl p-3 md:p-4 w-full border-purple-500/30 flex justify-between items-center hidden md:flex">
                <div>
                    <div class="text-[9px] md:text-[10px] text-purple-400 font-bold uppercase tracking-widest mb-1">天道總帳 累計稅收</div>
                    <div id="total-tax-display" class="text-lg md:text-xl font-mono font-bold text-purple-300">0</div>
                </div>
                <button onclick="showDailySummary()" class="bg-purple-900/40 hover:bg-purple-800 text-[9px] font-bold px-3 py-2 rounded-lg border border-purple-500/30">檢視今日總結報表</button>
            </div>
        </div>

        <!-- Right Panel: Sidebar Tabs -->
        <div class="w-full md:w-80 lg:w-96 flex flex-col gap-2 h-full md:max-h-[70vh] flex-shrink-0">
            <div class="glass rounded-t-2xl flex border-b border-white/10 overflow-x-auto scrollbar-hide">
                <button onclick="switchTab('units')" id="tab-units" class="tab-btn flex-1 active">未平倉部隊</button>
                <button onclick="switchTab('history')" id="tab-history" class="tab-btn flex-1">今日戰史</button>
                <button onclick="switchTab('pending')" id="tab-pending" class="tab-btn flex-1">待命軍令</button>
            </div>
            <div class="glass rounded-b-2xl p-3 md:p-4 flex-1 overflow-y-auto scrollbar-hide min-h-[150px]">
                <div id="tab-content-units" class="space-y-2"></div>
                <div id="tab-content-history" class="space-y-2 hidden"></div>
                <div id="tab-content-pending" class="space-y-2 hidden"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Bar: Orders -->
    <div class="w-full max-w-4xl mx-auto mt-2 md:mt-auto">
        <div class="glass rounded-3xl p-3 md:p-6 flex flex-wrap md:flex-nowrap items-center gap-2 md:gap-6 shadow-2xl border-white/20 w-full">
            <div class="flex flex-col w-[48%] md:w-auto">
                <span class="text-[9px] text-gray-500 font-bold uppercase mb-1">派遣數量 營</span>
                <input id="order-qty" type="number" value="1" min="1" class="bg-white/5 border border-white/10 rounded-lg px-2 md:px-4 py-2 w-full md:w-24 text-base md:text-xl font-bold focus:border-yellow-500 outline-none text-center">
            </div>
            <div class="flex flex-col w-[48%] md:w-auto">
                <span class="text-[9px] text-gray-500 font-bold uppercase mb-1">委託進場價位</span>
                <input id="order-price" type="number" step="0.5" placeholder="市價" class="bg-white/5 border border-white/10 rounded-lg px-2 md:px-4 py-2 w-full md:w-32 text-base md:text-xl font-bold focus:border-yellow-500 outline-none text-center">
            </div>
            
            <div class="hidden md:block h-12 w-px bg-white/10"></div>
            
            <div class="flex gap-2 md:gap-4 flex-1 w-full mt-2 md:mt-0">
                <button id="btn-long" onclick="issueOrder('LONG')" class="flex-1 bg-red-600 hover:bg-red-500 active:scale-95 transition-all rounded-xl md:rounded-2xl py-3 md:py-4 flex flex-col items-center justify-center">
                    <span class="text-[10px] md:text-xs font-bold text-red-200">護國多軍</span>
                    <span class="text-sm md:text-lg font-black uppercase tracking-widest">派遣入城</span>
                </button>
                <button id="btn-short" onclick="issueOrder('SHORT')" class="flex-1 bg-green-600 hover:bg-green-500 active:scale-95 transition-all rounded-xl md:rounded-2xl py-3 md:py-4 flex flex-col items-center justify-center">
                    <span class="text-[10px] md:text-xs font-bold text-green-200">掠奪空軍</span>
                    <span class="text-sm md:text-lg font-black uppercase tracking-widest">派遣攻掠</span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Separated Chart Page -->
<div id="chart-page" class="fixed inset-0 z-40 bg-black flex flex-col hidden transition-all duration-300 transform translate-y-full">
    <div class="flex justify-between items-center p-4 border-b border-white/10 bg-gray-900">
        <h2 class="text-lg font-bold text-yellow-500 tracking-widest">軍師戰略室 獨立圖表</h2>
        <button onclick="closeChartPage()" class="bg-white/10 px-4 py-2 rounded-lg text-sm font-bold hover:bg-white/20">返回戰場</button>
    </div>
    <div class="flex-1 p-4 overflow-y-auto">
        <div class="glass rounded-2xl p-6 shadow-2xl flex flex-col gap-6 max-w-5xl mx-auto h-full border-blue-500/20">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div class="text-2xl font-black" id="chart-city-name">城池名稱</div>
                <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 scrollbar-hide">
                    <button onclick="setTimeframe('1m')" class="timeframe-btn active flex-shrink-0" id="tf-1m">一分</button>
                    <button onclick="setTimeframe('5m')" class="timeframe-btn flex-shrink-0" id="tf-5m">五分</button>
                    <button onclick="setTimeframe('15m')" class="timeframe-btn flex-shrink-0" id="tf-15m">十五分</button>
                    <button onclick="setTimeframe('30m')" class="timeframe-btn flex-shrink-0" id="tf-30m">三十分</button>
                    <button onclick="setTimeframe('1H')" class="timeframe-btn flex-shrink-0" id="tf-1H">一時</button>
                    <button onclick="setTimeframe('1D')" class="timeframe-btn flex-shrink-0" id="tf-1D">日</button>
                    <button onclick="setTimeframe('1W')" class="timeframe-btn flex-shrink-0" id="tf-1W">週</button>
                </div>
            </div>
            
            <div class="flex-1 min-h-[200px] flex items-end gap-[2px] px-1 border-b border-white/10 overflow-hidden relative">
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20 text-4xl font-black tracking-widest">量能趨勢圖</div>
                <div id="volume-bars" class="flex items-end gap-[4px] w-full h-full relative z-10"></div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-white/5 p-6 rounded-xl">
                <div class="flex flex-col"><span class="text-sm text-gray-500 font-bold uppercase tracking-widest mb-2">凱迪指標 K D</span>
                    <div class="flex items-baseline gap-6"><span id="kd-k" class="text-2xl font-mono font-bold text-blue-400">K --</span><span id="kd-d" class="text-2xl font-mono font-bold text-orange-400">D --</span></div>
                </div>
                <div class="flex flex-col"><span class="text-sm text-gray-500 font-bold uppercase tracking-widest mb-2">動能指標 麥克滴</span>
                    <div id="macd-val" class="text-3xl font-mono font-bold text-white">---</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- API Settings Modal -->
<div id="api-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="glass rounded-3xl p-6 md:p-8 max-w-md w-full mx-4 shadow-2xl border-white/20">
        <h2 class="text-xl md:text-2xl font-black text-center mb-4 tracking-widest">天道報價連線設定</h2>
        <p class="text-xs text-gray-400 mb-6 leading-relaxed">目前預設使用隱形代理爬蟲抓取真實股價。若您有專業報價金鑰，可在此輸入以獲得更穩定的專屬連線。</p>
        <div class="space-y-4">
            <input id="api-key-input" type="text" placeholder="留空則使用預設公開連線" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 text-white focus:border-yellow-500 outline-none font-mono text-sm">
            <div class="flex gap-4">
                <button onclick="closeApiSettings()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold text-sm transition-all">關閉</button>
                <button onclick="saveApiKey()" class="flex-1 bg-yellow-600 hover:bg-yellow-500 py-3 rounded-xl font-bold text-sm text-black transition-all">儲存設定</button>
            </div>
        </div>
    </div>
</div>

<!-- Custom Stock Manager Modal -->
<div id="custom-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="glass rounded-3xl p-6 md:p-8 max-w-md w-full mx-4 shadow-2xl border-yellow-500/20">
        <h2 class="text-xl md:text-2xl font-black text-center mb-6 tracking-widest">統帥自選城池管理</h2>
        <div class="space-y-4 mb-6">
            <input id="custom-symbol" type="text" placeholder="股票代號" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 text-white focus:border-yellow-500 outline-none font-mono text-sm uppercase">
            <input id="custom-name" type="text" placeholder="城池名稱" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 text-white focus:border-yellow-500 outline-none text-sm">
            <button onclick="addCustomStock()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold text-sm transition-all shadow-lg">新增至自選領域</button>
        </div>
        <div class="border-t border-white/10 pt-4">
            <h3 class="text-xs text-gray-500 font-bold mb-2">已編制自選清單</h3>
            <div id="custom-stock-list" class="space-y-2 max-h-40 overflow-y-auto"></div>
        </div>
        <button onclick="closeCustomManager()" class="mt-6 w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold text-sm transition-all">完成並返回</button>
    </div>
</div>

<!-- Daily Report Modal -->
<div id="report-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="modal-window" class="glass rounded-3xl p-6 md:p-8 max-w-2xl w-full mx-4 shadow-2xl border-yellow-500/20">
        <div id="modal-body"></div>
        <button onclick="closeModal()" class="mt-8 w-full bg-yellow-600 hover:bg-yellow-500 py-4 rounded-2xl font-black text-xl shadow-lg transition-all active:scale-95 text-black">班師回朝</button>
    </div>
</div>

<div id="msg-box" class="fixed bottom-32 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-full text-sm font-bold opacity-0 transition-all z-60 pointer-events-none text-center w-max max-w-[90vw]"></div>

<script>
// --- 核心變數與領域資料 ---
const TAX_RATE = 0.003;
const FEE_RATE = 0.001425;
const GENERALS = ["神將關雲長", "猛將張翼德", "智將諸葛孔明", "龍騎趙子龍", "錦馬超", "神射黃漢升"];

let USER_API_KEY = localStorage.getItem('abula_api_key') || '';
let apiPollingInterval = null;

const SECTORS = {
    "SEMICON": { name: "半導體 產業領域", cities: ["2330", "NVDA", "2454"] },
    "DIGITAL": { name: "數位生活 產業領域", cities: ["AAPL", "6758", "7974"] },
    "ENERGY": { name: "能源交通 產業領域", cities: ["TSLA", "7203", "2317"] },
    "CUSTOM": { name: "統帥自選 專屬領域", cities: [] }
};

const CITIES = {
    "2330": { name: "台積電", price: 825.0, basePrice: 825.0, bars: {} },
    "2317": { name: "鴻海", price: 180.0, basePrice: 180.0, bars: {} },
    "2454": { name: "聯發科", price: 1150.0, basePrice: 1150.0, bars: {} },
    "NVDA": { name: "輝達", price: 900.0, basePrice: 900.0, bars: {} },
    "AAPL": { name: "蘋果", price: 175.0, basePrice: 175.0, bars: {} },
    "TSLA": { name: "特斯拉", price: 160.0, basePrice: 160.0, bars: {} },
    "6758": { name: "索尼", price: 12500.0, basePrice: 12500.0, bars: {} },
    "7203": { name: "豐田", price: 3500.0, basePrice: 3500.0, bars: {} },
    "7974": { name: "任天堂", price: 7800.0, basePrice: 7800.0, bars: {} }
};

let gameState = {
    balance: 5000000, frozen: 0, taxTotal: 0, realizedPnl: 0,
    activeSector: "SEMICON", activeCity: "2330", timeframe: "1m",
    units: [], history: [], pending: [], currentTab: 'units'
};

function loadCustomStocks() {
    try {
        const saved = JSON.parse(localStorage.getItem('abula_custom_stocks') || '[]');
        saved.forEach(s => {
            if (!CITIES[s.symbol]) CITIES[s.symbol] = { name: s.name, price: 100.0, basePrice: 100.0, bars: {} };
            if (!SECTORS["CUSTOM"].cities.includes(s.symbol)) SECTORS["CUSTOM"].cities.push(s.symbol);
        });
    } catch(e) { console.error(e); }
}

// --- Three.js 戰場渲染 ---
let scene, camera, renderer, battleLine;
let redArmy = [], greenArmy = [];
let currentPrice = 0;

function init3D() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020202, 0.015);
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.domElement.style.position = 'absolute';
    renderer.domElement.style.top = '0';
    renderer.domElement.style.left = '0';
    renderer.domElement.style.zIndex = '0';
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x444444, 2));
    const d = new THREE.DirectionalLight(0xffffff, 2);
    d.position.set(0, 50, 0); scene.add(d);

    const grid = new THREE.GridHelper(300, 100, 0x151515, 0x0a0a0a);
    scene.add(grid);

    battleLine = new THREE.Mesh(new THREE.BoxGeometry(1, 0.4, 50), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 }));
    scene.add(battleLine);

    camera.position.set(0, 40, 60); camera.lookAt(0, 0, 0);

    const castle = new THREE.Mesh(new THREE.BoxGeometry(10, 20, 80), new THREE.MeshStandardMaterial({ color: 0x333333 }));
    castle.position.set(-65, 10, 0); scene.add(castle);
    const forest = new THREE.Mesh(new THREE.CylinderGeometry(15, 15, 80, 8), new THREE.MeshStandardMaterial({ color: 0x052205 }));
    forest.rotation.z = Math.PI/2; forest.position.set(65, -5, 0); scene.add(forest);

    spawnInitialTroops();
    window.addEventListener('resize', onWindowResize, false);
    animate();
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function spawnInitialTroops() {
    const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    for(let i=0; i<30; i++){
        const r = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xef4444 }));
        r.position.set(-25 - Math.random()*10, 0.75, (Math.random()-0.5)*40);
        redArmy.push(r); scene.add(r);
        const g = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x22c55e }));
        g.position.set(25 + Math.random()*10, 0.75, (Math.random()-0.5)*40);
        greenArmy.push(g); scene.add(g);
    }
}

function updateVisuals() {
    const city = CITIES[gameState.activeCity];
    if(!city) return;
    const diff = city.basePrice > 0 ? (city.price - city.basePrice) / city.basePrice : 0;
    const drift = diff * 450;
    battleLine.position.x = drift;
    battleLine.material.color.setHex(diff >= 0 ? 0xef4444 : 0x22c55e);

    redArmy.forEach((m, i) => {
        const s = diff >= 0 ? 1 + Math.abs(diff)*25 : 1;
        m.scale.set(s,s,s); m.position.y = (0.75*s);
        const tx = Math.min(drift - (2*s), -10 + (diff >= 0 ? Math.abs(diff)*180 : 0));
        m.position.x += (tx - m.position.x) * 0.1;
    });
    greenArmy.forEach((m, i) => {
        const s = diff < 0 ? 1 + Math.abs(diff)*25 : 1;
        m.scale.set(s,s,s); m.position.y = (0.75*s);
        const tx = Math.max(drift + (2*s), 10 - (diff < 0 ? Math.abs(diff)*180 : 0));
        m.position.x += (tx - m.position.x) * 0.1;
    });
}

// --- 真實報價引擎與配息邏輯 ---

function getYahooSymbol(sym) {
    if (/^\d{4}$/.test(sym)) return sym + '.TW'; 
    if (["6758", "7203", "7974"].includes(sym)) return sym + '.T'; 
    return sym; 
}

async function fetchRealMarketData() {
    const cityCode = gameState.activeCity;
    const city = CITIES[cityCode];
    if (!city) return;

    let fetchedPrice = null;
    let fetchedBase = null;

    try {
        if (USER_API_KEY) {
            const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${cityCode}&token=${USER_API_KEY}`);
            if (res.ok) {
                const data = await res.json();
                if(data.c) { fetchedPrice = data.c; fetchedBase = data.pc; }
            }
        }
        if (!fetchedPrice) {
            const ySym = getYahooSymbol(cityCode);
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ySym}`;
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
            const res = await fetch(proxyUrl);
            if (res.ok) {
                const data = await res.json();
                const meta = data.chart.result[0].meta;
                fetchedPrice = meta.regularMarketPrice;
                fetchedBase = meta.previousClose || city.basePrice;
            }
        }

        if (fetchedPrice && fetchedPrice > 0) {
            city.price = fetchedPrice;
            city.basePrice = fetchedBase || fetchedPrice;
            currentPrice = city.price;
            
            if(!city.bars[gameState.timeframe]) initKbars(city);
            const bars = city.bars[gameState.timeframe];
            bars.push({ p: fetchedPrice, v: 100 + Math.random()*900 });
            if(bars.length > 100) bars.shift();

            document.getElementById('market-price').innerText = fetchedPrice.toFixed(2);
        } else {
            document.getElementById('market-price').innerText = "休市或延遲";
        }
    } catch(e) {
        document.getElementById('market-price').innerText = city.price.toFixed(2);
    }
}

function initKbars(city) {
    city.bars = { "1m": [], "5m": [], "15m": [], "30m": [], "1H": [], "1D": [], "1W": [] };
    let tempPrice = city.basePrice;
    for(let i=0; i<100; i++){
        tempPrice += (Math.random()-0.5) * (city.basePrice * 0.01);
        if(tempPrice <= 0.1) tempPrice = 0.1;
        const bar = { p: tempPrice, v: 100 + Math.random()*900 };
        Object.keys(city.bars).forEach(tf => city.bars[tf].push(bar));
    }
}

function startMarketPolling() {
    if (apiPollingInterval) clearInterval(apiPollingInterval);
    apiPollingInterval = setInterval(fetchRealMarketData, 5000);
    fetchRealMarketData();
}

function triggerHeavenlyRain(unit) {
    const gen = GENERALS[Math.floor(Math.random() * GENERALS.length)];
    const bonus = 0.5;
    const oldQty = unit.qty;
    unit.qty += bonus;
    // 股價不變的情況下，因為總兵力變多，平均成本被攤低
    unit.cost = (unit.cost * oldQty) / unit.qty; 
    
    // 金色神雷特效
    const o = document.getElementById('thunder-overlay');
    o.classList.add('gold-thunder-flash');
    setTimeout(()=>o.classList.remove('gold-thunder-flash'), 800);
    
    showMsg(`天降甘霖 大將 ${gen} 參戰 賜予 零點五 營兵力`);
    updateUI();
}

function localTick() {
    checkPendingOrders();
    
    // 大將參戰機制 (配股配息) 偵測
    gameState.units.forEach(u => {
        u.holdTicks++;
        // 模擬：每駐紮 60 秒觸發一次大將賜軍
        if (u.holdTicks % 60 === 0) {
            triggerHeavenlyRain(u);
        }
    });

    updateVisuals();
    if(document.getElementById('chart-page').classList.contains('hidden') === false) {
        updateCharts();
    }
    updateUI();
}

// --- 介面控制邏輯 ---

function switchSector(code) {
    gameState.activeSector = code;
    const sel = document.getElementById('city-selector');
    sel.innerHTML = '';
    
    if (SECTORS[code].cities.length === 0) {
        const opt = document.createElement('option');
        opt.value = ""; opt.innerText = "尚無自選城池";
        sel.appendChild(opt);
        currentPrice = 0;
        document.getElementById('market-price').innerText = "---";
        return;
    }

    SECTORS[code].cities.forEach(c => {
        const opt = document.createElement('option'); opt.value = c; opt.innerText = CITIES[c]?.name || c;
        sel.appendChild(opt);
    });
    switchCity(SECTORS[code].cities[0]);
}

function switchCity(code) {
    if (!code || !CITIES[code]) return;
    gameState.activeCity = code;
    if (!CITIES[code].bars || Object.keys(CITIES[code].bars).length === 0) initKbars(CITIES[code]);
    currentPrice = CITIES[code].price;
    document.getElementById('chart-city-name').innerText = CITIES[code].name;
    document.getElementById('market-price').innerText = "讀取中";
    showMsg(`軍令轉移 至 ${CITIES[code].name}`);
    fetchRealMarketData();
}

// --- 圖表與頁面切換 ---

function openChartPage() {
    document.getElementById('main-ui').classList.add('hidden');
    const page = document.getElementById('chart-page');
    page.classList.remove('hidden');
    setTimeout(() => {
        page.classList.remove('translate-y-full');
        document.getElementById('chart-city-name').innerText = CITIES[gameState.activeCity]?.name || "未知城池";
        updateCharts();
    }, 10);
}

function closeChartPage() {
    const page = document.getElementById('chart-page');
    page.classList.add('translate-y-full');
    setTimeout(() => {
        page.classList.add('hidden');
        document.getElementById('main-ui').classList.remove('hidden');
    }, 300);
}

function setTimeframe(tf) {
    gameState.timeframe = tf;
    document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll(`#tf-${tf}`).forEach(b => b.classList.add('active'));
    showMsg(`戰略切換至 ${tf}`);
    if(document.getElementById('chart-page').classList.contains('hidden') === false) {
        updateCharts();
    }
}

function updateCharts() {
    const city = CITIES[gameState.activeCity];
    if(!city || !city.bars) return;
    const bars = city.bars[gameState.timeframe] || [];
    if(bars.length < 9) return;

    const recentPrices = bars.slice(-9).map(b => b.p);
    const low = Math.min(...recentPrices), high = Math.max(...recentPrices);
    const rsv = high === low ? 50 : ((currentPrice - low)/(high - low))*100;
    const k = 50 * (2/3) + rsv * (1/3), d = 50 * (2/3) + k * (1/3);
    document.getElementById('kd-k').innerText = `K ${k.toFixed(1)}`;
    document.getElementById('kd-d').innerText = `D ${d.toFixed(1)}`;
    
    const macd = (currentPrice * 0.03); 
    const macdEl = document.getElementById('macd-val');
    macdEl.innerText = macd.toFixed(2);
    macdEl.className = `text-3xl font-mono font-bold ${macd >= 0 ? 'text-red-400' : 'text-green-400'}`;

    const vC = document.getElementById('volume-bars'); vC.innerHTML = '';
    const maxV = Math.max(...bars.map(b => b.v), 1);
    const displayCount = window.innerWidth < 768 ? 40 : 80;
    bars.slice(-displayCount).forEach(b => {
        const vB = document.createElement('div'); 
        vB.className = 'flex-1 bg-blue-500/60 rounded-t min-w-[2px] transition-all duration-300';
        vB.style.height = `${Math.max((b.v/maxV)*100, 5)}%`; 
        vC.appendChild(vB);
    });
}

// --- 交易邏輯 ---

function issueOrder(side) {
    const qtyStr = String(document.getElementById('order-qty').value).trim();
    const priceStr = String(document.getElementById('order-price').value).trim();
    
    const qty = parseInt(qtyStr) || 0;
    const tPrice = parseFloat(priceStr) || currentPrice;
    
    if(qty <= 0) return;
    if(!gameState.activeCity) return;

    const pos = gameState.units.find(u => u.city === gameState.activeCity);
    if(pos && pos.side !== side){ showMsg("立場衝突 請先結算目前兵力"); triggerThunder(); return; }

    const vol = tPrice * qty * 1000;
    const tax = vol * TAX_RATE, fee = vol * FEE_RATE, total = vol + tax + fee;
    if(gameState.balance < total){ showMsg("存銀不足 無法派遣"); triggerThunder(); return; }

    // 最嚴謹的多空撮合邏輯
    let immediate = false;
    if(side === 'LONG' && tPrice >= currentPrice) immediate = true;
    if(side === 'SHORT' && tPrice <= currentPrice) immediate = true;

    if(immediate){
        gameState.balance -= total;
        // 以實際當下市價成交
        executeOrder({ city: gameState.activeCity, side, qty, tax, fee }, currentPrice);
        showMsg("市價滿足 立即出征");
    } else {
        gameState.balance -= total; gameState.frozen += total;
        gameState.pending.push({ id: Date.now(), city: gameState.activeCity, side, qty, price: tPrice, total, tax, fee });
        showMsg("進入埋伏 等候滿足價位");
    }
    updateUI();
}

function checkPendingOrders() {
    for(let i=gameState.pending.length-1; i>=0; i--){
        const o = gameState.pending[i];
        const m = CITIES[o.city]?.price;
        if (!m) continue;
        
        let canFill = false;
        if(o.side === 'LONG' && m <= o.price) canFill = true;
        if(o.side === 'SHORT' && m >= o.price) canFill = true;

        if(canFill){
            gameState.pending.splice(i,1); executeOrder(o, m);
            showMsg(`天道撮合 ${CITIES[o.city].name} 入城`);
        }
    }
}

function executeOrder(o, fP) {
    if(o.total) gameState.frozen -= o.total;
    const vol = fP * o.qty * 1000;
    const aTax = vol * TAX_RATE, aFee = vol * FEE_RATE;
    gameState.taxTotal += (aTax + aFee);
    gameState.units.push({
        id: Date.now() + Math.random(), city: o.city, side: o.side, qty: o.qty,
        cost: (vol + aTax + aFee) / (o.qty * 1000),
        entry: fP, tax: aTax, fee: aFee,
        time: new Date().toLocaleTimeString('zh-TW', { hour12: false }),
        holdTicks: 0 // 新增持久戰計時器
    });
}

function settle(id) {
    const idx = gameState.units.findIndex(u => u.id === id);
    if (idx === -1) return;
    const u = gameState.units[idx];
    const city = CITIES[u.city];
    const vol = city.price * u.qty * 1000;
    const tax = vol * TAX_RATE, fee = vol * FEE_RATE;
    const pnl = u.side === 'LONG' ? (city.price - u.cost)*u.qty*1000 : (u.cost - city.price)*u.qty*1000;
    
    gameState.balance += (vol - tax - fee); 
    gameState.taxTotal += (tax + fee); 
    gameState.realizedPnl += pnl;
    
    const rep = { ...u, exit: city.price, eTax: tax, eFee: fee, pnl };
    gameState.history.unshift(rep); 
    gameState.units.splice(idx,1);
    
    showWarReport(rep); 
    updateUI();
}

// --- 設定與管理介面 ---

function openApiSettings() {
    const m = document.getElementById('api-modal');
    document.getElementById('api-key-input').value = USER_API_KEY;
    m.classList.remove('opacity-0', 'pointer-events-none');
}
function closeApiSettings() { document.getElementById('api-modal').classList.add('opacity-0', 'pointer-events-none'); }

function saveApiKey() {
    const raw = String(document.getElementById('api-key-input').value).trim();
    const cleanKey = raw.replace(/[^a-zA-Z0-9_\-]/g, ''); 
    USER_API_KEY = cleanKey;
    localStorage.setItem('abula_api_key', cleanKey);
    closeApiSettings();
    showMsg("設定已儲存");
    fetchRealMarketData();
}

function openCustomManager() {
    document.getElementById('custom-modal').classList.remove('opacity-0', 'pointer-events-none');
    renderCustomList();
}
function closeCustomManager() {
    document.getElementById('custom-modal').classList.add('opacity-0', 'pointer-events-none');
    if(gameState.activeSector === 'CUSTOM') switchSector('CUSTOM');
}

function addCustomStock() {
    const rawSym = String(document.getElementById('custom-symbol').value).trim().toUpperCase();
    const rawName = String(document.getElementById('custom-name').value).trim();
    const cleanSym = rawSym.replace(/[^A-Z0-9\.]/g, '');
    const cleanName = rawName.replace(/[<>]/g, '');

    if (!cleanSym || !cleanName) { showMsg("請輸入有效的代號與名稱"); return; }
    if (!CITIES[cleanSym]) CITIES[cleanSym] = { name: cleanName, price: 100.0, basePrice: 100.0, bars: {} };
    else CITIES[cleanSym].name = cleanName;

    if (!SECTORS["CUSTOM"].cities.includes(cleanSym)) SECTORS["CUSTOM"].cities.push(cleanSym);

    const toSave = SECTORS["CUSTOM"].cities.map(sym => ({ symbol: sym, name: CITIES[sym].name }));
    localStorage.setItem('abula_custom_stocks', JSON.stringify(toSave));

    document.getElementById('custom-symbol').value = ''; document.getElementById('custom-name').value = '';
    showMsg(`已編列 ${cleanName} 進入自選`);
    renderCustomList();
}

function removeCustomStock(sym) {
    const idx = SECTORS["CUSTOM"].cities.indexOf(sym);
    if (idx > -1) {
        SECTORS["CUSTOM"].cities.splice(idx, 1);
        const toSave = SECTORS["CUSTOM"].cities.map(s => ({ symbol: s, name: CITIES[s].name }));
        localStorage.setItem('abula_custom_stocks', JSON.stringify(toSave));
        showMsg(`已將 ${sym} 移出自選清單`);
        renderCustomList();
    }
}

function renderCustomList() {
    const list = document.getElementById('custom-stock-list');
    list.innerHTML = '';
    SECTORS["CUSTOM"].cities.forEach(sym => {
        const div = document.createElement('div');
        div.className = "flex justify-between items-center bg-white/5 p-2 rounded";
        div.innerHTML = `
            <div class="flex flex-col"><span class="text-xs font-bold text-yellow-500">${sym}</span><span class="text-[10px] text-gray-400">${CITIES[sym].name}</span></div>
            <button onclick="removeCustomStock('${sym}')" class="text-[10px] bg-red-900/50 hover:bg-red-800 px-2 py-1 rounded text-red-200">移除</button>
        `;
        list.appendChild(div);
    });
}

// --- 報表與分頁 ---

function switchTab(t) {
    gameState.currentTab = t;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${t}`).classList.add('active');
    ['units','history','pending'].forEach(x => {
        const el = document.getElementById(`tab-content-${x}`);
        if(el) el.classList.add('hidden');
    });
    const content = document.getElementById(`tab-content-${t}`);
    if(content) content.classList.remove('hidden');
    renderLists();
}

function showWarReport(d) {
    const body = document.getElementById('modal-body');
    const color = d.pnl >= 0 ? 'result-positive' : 'result-negative';
    body.innerHTML = `
        <h2 class="text-2xl md:text-3xl font-black text-center mb-6 tracking-widest uppercase">單一戰役 結算紀實</h2>
        <div class="grid grid-cols-2 gap-4 text-sm font-bold">
            <div class="flex flex-col"><span class="text-[9px] text-gray-500">征戰地</span><span>${CITIES[d.city].name}</span></div>
            <div class="flex flex-col text-right"><span class="text-[9px] text-gray-500">立場</span><span>${d.side==='LONG'?'護國多軍':'掠奪空軍'}</span></div>
            <div class="border-t border-white/10 pt-2 flex flex-col"><span class="text-[9px] text-gray-500">入場均價</span><span>${d.entry.toFixed(1)}</span></div>
            <div class="border-t border-white/10 pt-2 flex flex-col text-right"><span class="text-[9px] text-gray-500">結算價位</span><span>${d.exit.toFixed(1)}</span></div>
        </div>
        <div class="mt-6 p-4 md:p-6 bg-white/5 rounded-2xl text-center">
            <div class="text-[9px] text-gray-400 uppercase font-black">本次戰果</div>
            <div class="text-3xl md:text-4xl font-black ${color}">${d.pnl>=0?'加':'減'} ${Math.abs(Math.floor(d.pnl)).toLocaleString()}</div>
        </div>`;
    document.getElementById('report-modal').classList.remove('opacity-0','pointer-events-none');
}

function showDailySummary() {
    const body = document.getElementById('modal-body');
    const wins = gameState.history.filter(h => h.pnl > 0).length;
    const rate = gameState.history.length === 0 ? 0 : (wins / gameState.history.length * 100);
    body.innerHTML = `
        <h2 class="text-2xl md:text-3xl font-black text-center mb-6 tracking-widest uppercase">今日總結大表</h2>
        <div class="space-y-4">
            <div class="flex justify-between border-b border-white/10 pb-2"><span>累計派遣</span><span>${gameState.history.length + gameState.units.length} 次</span></div>
            <div class="flex justify-between border-b border-white/10 pb-2"><span>平均勝率</span><span class="text-yellow-500">${rate.toFixed(1)} 百分比</span></div>
            <div class="flex justify-between border-b border-white/10 pb-2"><span>已實現戰果</span><span class="${gameState.realizedPnl>=0?'result-positive':'result-negative'}">${Math.floor(gameState.realizedPnl).toLocaleString()}</span></div>
            <div class="flex justify-between border-b border-white/10 pb-2"><span>上繳天賦</span><span class="text-purple-400">${Math.floor(gameState.taxTotal).toLocaleString()}</span></div>
        </div>`;
    document.getElementById('report-modal').classList.remove('opacity-0','pointer-events-none');
}

function closeModal() { document.getElementById('report-modal').classList.add('opacity-0','pointer-events-none'); }

function updateUI() {
    const city = CITIES[gameState.activeCity];
    if(!city) return;
    document.getElementById('user-balance').innerText = Math.floor(gameState.balance).toLocaleString();
    document.getElementById('frozen-balance').innerText = `天道凍結 待命軍費 ${Math.floor(gameState.frozen).toLocaleString()}`;
    document.getElementById('total-tax-display').innerText = Math.floor(gameState.taxTotal).toLocaleString();
    document.getElementById('market-price').innerText = currentPrice.toFixed(2);
    document.getElementById('base-price-display').innerText = city.basePrice.toFixed(2);
    
    const pct = ((currentPrice - city.basePrice)/city.basePrice*100).toFixed(2);
    const elPct = document.getElementById('price-change');
    elPct.innerText = `${pct >= 0 ? '正' : '負'} ${Math.abs(pct)} 百分比`;
    elPct.className = `text-[10px] md:text-xs font-bold ${pct >= 0 ? 'text-red-500' : 'text-green-500'}`;

    let unreal = 0;
    gameState.units.forEach(u => { 
        const c = CITIES[u.city];
        if (c) unreal += (u.side==='LONG' ? (c.price - u.cost) : (u.cost - c.price)) * u.qty * 1000; 
    });
    const tot = gameState.realizedPnl + unreal;
    const elTot = document.getElementById('today-total-result');
    elTot.innerText = `${tot >= 0 ? '加' : '減'} ${Math.abs(Math.floor(tot)).toLocaleString()}`;
    elTot.className = `text-base md:text-lg font-black ${tot >= 0 ? 'result-positive' : 'result-negative'}`;

    renderLists();
}

function renderLists() {
    const cont = document.getElementById(`tab-content-${gameState.currentTab}`);
    if(!cont) return; 
    cont.innerHTML = '';
    
    if(gameState.currentTab === 'units'){
        if(gameState.units.length === 0) cont.innerHTML = '<div class="text-[10px] text-gray-600 text-center py-4">目前無駐紮部隊</div>';
        gameState.units.forEach(u => {
            const m = CITIES[u.city]?.price || u.entry;
            const p = (u.side==='LONG' ? (m-u.cost) : (u.cost-m))*u.qty*1000;
            // UI 呈現小數點第一位的規模 (例如: 2.5 營)
            cont.innerHTML += `<div class="glass rounded-xl p-2 md:p-3 border-r-4 ${p>=0?'border-red-500':'border-green-500'} text-right mb-2">
                <button onclick="settle(${u.id})" class="float-left text-[9px] bg-white/10 px-2 py-1 rounded">結算撤軍</button>
                <div class="text-[10px] text-gray-500">${CITIES[u.city]?.name || u.city} ${u.side==='LONG'?'多':'空'} ${u.qty.toFixed(1)} 營</div>
                <div class="text-xs font-bold ${p>=0?'text-red-500':'text-green-500'}">戰功 ${Math.floor(p).toLocaleString()}</div>
            </div>`;
        });
    } else if(gameState.currentTab === 'history'){
        if(gameState.history.length === 0) cont.innerHTML = '<div class="text-[10px] text-gray-600 text-center py-4">尚無作戰紀錄</div>';
        gameState.history.slice(0, 15).forEach(h => {
            cont.innerHTML += `<div class="bg-white/5 rounded-lg p-2 border-r-2 border-gray-600 text-right text-[10px] opacity-70 mb-2">
                <span>${h.time} | ${CITIES[h.city]?.name || h.city} 戰果 ${Math.floor(h.pnl).toLocaleString()}</span>
            </div>`;
        });
    } else if(gameState.currentTab === 'pending'){
        if(gameState.pending.length === 0) cont.innerHTML = '<div class="text-[10px] text-gray-600 text-center py-4">無待命軍令</div>';
        gameState.pending.forEach(o => {
            cont.innerHTML += `<div class="glass rounded-xl p-2 border-r-4 border-gray-600 text-right mb-2 flex justify-between items-center">
                <button onclick="cancelOrder(${o.id})" class="text-[9px] text-gray-500 hover:text-red-400">撤回</button>
                <div class="text-[10px] text-gray-400">${CITIES[o.city]?.name || o.city} 待命 ${o.price}</div>
            </div>`;
        });
    }
}

function cancelOrder(id) {
    const idx = gameState.pending.findIndex(o => o.id === id);
    if (idx === -1) return;
    const o = gameState.pending[idx];
    gameState.balance += o.totalCost || o.total;
    gameState.frozen -= o.totalCost || o.total;
    gameState.pending.splice(idx, 1);
    showMsg("撤回軍令 資金歸庫");
    updateUI();
}

function triggerThunder() { const o = document.getElementById('thunder-overlay'); o.classList.remove('thunder-flash','gold-thunder-flash'); void o.offsetWidth; o.classList.add('thunder-flash'); setTimeout(()=>o.classList.remove('thunder-flash'), 500); }
function showMsg(t) { const el = document.getElementById('msg-box'); el.innerText = t; el.style.opacity = '1'; el.style.transform = 'translateX(-50%) translateY(-10px)'; setTimeout(()=>{el.style.opacity='0'; el.style.transform='translateX(-50%) translateY(0)';}, 3000); }
function animate() { requestAnimationFrame(animate); TWEEN.update(); renderer.render(scene, camera); }

window.onload = () => { 
    init3D(); 
    loadCustomStocks();
    switchSector("SEMICON"); 
    
    startMarketPolling(); 
    setInterval(localTick, 1000);
};
