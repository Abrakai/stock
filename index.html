<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>三界戰場 傭兵統帥傳奇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #02050a; font-family: 'Noto Sans TC', sans-serif; color: white; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; }
        
        .glass { background: rgba(10, 15, 25, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .glass-sim { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.3); box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); }
        
        .ui-overlay { pointer-events: none; display: flex; flex-direction: column; height: 100vh; }
        .ui-overlay > * { pointer-events: auto; }
        
        .tab-btn { font-size: 12px; padding: 6px 12px; border-bottom: 2px solid transparent; transition: all 0.3s; color: #888; font-weight: bold; white-space: nowrap; flex: 1; text-align: center; cursor: pointer; }
        .tab-btn.active { color: #eab308; border-color: #eab308; text-shadow: 0 0 10px rgba(234,179,8,0.5); }
        
        @keyframes thunder { 0% { background: rgba(255, 255, 255, 0); } 10% { background: rgba(255, 255, 255, 0.3); } 20% { background: rgba(255, 255, 255, 0); } 100% { background: rgba(255, 255, 255, 0); } }
        @keyframes goldThunder { 0% { background: rgba(234, 179, 8, 0); } 10% { background: rgba(234, 179, 8, 0.4); } 20% { background: rgba(234, 179, 8, 0); } 100% { background: rgba(234, 179, 8, 0); } }
        @keyframes simThunder { 0% { background: rgba(56, 189, 248, 0); } 10% { background: rgba(56, 189, 248, 0.4); } 20% { background: rgba(56, 189, 248, 0); } 100% { background: rgba(56, 189, 248, 0); } }
        
        .thunder-flash { animation: thunder 0.5s ease-out; }
        .gold-thunder-flash { animation: goldThunder 0.8s ease-out; }
        .sim-thunder-flash { animation: simThunder 0.8s ease-out; }
        
        .result-positive { color: #ef4444; text-shadow: 0 0 8px rgba(239,68,68,0.4); }
        .result-negative { color: #22c55e; text-shadow: 0 0 8px rgba(34,197,94,0.4); }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .timeframe-btn { font-size: 11px; padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.2s; cursor: pointer; }
        .timeframe-btn.active { background: #eab308; color: black; border-color: #eab308; font-weight: 900; }
        
        input[type=number] { background: rgba(0,0,0,0.4); box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); transition: all 0.3s; }
        input[type=number]:focus { background: rgba(255,255,255,0.1); box-shadow: 0 0 10px rgba(234,179,8,0.3), inset 0 2px 4px rgba(0,0,0,0.5); }

        .btn-disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(100%); pointer-events: none; }
    </style>
</head>
<body>

<div id="thunder-overlay" class="fixed inset-0 pointer-events-none z-50 transition-colors duration-500"></div>

<!-- 全新手機優先 UI 佈局 -->
<div id="main-ui" class="fixed inset-0 ui-overlay z-10 transition-all duration-500">
    
    <!-- 頂部：資訊與控制區 -->
    <div class="w-full flex-none p-2 md:p-4 flex flex-col md:flex-row gap-2 justify-between items-start">
        <div id="main-dashboard" class="glass rounded-xl p-3 w-full md:w-[26rem] shadow-lg transition-all duration-500">
            <div class="flex justify-between items-center mb-2">
                <span id="market-status-label" class="text-[10px] md:text-xs text-yellow-400 font-bold uppercase tracking-widest bg-yellow-500/20 px-2 py-1 rounded border border-yellow-500/30">判讀時區中</span>
                <div class="flex gap-1.5">
                    <button onclick="toggleSimMode()" id="sim-btn" class="hidden bg-sky-600 hover:bg-sky-500 px-2.5 py-1.5 rounded text-[10px] text-white font-bold tracking-widest shadow-[0_0_10px_rgba(2,132,199,0.5)] transition-all">啟動沙盤</button>
                    <button onclick="openChartPage()" class="bg-white/10 hover:bg-white/20 border border-white/20 px-2.5 py-1.5 rounded text-[10px] text-white font-bold tracking-widest transition-all">軍師圖表</button>
                    <button onclick="showDailySummary()" class="bg-purple-900/50 hover:bg-purple-800 border border-purple-500/40 px-2.5 py-1.5 rounded text-[10px] text-purple-200 font-bold tracking-widest transition-all">結算大表</button>
                </div>
            </div>
            
            <div class="flex justify-between items-end mt-2">
                <div>
                    <div class="text-[10px] text-gray-400 mb-0.5 tracking-wider">人界存銀 天幣</div>
                    <div id="user-balance" class="text-2xl md:text-3xl font-mono font-black text-white">讀取中</div>
                    <div id="frozen-balance" class="text-[9px] text-gray-500 mt-0.5">凍結 0</div>
                </div>
                <div id="real-pnl-container" class="flex flex-col items-end">
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">已實現戰果</span>
                    <div id="today-total-result" class="text-xl md:text-2xl font-black font-mono">加 0</div>
                </div>
                <div id="sim-pnl-container" class="hidden flex flex-col items-end">
                    <span class="text-[10px] text-sky-400 font-bold uppercase animate-pulse mb-0.5">沙盤累積戰果</span>
                    <div id="sim-total-result" class="text-xl md:text-2xl font-black font-mono text-sky-400 drop-shadow-[0_0_5px_rgba(56,189,248,0.5)]">加 0</div>
                </div>
            </div>
            
            <div class="mt-3 pt-3 border-t border-white/10 flex gap-2 items-center">
                <select id="sector-selector" onchange="switchSector(this.value)" class="bg-black/50 border border-white/20 rounded-lg px-2 py-1.5 text-[10px] md:text-xs font-bold text-gray-200 focus:outline-none w-24 md:w-auto truncate cursor-pointer">
                    <option value="SEMICON">半導體</option>
                    <option value="COMPUTER">電腦週邊</option>
                    <option value="NETWORK">通信</option>
                    <option value="CUSTOM">自選</option>
                </select>
                <select id="city-selector" onchange="switchCity(this.value)" class="flex-1 bg-black/50 border border-white/20 rounded-lg px-2 py-1.5 text-[11px] md:text-sm font-bold text-white focus:outline-none truncate cursor-pointer"></select>
                <button onclick="openCustomManager()" class="bg-white/10 hover:bg-white/20 p-1.5 rounded-lg text-white font-bold text-[10px]">⚙️ 管理</button>
            </div>
            
            <div class="flex justify-between items-center bg-black/40 p-2.5 rounded-lg mt-3 border border-white/10 shadow-inner">
                <div class="flex items-baseline gap-2">
                    <span id="market-price" class="text-2xl md:text-3xl font-mono font-black text-white">連線中</span>
                    <span id="price-change" class="text-[10px] md:text-[11px] font-bold text-gray-400">0.00 %</span>
                </div>
                <div class="text-right flex flex-col items-end">
                    <span id="base-price-label" class="text-[9px] text-gray-500 uppercase font-bold tracking-widest mb-0.5">昨收</span>
                    <span id="base-price-display" class="text-sm md:text-base font-mono font-bold text-gray-300">---</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 中央戰區 (不可遮擋，佔據剩餘空間) -->
    <div class="flex-1 min-h-[25vh] w-full pointer-events-none"></div>

    <!-- 底部：軍令操作與報表區 -->
    <div class="w-full flex-none p-2 md:p-4 flex flex-col md:flex-row gap-2 max-h-[55vh]">
        
        <!-- 左/上：部隊與掛單列表 -->
        <div class="glass rounded-xl flex flex-col w-full md:w-96 flex-1 md:flex-none h-full max-h-[28vh] md:max-h-[35vh]">
            <div class="flex border-b border-white/10">
                <button onclick="switchTab('units')" id="tab-units" class="tab-btn active">未平倉部隊</button>
                <button onclick="switchTab('history')" id="tab-history" class="tab-btn">歷史戰紀</button>
                <button onclick="switchTab('pending')" id="tab-pending" class="tab-btn">待命軍令</button>
            </div>
            <div id="tab-container" class="p-2 flex-1 overflow-y-auto scrollbar-hide">
                <div id="tab-content-units" class="space-y-2"></div>
                <div id="tab-content-history" class="space-y-2 hidden"></div>
                <div id="tab-content-pending" class="space-y-2 hidden"></div>
            </div>
        </div>

        <!-- 右/下：下單面板 -->
        <div id="order-panel" class="glass rounded-xl p-3 md:p-4 flex flex-col w-full md:flex-1 justify-center gap-3">
            <div class="flex gap-3">
                <div class="flex flex-col flex-1">
                    <span class="text-[10px] text-gray-400 font-bold uppercase mb-1 ml-1 tracking-widest">派遣營數</span>
                    <input id="order-qty" type="number" value="1" min="1" class="border border-white/20 rounded-lg px-3 py-2 text-lg md:text-xl font-bold outline-none text-center text-white font-mono w-full">
                </div>
                <div class="flex flex-col flex-1">
                    <span class="text-[10px] text-gray-400 font-bold uppercase mb-1 ml-1 tracking-widest">進場委託價</span>
                    <input id="order-price" type="number" step="0.5" placeholder="市價" class="border border-white/20 rounded-lg px-3 py-2 text-lg md:text-xl font-bold outline-none text-center text-white font-mono w-full">
                </div>
            </div>
            <div class="flex gap-3 mt-1">
                <button id="btn-long" onclick="issueOrder('LONG')" class="flex-1 bg-gradient-to-b from-red-600 to-red-800 hover:from-red-500 hover:to-red-700 active:scale-95 transition-all rounded-xl py-3 md:py-4 flex flex-col items-center justify-center border-b-2 border-red-900 shadow-lg cursor-pointer">
                    <span class="text-[10px] font-bold text-red-200 tracking-widest mb-0.5">護國多軍</span>
                    <span id="btn-long-text" class="text-base md:text-xl font-black uppercase tracking-widest text-white drop-shadow-md">入城</span>
                </button>
                <button id="btn-short" onclick="issueOrder('SHORT')" class="flex-1 bg-gradient-to-b from-green-600 to-green-800 hover:from-green-500 hover:to-green-700 active:scale-95 transition-all rounded-xl py-3 md:py-4 flex flex-col items-center justify-center border-b-2 border-green-900 shadow-lg cursor-pointer">
                    <span class="text-[10px] font-bold text-green-200 tracking-widest mb-0.5">掠奪空軍</span>
                    <span id="btn-short-text" class="text-base md:text-xl font-black uppercase tracking-widest text-white drop-shadow-md">攻掠</span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 獨立的軍師戰略圖表頁面 -->
<div id="chart-page" class="fixed inset-0 z-40 bg-[#02050a] flex flex-col hidden transition-all duration-300 transform translate-y-full">
    <div class="flex justify-between items-center p-4 border-b border-white/10 bg-gray-900/80 backdrop-blur-md">
        <div class="flex items-center gap-2">
            <div class="w-1 h-5 bg-yellow-500 rounded-full"></div>
            <h2 class="text-lg font-black text-white tracking-widest">軍師圖表分析</h2>
        </div>
        <button onclick="closeChartPage()" class="bg-white/10 border border-white/20 px-4 py-1.5 rounded-lg text-xs font-bold hover:bg-white/20 transition-all cursor-pointer">返回戰場</button>
    </div>
    <div class="flex-1 p-3 overflow-y-auto">
        <div class="glass rounded-2xl p-4 md:p-6 shadow-xl flex flex-col gap-4 max-w-5xl mx-auto h-full relative">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 relative z-10">
                <div class="text-2xl font-black tracking-wider text-yellow-400 drop-shadow-md" id="chart-city-name">城池名稱</div>
                <div class="flex gap-1 overflow-x-auto w-full md:w-auto pb-1 scrollbar-hide">
                    <button onclick="setTimeframe('1m')" class="timeframe-btn active flex-shrink-0" id="tf-1m">一分</button>
                    <button onclick="setTimeframe('5m')" class="timeframe-btn flex-shrink-0" id="tf-5m">五分</button>
                    <button onclick="setTimeframe('15m')" class="timeframe-btn flex-shrink-0" id="tf-15m">十五分</button>
                    <button onclick="setTimeframe('30m')" class="timeframe-btn flex-shrink-0" id="tf-30m">三十分</button>
                    <button onclick="setTimeframe('1H')" class="timeframe-btn flex-shrink-0" id="tf-1H">一時</button>
                    <button onclick="setTimeframe('1D')" class="timeframe-btn flex-shrink-0" id="tf-1D">日</button>
                </div>
            </div>
            
            <div class="flex-1 min-h-[220px] flex items-end gap-[2px] px-1 border-b-2 border-white/20 overflow-hidden relative bg-black/30 rounded-xl p-2 shadow-inner">
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-10 text-3xl font-black tracking-widest text-white">量能波段趨勢</div>
                <div id="volume-bars" class="flex items-end gap-[3px] w-full h-full relative z-10"></div>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 relative z-10">
                <!-- KD -->
                <div class="bg-black/50 border border-white/10 p-3 rounded-xl shadow-inner flex flex-col justify-center">
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1 block">凱迪 (KD)</span>
                    <div class="flex items-baseline justify-around">
                        <span id="kd-k" class="text-xl font-mono font-black text-sky-400 drop-shadow-md">K --</span>
                        <span id="kd-d" class="text-xl font-mono font-black text-orange-400 drop-shadow-md">D --</span>
                    </div>
                </div>
                <!-- MACD -->
                <div class="bg-black/50 border border-white/10 p-3 rounded-xl shadow-inner text-center flex flex-col justify-center">
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1 block">動能 (MACD)</span>
                    <div id="macd-val" class="text-2xl font-mono font-black text-white drop-shadow-md">---</div>
                </div>
                <!-- RSI -->
                <div class="bg-black/50 border border-white/10 p-3 rounded-xl shadow-inner text-center flex flex-col justify-center">
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1 block">相對強弱 (RSI)</span>
                    <div id="rsi-val" class="text-2xl font-mono font-black text-purple-400 drop-shadow-md">---</div>
                </div>
                <!-- BIAS -->
                <div class="bg-black/50 border border-white/10 p-3 rounded-xl shadow-inner text-center flex flex-col justify-center">
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1 block">乖離率 (BIAS)</span>
                    <div id="bias-val" class="text-2xl font-mono font-black text-white drop-shadow-md">---</div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 自選城池設定 Modal -->
<div id="custom-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div class="glass rounded-2xl p-5 w-full max-w-sm shadow-2xl border-yellow-500/20">
        <h2 class="text-xl font-black tracking-widest text-center mb-1 text-yellow-400">統帥自選城池</h2>
        <p class="text-[10px] text-gray-400 font-bold mb-4 text-center tracking-widest">僅限輸入台灣股市代號</p>
        
        <div class="space-y-3 mb-4 bg-black/40 p-4 rounded-xl border border-white/10">
            <input id="custom-symbol" type="text" placeholder="台股代號 如 2603" class="w-full bg-black/60 border border-white/20 rounded-lg px-3 py-2.5 text-white focus:border-yellow-500 outline-none font-mono text-sm uppercase">
            <input id="custom-name" type="text" placeholder="城池名稱 如 長榮" class="w-full bg-black/60 border border-white/20 rounded-lg px-3 py-2.5 text-white focus:border-yellow-500 outline-none text-sm">
            <button onclick="addCustomStock()" class="w-full bg-blue-600 hover:bg-blue-500 py-2.5 rounded-lg font-bold text-sm mt-2 transition-all shadow-lg cursor-pointer">編列入軍</button>
        </div>
        
        <div class="border-t border-white/10 pt-3">
            <h3 class="text-[10px] text-gray-400 font-bold uppercase mb-2 px-1 tracking-widest">已編制自選陣列</h3>
            <div id="custom-stock-list" class="space-y-2 max-h-40 overflow-y-auto pr-1 scrollbar-hide"></div>
        </div>
        <button onclick="closeCustomManager()" class="mt-5 w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold text-sm transition-all cursor-pointer">完成配置</button>
    </div>
</div>

<!-- API Key 設定 Modal -->
<div id="api-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div class="glass rounded-2xl p-6 w-full max-w-sm border-white/20 shadow-2xl">
        <h2 class="text-xl font-black text-center mb-2 tracking-widest text-sky-400">天道連線金鑰</h2>
        <p class="text-[11px] text-gray-400 mb-5 text-center leading-relaxed">預設使用全域代理爬蟲。<br>若有 Finnhub 專屬金鑰可於此填寫。</p>
        <div class="space-y-4">
            <input id="api-key-input" type="text" placeholder="留空使用預設免費通道" class="w-full bg-black/60 border border-white/20 rounded-lg px-4 py-3 text-white focus:border-sky-500 outline-none font-mono text-sm">
            <div class="flex gap-3 pt-2">
                <button onclick="closeApiSettings()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-3 rounded-xl font-bold text-sm transition-colors cursor-pointer">取消</button>
                <button onclick="saveApiKey()" class="flex-1 bg-sky-600 hover:bg-sky-500 py-3 rounded-xl font-bold text-sm text-white shadow-lg transition-colors cursor-pointer">儲存設定</button>
            </div>
        </div>
    </div>
</div>

<!-- 報表 Modal -->
<div id="report-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
    <div id="modal-window" class="glass rounded-2xl p-6 w-full max-w-md border-purple-500/40 transform scale-95 transition-transform duration-300 shadow-[0_0_30px_rgba(168,85,247,0.15)]">
        <div id="modal-body"></div>
        <button onclick="closeModal()" class="mt-6 w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-black text-sm text-white shadow-lg transition-all active:scale-95 cursor-pointer tracking-widest">關閉報表</button>
    </div>
</div>

<!-- 吐司訊息 (Toast) -->
<div id="msg-box" class="fixed top-16 md:bottom-24 md:top-auto left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md px-5 py-2.5 rounded-full text-xs md:text-sm font-bold opacity-0 transition-all duration-300 z-[60] pointer-events-none text-center w-max max-w-[85vw] border border-white/20 text-white tracking-widest shadow-[0_10px_25px_rgba(0,0,0,0.8)] whitespace-nowrap"></div>

<script>
// ==========================================
// 1. 全域工具函式與防呆機制 (確保不會出現 ReferenceError 或 NaN)
// ==========================================
function safeNum(val, fallback = 0) {
    const n = Number(val);
    return (isNaN(n) || !isFinite(n)) ? fallback : n;
}

let msgTimeout;
function showMsg(t) { 
    const el = document.getElementById('msg-box'); 
    el.innerText = t; 
    el.classList.remove('opacity-0', 'translate-y-4'); 
    el.classList.add('opacity-100', 'translate-y-0');
    if(msgTimeout) clearTimeout(msgTimeout);
    msgTimeout = setTimeout(()=>{ 
        el.classList.remove('opacity-100', 'translate-y-0'); 
        el.classList.add('opacity-0', 'translate-y-4'); 
    }, 3000); 
}

function triggerThunder() { 
    const o = document.getElementById('thunder-overlay'); if(!o) return;
    o.classList.remove('thunder-flash','gold-thunder-flash','sim-thunder-flash'); 
    void o.offsetWidth; o.classList.add('thunder-flash'); 
    setTimeout(()=>o.classList.remove('thunder-flash'), 500); 
}
function triggerGoldThunder() { 
    const o = document.getElementById('thunder-overlay'); if(!o) return;
    o.classList.remove('thunder-flash','gold-thunder-flash','sim-thunder-flash'); 
    void o.offsetWidth; o.classList.add('gold-thunder-flash'); 
    setTimeout(()=>o.classList.remove('gold-thunder-flash'), 800); 
}
function triggerSimThunder() { 
    const o = document.getElementById('thunder-overlay'); if(!o) return;
    o.classList.remove('thunder-flash','gold-thunder-flash','sim-thunder-flash'); 
    void o.offsetWidth; o.classList.add('sim-thunder-flash'); 
    setTimeout(()=>o.classList.remove('sim-thunder-flash'), 800); 
}

// ==========================================
// 2. 核心變數、領域資料與本地記憶體 (LocalStorage)
// ==========================================
let USER_API_KEY = localStorage.getItem('abula_api_key') || '';
let apiPollingInterval = null;

const SECTORS = {
    "SEMICON": { name: "半導體 領域", cities: ["2330", "2454", "2303"] },
    "COMPUTER": { name: "電腦週邊 領域", cities: ["2317", "2382", "3231"] },
    "NETWORK": { name: "通信網路 領域", cities: ["2412", "3045", "4904"] },
    "CUSTOM": { name: "統帥自選 領域", cities: [] }
};

const CITIES = {
    "2330": { name: "台積電", price: 825.0, basePrice: 825.0, realPrice: 825.0, simBasePrice: 825.0, vol: 3.5, bars: {} },

// 具象化巨石城池
function createCastle() {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({color: 0x556677, roughness: 0.8, metalness: 0.2});
    const wall = new THREE.Mesh(new THREE.BoxGeometry(10, 18, 60), mat);
    wall.position.set(-35, 9, 0);
    group.add(wall);
    
    // 城垛
    for(let z = -28; z <= 28; z+=8) {
        const battlement = new THREE.Mesh(new THREE.BoxGeometry(10, 4, 4), mat);
        battlement.position.set(-35, 20, z);
        group.add(battlement);
    }
    return group;
}

// 具象化幽暗松樹林
function createForest() {
    const group = new THREE.Group();
    const trunkMat = new THREE.MeshStandardMaterial({color: 0x4a2e15, roughness: 1.0});
    const leafMat = new THREE.MeshStandardMaterial({color: 0x1c592c, roughness: 0.9, flatShading: true});
    
    for(let i=0; i<40; i++) {
        const tree = new THREE.Group();
        const scale = 0.8 + Math.random()*0.6;
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, 5), trunkMat);
        trunk.position.y = 2.5;
        const leaves1 = new THREE.Mesh(new THREE.ConeGeometry(4, 9, 5), leafMat);
        leaves1.position.y = 7;
        const leaves2 = new THREE.Mesh(new THREE.ConeGeometry(3, 7, 5), leafMat);
        leaves2.position.y = 11;
        tree.add(trunk, leaves1, leaves2);
        
        tree.scale.set(scale, scale, scale);
        tree.position.set(30 + Math.random()*20, 0, (Math.random()-0.5)*70);
        group.add(tree);
    }
    return group;
}

// 立體戰棋武將 (取代方塊)
function createSoldier(colorHex, isPlayer) {
    const group = new THREE.Group();
    const scale = isPlayer ? 1.6 : 1.0; 
    const mat = new THREE.MeshStandardMaterial({
        color: colorHex, emissive: isPlayer ? colorHex : 0x000000,
        emissiveIntensity: isPlayer ? 0.4 : 0, metalness: 0.6, roughness: 0.4
    });

    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3*scale, 0.5*scale, 1.8*scale, 6), mat);
    body.position.y = 0.9 * scale;
    group.add(body);

    const head = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4*scale), mat);
    head.position.y = 2.0 * scale;
    group.add(head);

    if (isPlayer) {
        const wpn = new THREE.Mesh(new THREE.CylinderGeometry(0.05*scale, 0.05*scale, 3.5*scale, 4), new THREE.MeshStandardMaterial({color: 0xffdd88, emissive: 0xffdd88, emissiveIntensity: 1}));
        wpn.position.set(0.6*scale, 1.2*scale, 0.5*scale); 
        wpn.rotation.x = Math.PI/3;
        group.add(wpn);
        
        const ring = new THREE.Mesh(new THREE.RingGeometry(0.8*scale, 1.0*scale, 16), new THREE.MeshBasicMaterial({color: colorHex, transparent: true, opacity: 0.6}));
        ring.rotation.x = -Math.PI/2;
        ring.position.y = 0.05;
        group.add(ring);
    }

    group.userData = { isAttacking: false, isPlayer: isPlayer, active: true };
    return group;
}

function initParticles() {
    const geom = new THREE.BufferGeometry();
    const pos = new Float32Array(150 * 3);
    const vel = [];
    for (let i=0; i<150; i++) { pos[i*3]=0; pos[i*3+1]=-100; pos[i*3+2]=0; vel.push({x:0,y:0,z:0}); }
    geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    particles = new THREE.Points(geom, new THREE.PointsMaterial({color: 0xffcc00, size: 0.8, transparent: true, opacity: 0, blending: THREE.AdditiveBlending}));
    particles.userData = { vel: vel, active: false, life: 0 };
    scene.add(particles);
}

function triggerClashParticles(x, side) {
    if(!particles) return;
    particles.position.x = x;
    particles.material.opacity = 1;
    particles.material.color.setHex(side==='LONG' ? 0xff4444 : 0x44ff44);
    particles.userData.active = true;
    particles.userData.life = 1;
    
    const pos = particles.geometry.attributes.position.array;
    for (let i=0; i<150; i++) {
        pos[i*3]=0; pos[i*3+1]=1+Math.random()*4; pos[i*3+2]=(Math.random()-0.5)*40;
        particles.userData.vel[i] = { x:(Math.random()-0.5)*3, y:Math.random()*4, z:(Math.random()-0.5)*2 };
    }
    particles.geometry.attributes.position.needsUpdate = true;
}

function updateParticles() {
    if(!particles || !particles.userData.active) return;
    particles.userData.life -= 0.03;
    particles.material.opacity = Math.max(0, particles.userData.life);
    if(particles.userData.life <= 0) { particles.userData.active = false; return; }
    
    const pos = particles.geometry.attributes.position.array;
    for (let i=0; i<150; i++) {
        pos[i*3] += particles.userData.vel[i].x;
        pos[i*3+1] += particles.userData.vel[i].y;
        pos[i*3+2] += particles.userData.vel[i].z;
        particles.userData.vel[i].y -= 0.15;
        if(pos[i*3+1]<0) pos[i*3+1]=0;
    }
    particles.geometry.attributes.position.needsUpdate = true;
}

function init3D() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02050a, 0.012);
    
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // 強光照明解決太暗問題
    scene.add(new THREE.AmbientLight(0xffffff, 3.0));
    const dLight = new THREE.DirectionalLight(0xffffff, 4.0);
    dLight.position.set(20, 100, 40); 
    scene.add(dLight);
    
    const grid = new THREE.GridHelper(200, 80, 0x223344, 0x0a1122);
    grid.position.y = 0.01; scene.add(grid);
    
    battleLine = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.2, 60), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 }));

// 產生方陣兵力 (市場掛單厚度)
function spawnBasePhalanx() {
    const cols = Math.floor(MAX_PHALANX_SIZE / 4);
    for(let i=0; i<MAX_PHALANX_SIZE; i++) {
        const r = Math.floor(i / cols);
        const c = i % cols;
        const zPos = (c - cols/2 + 0.5) * 5;
        
        const rm = createSoldier(0x882222, false);
        rm.userData.baseX = -12 - r*3;
        rm.position.set(rm.userData.baseX, 0, zPos);
        baseRedArmy.push(rm); scene.add(rm);
        
        const gm = createSoldier(0x226622, false);
        gm.userData.baseX = 12 + r*3;
        gm.position.set(gm.userData.baseX, 0, zPos);
        baseGreenArmy.push(gm); scene.add(gm);
    }
}

function spawnPlayerTroop(side) {
    const m = createSoldier(side==='LONG'?0xff3333:0x33ff33, true);
    m.userData.baseX = side==='LONG' ? -8 : 8;
    m.position.set(m.userData.baseX, 0, (Math.random()-0.5)*20);
    scene.add(m);
    if(side==='LONG') playerRedArmy.push(m); else playerGreenArmy.push(m);
}

function syncPlayerTroopsFromState() {
    playerRedArmy.forEach(m => scene.remove(m)); playerGreenArmy.forEach(m => scene.remove(m));
    playerRedArmy = []; playerGreenArmy = [];
    gameState.units.forEach(u => { if(u.city === gameState.activeCity) spawnPlayerTroop(u.side); });
}

// 實質成交：躍擊衝刺動畫
function triggerAttackAnim(side, magnitude = 1) {
    const attackCount = Math.max(3, Math.min(15, Math.floor(magnitude * 10)));
    const baseArmy = side === 'LONG' ? baseRedArmy : baseGreenArmy;
    const available = baseArmy.filter(m => m.userData.active && !m.userData.isAttacking);
    
    available.sort((a, b) => side === 'LONG' ? b.position.x - a.position.x : a.position.x - b.position.x);
    const attackers = available.slice(0, attackCount);
    const dir = side === 'LONG' ? 1 : -1; 
    
    attackers.forEach(m => {
        m.userData.isAttacking = true;
        const origX = m.position.x;
        new TWEEN.Tween(m.position)
            .to({ x: battleLine.position.x - (dir*1.5), y: 3 }, 150) 
            .easing(TWEEN.Easing.Quadratic.Out)
            .onComplete(() => {
                new TWEEN.Tween(m.position)
                    .to({ x: m.userData.baseX, y: 0 }, 400) 
                    .easing(TWEEN.Easing.Quadratic.In)
                    .onComplete(() => m.userData.isAttacking = false)
                    .start();
            }).start();
    });

    const playerArmy = side === 'LONG' ? playerRedArmy : playerGreenArmy;
    playerArmy.forEach(m => {
        if (m.userData.isAttacking) return;
        m.userData.isAttacking = true;
        const origX = m.position.x;
        new TWEEN.Tween(m.position)
            .to({ x: origX + dir*5, y: 2 }, 150)
            .easing(TWEEN.Easing.Quadratic.Out)
            .yoyo(true).repeat(1)
            .onComplete(() => m.userData.isAttacking = false).start();
    });

    if(attackers.length > 0) {
        triggerClashParticles(battleLine.position.x, side);
        battleLine.material.color.setHex(0xffffff);
        setTimeout(() => battleLine.material.color.setHex(side==='LONG'?0xef4444:0x22c55e), 200);
    }
}

function updateVisuals() {
    const city = CITIES[gameState.activeCity];
    if(!city) return;
    
    const activeBasePrice = isSimMode ? safeNum(city.simBasePrice, city.basePrice) : safeNum(city.basePrice, 100);
    const p = safeNum(currentPrice, activeBasePrice);
    const diff = activeBasePrice > 0 ? (p - activeBasePrice) / activeBasePrice : 0;
    
    // 動態掛單厚度顯示
    const redActiveCount = Math.floor(Math.min(MAX_PHALANX_SIZE, Math.max(5, (MAX_PHALANX_SIZE/2) + diff * 500)));
    const greenActiveCount = Math.floor(Math.min(MAX_PHALANX_SIZE, Math.max(5, (MAX_PHALANX_SIZE/2) - diff * 500)));
    
    baseRedArmy.forEach((m, i) => { m.userData.active = (i < redActiveCount); m.visible = m.userData.active; });
    baseGreenArmy.forEach((m, i) => { m.userData.active = (i < greenActiveCount); m.visible = m.userData.active; });

    const drift = safeNum(diff * 350, 0);
    battleLine.position.x += (drift - battleLine.position.x) * 0.15;
    if(!battleLine.material.color.equals(new THREE.Color(0xffffff))) 
        battleLine.material.color.setHex(diff>=0?0xef4444:0x22c55e);

    const shift = drift * 0.3;
    [...baseRedArmy, ...playerRedArmy].forEach(m => { if(!m.userData.isAttacking) m.position.x += ((m.userData.baseX + shift) - m.position.x) * 0.1; });
    [...baseGreenArmy, ...playerGreenArmy].forEach(m => { if(!m.userData.isAttacking) m.position.x += ((m.userData.baseX + shift) - m.position.x) * 0.1; });
}

function animate() { 
    requestAnimationFrame(animate); 
    TWEEN.update(); updateParticles(); renderer.render(scene, camera); 
}

function getTaiwanTimeStr() { return new Date().toLocaleDateString('zh-TW', {timeZone: 'Asia/Taipei'}); }

function checkTimeEvents() {
    const now = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Taipei"}));
    const timeNum = now.getHours() * 100 + now.getMinutes();
    const todayStr = getTaiwanTimeStr();

    let newStatus = "CLOSED";
    if (timeNum >= 855 && timeNum < 900) newStatus = "PRE";
    else if (timeNum >= 900 && timeNum < 1330) newStatus = "OPEN";

    if (currentMarketState !== newStatus) {
        if (newStatus === "PRE" && isSimMode) forceCloseSimMode(true);
        if (newStatus === "OPEN") {
            if (isSimMode) forceCloseSimMode(false); 
            processOvernightDividend(todayStr);
            if (gameState.pendingSimReward > 0) {
                gameState.balance += gameState.pendingSimReward;
                triggerGoldThunder();
                showMsg(`開盤天降甘霖！發放沙盤獎勵 ${Math.floor(gameState.pendingSimReward)} 天幣！`);
                gameState.pendingSimReward = 0; saveState();
            }
        }
        currentMarketState = newStatus;
        updateOrderButtonsUI();
    }

    const label = document.getElementById('market-status-label');
    const simBtn = document.getElementById('sim-btn');
    
    if (isSimMode) {
        label.innerText = "沙盤推演 獨立時空";
        label.className = "text-[10px] md:text-xs text-sky-300 font-bold uppercase tracking-widest bg-sky-500/20 px-2 py-1 rounded border border-sky-500/30 animate-pulse";
        simBtn.innerText = "結束推演";
        simBtn.className = "bg-red-600 hover:bg-red-500 px-2.5 py-1.5 rounded text-[10px] text-white font-bold transition-all shadow-md";
        simBtn.classList.remove('hidden');
    } else {
        if (currentMarketState === "OPEN") {
            label.innerText = "真實天道 運轉中";
            label.className = "text-[10px] md:text-xs text-yellow-400 font-bold uppercase tracking-widest bg-yellow-500/20 px-2 py-1 rounded border border-yellow-500/30";
            simBtn.classList.add('hidden');
        } else if (currentMarketState === "PRE") {
            label.innerText = "盤前試撮 準備開戰";
            label.className = "text-[10px] md:text-xs text-orange-400 font-bold uppercase tracking-widest bg-orange-500/20 px-2 py-1 rounded border border-orange-500/30";
            simBtn.classList.add('hidden');
        } else {
            label.innerText = "天道休市 盤後時段";
            label.className = "text-[10px] md:text-xs text-gray-400 font-bold uppercase tracking-widest bg-white/10 px-2 py-1 rounded border border-white/20";
            simBtn.innerText = "啟動沙盤";
            simBtn.className = "bg-sky-600 hover:bg-sky-500 px-2.5 py-1.5 rounded text-[10px] text-white font-bold shadow-[0_0_10px_rgba(2,132,199,0.5)] transition-all animate-pulse";
            simBtn.classList.remove('hidden');
        }
    }
}

function processOvernightDividend(todayStr) {
    if (gameState.lastDividendDay === todayStr) return; 
    let div = 0;
    gameState.units.forEach(u => {
        if (u.entryDate && u.entryDate !== todayStr && !u.isSim) {
            const city = CITIES[u.city];
            if (city) div += (safeNum(city.price, city.basePrice) * u.qty * 1000 * 0.005);
        }
    });
    // 從此處開始移除扣除天道國庫的邏輯，專注於統帥獲利
    if (div > 0) {
        gameState.balance += div;
        triggerGoldThunder(); showMsg(`持久戰甘霖 榮獲 ${Math.floor(div).toLocaleString()} 天幣`);
    }
    gameState.lastDividendDay = todayStr; saveState();
}

function toggleSimMode() {
    if (currentMarketState === "OPEN" || currentMarketState === "PRE") { showMsg("真實天道運行中 禁止沙盤推演"); return; }
    if (isSimMode) forceCloseSimMode(false);
    else {
        realStateSnapshot = JSON.parse(JSON.stringify(gameState)); isSimMode = true;
        
        // 進入沙盤時，將所有城池的昨收(simBasePrice)設定為當前真實價格
        Object.keys(CITIES).forEach(c => {
            CITIES[c].simBasePrice = safeNum(CITIES[c].price, CITIES[c].basePrice);
        });
        
        document.getElementById('real-pnl-container').classList.add('hidden');
        document.getElementById('sim-pnl-container').classList.remove('hidden');
        document.getElementById('base-price-label').innerText = '沙盤基準';
        
        ['main-dashboard','tab-container','order-panel'].forEach(id => {
            document.getElementById(id).classList.replace('glass', 'glass-sim');
        });
        triggerSimThunder(); showMsg("進入沙盤時空 資金獨立計算"); 
        updateOrderButtonsUI(); updateUI();
    }
}

function forceCloseSimMode(isAuto) {
    if (!isSimMode || !realStateSnapshot) return;
    const simNet = safeNum(gameState.balance) + safeNum(gameState.frozen);
    const realNet = safeNum(realStateSnapshot.balance) + safeNum(realStateSnapshot.frozen);
    const profit = simNet - realNet;

    gameState = JSON.parse(JSON.stringify(realStateSnapshot)); realStateSnapshot = null; isSimMode = false;

    let msg = "沙盤結束 本金還原";
    if (profit > 0) {
        const reward = profit * 0.005; gameState.pendingSimReward = safeNum(gameState.pendingSimReward) + reward;
        msg = `沙盤獲利！獎勵 ${Math.floor(reward)} 天幣明日發放`; triggerGoldThunder();
    } else { triggerThunder(); if(isAuto) msg = "試撮啟動 強制結束練兵"; }

    Object.keys(CITIES).forEach(c => CITIES[c].price = safeNum(CITIES[c].realPrice, CITIES[c].basePrice));
    currentPrice = safeNum(CITIES[gameState.activeCity].price); syncPlayerTroopsFromState();

    document.getElementById('sim-pnl-container').classList.add('hidden');
    document.getElementById('real-pnl-container').classList.remove('hidden');
    document.getElementById('base-price-label').innerText = '昨收';
    ['main-dashboard','tab-container','order-panel'].forEach(id => document.getElementById(id).classList.replace('glass-sim', 'glass'));
    
    showMsg(msg); saveState(); updateOrderButtonsUI(); updateUI();
}

async function fetchRealMarketData() {
    const cityCode = gameState.activeCity;
    const city = CITIES[cityCode];
    if (!city) return;

    let fetchedPrice = null, fetchedBase = null;
    try {
        if (USER_API_KEY) {
            const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${cityCode}&token=${USER_API_KEY}`);
            if (res.ok) { const data = await res.json(); if(data.c) { fetchedPrice = data.c; fetchedBase = data.pc; } }
        }
        if (!fetchedPrice) {
            const ySym = /^\d{4}$/.test(cityCode) ? cityCode + '.TW' : cityCode;
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ySym}`;
            try {
                const res = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(url)}`);
                if (res.ok) { const data = await res.json(); fetchedPrice = data.chart.result[0].meta.regularMarketPrice; fetchedBase = data.chart.result[0].meta.previousClose; }
            } catch(e) {
                const res2 = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
                if (res2.ok) { const data2 = await res2.json(); fetchedPrice = data2.chart.result[0].meta.regularMarketPrice; fetchedBase = data2.chart.result[0].meta.previousClose; }
            }
        }
        const p = parseFloat(fetchedPrice);
        if (!isNaN(p) && p > 0) {
            city.realPrice = p; city.basePrice = parseFloat(fetchedBase) || city.realPrice;
            if (!isSimMode) { city.price = city.realPrice; currentPrice = city.price; }
            if(!city.bars[gameState.timeframe]) initKbars(city);
            city.bars[gameState.timeframe].push({ p: p, v: 100+Math.random()*900 });
            if(city.bars[gameState.timeframe].length > 100) city.bars[gameState.timeframe].shift();
        }
    } catch(e) {}
}

function initKbars(city) {
    city.bars = { "1m": [], "5m": [], "15m": [], "30m": [], "1H": [], "1D": [], "1W": [] };
    let tempP = safeNum(city.basePrice, 100);
    for(let i=0; i<100; i++){
        tempP += (Math.random()-0.5) * (safeNum(city.basePrice, 100)*0.01);
        if(tempP<=0.1) tempP=0.1;
        Object.keys(city.bars).forEach(tf => city.bars[tf].push({ p: tempP, v: 100+Math.random()*900 }));
    }
}

function startMarketPolling() {
    if(apiPollingInterval) clearInterval(apiPollingInterval);
    apiPollingInterval = setInterval(fetchRealMarketData, 5000); fetchRealMarketData();
}

function localTick() {
    checkTimeEvents();
    const city = CITIES[gameState.activeCity];
    
    // 沙盤推演跳動：圍繞 simBasePrice 上下 5%
    if (isSimMode && city) {
        const bp = safeNum(city.simBasePrice, city.basePrice);
        const maxDev = bp * 0.05;
        let newPrice = safeNum(city.price, bp) + (Math.random() - 0.5) * safeNum(city.vol, 2.0) * 2;
        if (isNaN(newPrice) || newPrice <= 0.1) newPrice = bp;
        if (newPrice > bp + maxDev) newPrice = bp + maxDev;
        if (newPrice < bp - maxDev) newPrice = bp - maxDev;
        city.price = newPrice; currentPrice = city.price;
        
        // 更新圖表資料
        if(!city.bars[gameState.timeframe]) initKbars(city);
        city.bars[gameState.timeframe].push({ p: newPrice, v: 100+Math.random()*900 });
        if(city.bars[gameState.timeframe].length > 100) city.bars[gameState.timeframe].shift();
    }

    const jumpMag = Math.abs(currentPrice - lastPriceForAnim);
    if (jumpMag > 0.01) {
        if (currentPrice > lastPriceForAnim) triggerAttackAnim('LONG', jumpMag);
        else triggerAttackAnim('SHORT', jumpMag);
        lastPriceForAnim = currentPrice;
    }

    if (isSimMode || currentMarketState !== "PRE") checkPendingOrders();
    
    updateVisuals();
    if(!document.getElementById('chart-page').classList.contains('hidden')) updateCharts();
    updateUI();
}

function switchSector(code) {

    if (SECTORS[code].cities.length === 0) {
        sel.appendChild(new Option("尚無城池", "")); currentPrice = 0; lastPriceForAnim = 0; document.getElementById('market-price').innerText = "---"; return;
    }
    SECTORS[code].cities.forEach(c => sel.appendChild(new Option(CITIES[c]?.name || c, c)));

}

function switchCity(code) {
    if (!code || !CITIES[code]) return;
    gameState.activeCity = code;
    if (!CITIES[code].bars || Object.keys(CITIES[code].bars).length === 0) initKbars(CITIES[code]);
    currentPrice = safeNum(CITIES[code].price, CITIES[code].basePrice); lastPriceForAnim = currentPrice;
    
    document.getElementById('chart-city-name').innerText = CITIES[code].name;
    showMsg(`軍令轉移 至 ${CITIES[code].name}`);
    syncPlayerTroopsFromState();
    if(battleLine) battleLine.material.color.setHex(0xffffff);
    if(!isSimMode) fetchRealMarketData();
}

function issueOrder(side) {
    if (currentMarketState === "CLOSED" && !isSimMode) { showMsg("天道休市期間 僅開放沙盤練兵下單"); triggerThunder(); return; }
    
    const qty = parseInt(document.getElementById('order-qty').value) || 0;
    const tPrice = parseFloat(document.getElementById('order-price').value) || currentPrice;
    if(qty <= 0 || !gameState.activeCity) return;
    
    // 安全取值，避免 NaN
    const validCurrentPrice = safeNum(currentPrice, safeNum(CITIES[gameState.activeCity]?.basePrice, 100));
    
    if(gameState.units.find(u => u.city === gameState.activeCity && u.side !== side)){ showMsg("立場衝突 請先結算目前兵力"); triggerThunder(); return; }

    const vol = tPrice * qty * 1000;
    const tax = vol * TAX_RATE, fee = vol * FEE_RATE, total = vol + tax + fee;
    if(gameState.balance < total){ showMsg("存銀不足 無法派遣"); triggerThunder(); return; }

    let immediate = false;
    // 沙盤模式或非試撮期間，進行即時判斷
    if(isSimMode || currentMarketState !== "PRE") {
        if(side === 'LONG' && tPrice >= validCurrentPrice) immediate = true;
        if(side === 'SHORT' && tPrice <= validCurrentPrice) immediate = true;
    }

    if(immediate){
        gameState.balance -= total;
        executeOrder({ city: gameState.activeCity, side, qty, tax, fee, isSim: isSimMode }, validCurrentPrice);
        showMsg("市價滿足 立即出征");
    } else {
        gameState.balance -= total; gameState.frozen += total;
        gameState.pending.push({ id: Date.now(), city: gameState.activeCity, side, qty, price: tPrice, totalCost: total, tax, fee, isSim: isSimMode });
        showMsg("進入埋伏 等候滿足價位");
    }
    saveState(); updateUI();
}

function checkPendingOrders() {
    for(let i=gameState.pending.length-1; i>=0; i--){
        const o = gameState.pending[i]; const m = safeNum(CITIES[o.city]?.price, 0);
        if (m <= 0.1) continue;
        if((o.side === 'LONG' && m <= o.price) || (o.side === 'SHORT' && m >= o.price)){
            gameState.pending.splice(i,1); executeOrder(o, m); showMsg(`天道撮合 ${CITIES[o.city].name} 入城`); saveState();
        }
    }
}

function executeOrder(o, fP) {
    if(o.totalCost) gameState.frozen -= o.totalCost;
    const vol = fP * o.qty * 1000; const aTax = vol * TAX_RATE, aFee = vol * FEE_RATE;
    if(!isSimMode) gameState.taxTotal += (aTax + aFee);

    gameState.units.push({
        id: Date.now() + Math.random(), city: o.city, side: o.side, qty: o.qty,
        cost: (vol + aTax + aFee) / (o.qty * 1000), entry: fP, tax: aTax, fee: aFee,
        time: new Date().toLocaleTimeString('zh-TW', { hour12: false }), entryDate: getTaiwanTimeStr(), isSim: o.isSim || isSimMode
    });
    if(o.city === gameState.activeCity) spawnPlayerTroop(o.side);
    saveState();
}

function settle(id) {
    const idx = gameState.units.findIndex(u => u.id === id); if (idx === -1) return;
    const u = gameState.units[idx]; const city = CITIES[u.city];
    const validPrice = safeNum(city.price, city.basePrice);
    
    const vol = validPrice * u.qty * 1000;
    const isDayTrade = u.entryDate === getTaiwanTimeStr();
    const tax = vol * (isDayTrade ? 0.0015 : TAX_RATE), fee = vol * FEE_RATE;
    const pnl = u.side === 'LONG' ? (validPrice - u.cost)*u.qty*1000 : (u.cost - validPrice)*u.qty*1000;
    
    gameState.balance += (vol - tax - fee); 
    if(!isSimMode) { gameState.taxTotal += (tax + fee); gameState.realizedPnl += pnl; }
    
    const rep = { ...u, exit: validPrice, eTax: tax, eFee: fee, pnl, isDayTrade };
    gameState.history.unshift(rep); gameState.units.splice(idx,1);
    
    if(u.city === gameState.activeCity) removePlayerTroop(u.side);
    saveState(); showWarReport(rep); updateUI();
}

function cancelOrder(id) {
    const idx = gameState.pending.findIndex(o => o.id === id); if (idx === -1) return;
    const o = gameState.pending[idx];
    gameState.balance += safeNum(o.totalCost); gameState.frozen -= safeNum(o.totalCost);
    gameState.pending.splice(idx, 1); showMsg("撤回軍令 資金歸庫"); saveState(); updateUI();
}

function updateCharts() {
    const city = CITIES[gameState.activeCity]; if(!city || !city.bars) return;
    const bars = city.bars[gameState.timeframe] || []; if(bars.length < 9) return;

    const activeBasePrice = isSimMode ? safeNum(city.simBasePrice, city.basePrice) : safeNum(city.basePrice, 100);
    const recentPrices = bars.slice(-9).map(b => safeNum(b.p, activeBasePrice));
    const low = Math.min(...recentPrices), high = Math.max(...recentPrices);
    const validCurrent = safeNum(currentPrice, activeBasePrice);
    
    const rsv = high === low ? 50 : ((validCurrent - low)/(high - low))*100;
    const k = 50 * (2/3) + safeNum(rsv, 50) * (1/3), d = 50 * (2/3) + safeNum(k, 50) * (1/3);
    document.getElementById('kd-k').innerText = `K ${k.toFixed(1)}`; document.getElementById('kd-d').innerText = `D ${d.toFixed(1)}`;
    
    const macd = (validCurrent * 0.03); 
    const mEl = document.getElementById('macd-val'); mEl.innerText = safeNum(macd, 0).toFixed(2);
    mEl.className = `text-2xl font-mono font-black drop-shadow-md ${macd >= 0 ? 'text-red-400' : 'text-green-400'}`;

    const rsi = Math.min(100, Math.max(0, 50 + (validCurrent - activeBasePrice) * 5));
    document.getElementById('rsi-val').innerText = safeNum(rsi, 50).toFixed(1);
    
    const bias = low > 0 ? ((validCurrent - low) / low) * 100 : 0;
    document.getElementById('bias-val').innerText = safeNum(bias, 0).toFixed(2) + " %";

    const vC = document.getElementById('volume-bars'); vC.innerHTML = '';
    const maxV = Math.max(...bars.map(b => safeNum(b.v, 1)), 1);
    bars.slice(-(window.innerWidth < 768 ? 40 : 80)).forEach(b => {
        const vB = document.createElement('div'); 
        vB.className = `flex-1 rounded-t min-w-[2px] ${macd >= 0 ? 'bg-red-500/60' : 'bg-green-500/60'}`;
        vB.style.height = `${Math.max((safeNum(b.v,0)/maxV)*100, 5)}%`; vC.appendChild(vB);
    });
}

function renderLists() {
    const cont = document.getElementById(`tab-content-${gameState.currentTab}`); if(!cont) return; cont.innerHTML = '';
    
    if(gameState.currentTab === 'units'){
        if(gameState.units.length === 0) {

        } else {
            gameState.units.forEach(u => {
                const c = CITIES[u.city]; 
                const m = c ? safeNum(c.price, c.basePrice) : safeNum(u.entry, 0);
                const costVal = safeNum(u.cost);
                const principal = costVal * u.qty * 1000;
                
                const p = (u.side==='LONG' ? (m-costVal) : (costVal-m))*u.qty*1000;
                const roi = principal > 0 ? (p / principal) * 100 : 0;
                const roiStr = roi >= 0 ? `+${roi.toFixed(2)} %` : `${roi.toFixed(2)} %`;
                const totalValue = principal + p; 
                
                const tag = u.isSim ? '<span class="bg-sky-500/20 border border-sky-500/30 text-sky-400 px-1.5 py-0.5 rounded text-[8px] ml-1 tracking-widest">沙盤推演</span>' : '';
                
                cont.innerHTML += `
                <div class="bg-black/40 rounded-xl p-3 md:p-4 border-r-4 ${p>=0?'border-red-500':'border-green-500'} mb-3 shadow-inner">
                    <div class="flex justify-between items-start border-b border-white/10 pb-2 mb-2">
                        <div>
                            <div class="flex items-center gap-1.5 mb-1">
                                <span class="text-sm text-gray-200 font-bold">${c?.name || u.city}</span>
                                <span class="${u.side==='LONG'?'text-red-400 bg-red-400/10':'text-green-400 bg-green-400/10'} px-1.5 py-0.5 rounded text-[10px] font-bold tracking-widest">${u.side==='LONG'?'做多':'做空'}</span>
                                ${tag}
                            </div>
                            <div class="text-[10px] text-gray-400 tracking-widest">派遣 <span class="text-white font-mono">${safeNum(u.qty).toFixed(1)}</span> 營</div>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <span class="text-[9px] text-gray-500 tracking-widest mb-0.5">未實現戰功</span>
                            <div class="text-sm md:text-base font-black font-mono ${p>=0?'text-red-500':'text-green-500'}">${p>=0?'加':'減'} ${Math.abs(Math.floor(safeNum(p))).toLocaleString()}</div>
                            <div class="text-[10px] font-bold ${p>=0?'text-red-400':'text-green-400'}">${roiStr}</div>
                        </div>
                    </div>
                    <div class="flex justify-between text-[10px] mb-3 px-1">
                        <div class="flex flex-col">
                            <span class="text-gray-500 tracking-widest mb-0.5">均價成本</span>
                            <span class="text-gray-200 font-mono">${costVal.toFixed(2)}</span>
                        </div>
                        <div class="flex flex-col text-center">
                            <span class="text-gray-500 tracking-widest mb-0.5">目前市價</span>
                            <span class="text-gray-200 font-mono">${m.toFixed(2)}</span>
                        </div>
                        <div class="flex flex-col text-right">
                            <span class="text-gray-500 tracking-widest mb-0.5">帳面戰力</span>
                            <span class="text-gray-200 font-mono">${Math.floor(totalValue).toLocaleString()}</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <button onclick="settle(${u.id})" class="text-[10px] bg-white/10 hover:bg-white/20 border border-white/20 px-4 py-2 rounded-lg transition-colors font-bold text-gray-300 tracking-widest cursor-pointer">結算撤軍</button>
                    </div>
                </div>`;
            });
        }
    } else if(gameState.currentTab === 'history'){
        if(gameState.history.length === 0) cont.innerHTML = '<div class="text-[10px] text-gray-600 text-center py-8 font-bold tracking-widest">尚無作戰紀錄</div>';
        gameState.history.slice(0, 15).forEach(h => {
            const tag = h.isSim ? '<span class="text-sky-400 font-bold">沙盤</span>' : '<span class="text-gray-400 font-bold">實戰</span>';
            cont.innerHTML += `<div class="bg-black/30 rounded-lg p-3 border-r-2 border-gray-600 text-right text-[10px] mb-2 opacity-80 shadow-inner">
                <span class="text-gray-500 font-mono tracking-tighter mr-2">${h.time}</span>
                <span class="text-gray-300 mr-2">${CITIES[h.city]?.name || h.city}</span>
                ${tag} <span class="font-mono font-bold text-[11px] ${h.pnl>=0?'text-red-400':'text-green-400'} ml-2">${Math.floor(safeNum(h.pnl)).toLocaleString()}</span>
            </div>`;
        });
    } else if(gameState.currentTab === 'pending'){
        if(gameState.pending.length === 0) cont.innerHTML = '<div class="text-[10px] text-gray-600 text-center py-8 font-bold tracking-widest">無待命軍令</div>';
        gameState.pending.forEach(o => {
            const tag = o.isSim ? '<span class="bg-sky-500/20 border border-sky-500/30 text-sky-400 px-1.5 py-0.5 rounded text-[8px] ml-2">沙盤推演</span>' : '';
            cont.innerHTML += `<div class="bg-black/40 rounded-xl p-3 border-r-4 border-gray-500 text-right mb-2 flex justify-between items-center shadow-inner">
                <button onclick="cancelOrder(${o.id})" class="text-[10px] bg-red-900/30 hover:bg-red-800/50 border border-red-500/30 text-red-300 px-3 py-1.5 rounded-lg transition-colors font-bold cursor-pointer">撤回</button>
                <div class="text-[11px] text-gray-300 font-bold">${CITIES[o.city]?.name || o.city} <span class="text-gray-500 ml-1 text-[9px] tracking-widest">待命價</span> <span class="font-mono text-sm">${safeNum(o.price).toFixed(2)}</span> ${tag}</div>
            </div>`;
        });
    }
}

window.onload = () => { loadState(); init3D(); switchSector("SEMICON"); startMarketPolling(); setInterval(localTick, 1000); updateOrderButtonsUI(); };
</script>
</body>
</html>
